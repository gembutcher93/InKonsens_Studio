document.addEventListener("change", (e) => {
  const field = e.target.dataset.field;
  if (field && draft) setField(field, e.target.value);
  if (field === "anagrafica.nascita" && draft){
    const eta = calcolaEta(e.target.value, draft.seduta && draft.seduta.dataApplicazione);
    if (eta !== null){
      const v = verdettoEta(eta, draft.tipoApplicazione || "tatuaggio", STUDIO_CONFIG.regione || "");
      if (v && v.minore){
        draft.minorenne = true;
        if (v.genitori === 2) draft.richiedeSecondaFirma = true;
      } else if (v && v.livello === "ok"){
        draft.minorenne = false;
      }
    }
    renderStepOnly();
    return;
  }
  const leadField = e.target.dataset.fieldLead;
  if (leadField && leadDraft) setLeadField(leadField, e.target.value);
  const studioField = e.target.dataset.fieldStudio;
  if (studioField){
    state.studioBuffer = { ...(state.studioBuffer||{}), [studioField]: e.target.value };
    if (studioField === "regione"){ applyStudioConfig(); state.studioSaved = false; render(); return; }
  }
  const authField = e.target.dataset.fieldAuth;
  if (authField){ state.authBuffer = { ...(state.authBuffer||{}), [authField]: e.target.value }; }
  const backupField = e.target.dataset.fieldBackup;
  if (backupField){ state.backupBuffer = { ...(state.backupBuffer||{}), [backupField]: e.target.value }; }
  const invField = e.target.dataset.invField;
  if (invField){ state.editBuffer = { ...(state.editBuffer||{}), [invField]: e.target.value }; }
  const apptFieldC = e.target.dataset.fieldAppt;
  if (apptFieldC && state.apptBuffer){ state.apptBuffer = { ...state.apptBuffer, [apptFieldC]: e.target.value }; }
  const wlFieldC = e.target.dataset.fieldWl;
  if (wlFieldC && state.waitlistBuffer){ state.waitlistBuffer = { ...state.waitlistBuffer, [wlFieldC]: e.target.value }; }
  const movFieldC = e.target.dataset.fieldMov;
  if (movFieldC && state.movBuffer){ state.movBuffer = { ...state.movBuffer, [movFieldC]: e.target.value }; }
  const guestFieldC = e.target.dataset.fieldGuest;
  if (guestFieldC && state.guestBuffer){ state.guestBuffer = { ...state.guestBuffer, [guestFieldC]: e.target.value }; }

  // selezione inchiostro/ago dall'archivio nello step seduta
  const selAction = e.target.dataset.action;
  if (selAction === "link-appuntamento-cliente" && state.apptBuffer){
    const v = e.target.value;
    if (!v){ state.apptBuffer.origine = { tipo: "manuale", id: null }; render(); return; }
    const [tipo, id] = v.split(":");
    if (tipo === "richiesta"){
      const r = getRichiesta(id);
      if (r){ state.apptBuffer.origine = { tipo: "richiesta", id: r.id }; state.apptBuffer.clienteNome = r.cliente.nome; state.apptBuffer.clienteCognome = r.cliente.cognome; state.apptBuffer.clienteTelefono = r.cliente.telefono; }
    } else if (tipo === "consenso"){
      const s = getSession(id);
      if (s){ state.apptBuffer.origine = { tipo: "consenso", id: s.id }; state.apptBuffer.clienteNome = s.anagrafica.nome; state.apptBuffer.clienteCognome = s.anagrafica.cognome; state.apptBuffer.clienteTelefono = s.anagrafica.telefono; if (STUDIO_CONFIG.artists.includes(s.artista)) state.apptBuffer.artista = s.artista; }
    }
    render();
    return;
  }
  if (selAction === "input-compenso-percentuale" && e.target.dataset.artista){
    const cfg = compensoArtista(e.target.dataset.artista);
    setCompensoArtista(e.target.dataset.artista, { ...cfg, percentuale: parseInt(e.target.value, 10) || 0 });
    return;
  }
  if (selAction === "input-compenso-quota" && e.target.dataset.artista){
    const cfg = compensoArtista(e.target.dataset.artista);
    setCompensoArtista(e.target.dataset.artista, { ...cfg, quotaFissa: parseFloat(e.target.value) || 0 });
    return;
  }
  if (selAction === "input-perc-ospitante"){
    setPercentualeVersoTitolareOspitante(e.target.value.trim());
    return;
  }
  if (selAction === "set-icon-pack"){
    setPacchettoIcone(e.target.value);
    render();
    return;
  }
  if (selAction === "seduta-add-ink" && e.target.value && draft){
    const ink = loadInks().find(x => x.id === e.target.value);
    if (ink){ draft.seduta.inchiostri = [ ...(draft.seduta.inchiostri||[]), { id: ink.id, nome: ink.nome, colore: ink.colore, lotto: ink.lotto, scadenza: ink.scadenza } ]; upsertSession(draft); renderStepOnly(); }
    return;
  }
  if (selAction === "seduta-add-needle" && e.target.value && draft){
    const nd = loadNeedles().find(x => x.id === e.target.value);
    if (nd){ draft.seduta.aghi = [ ...(draft.seduta.aghi||[]), { id: nd.id, marca: nd.marca, tipo: nd.tipo, lotto: nd.lotto, scadenza: nd.scadenza } ]; upsertSession(draft); renderStepOnly(); }
    return;
  }
  if (e.target.id === "forn-photo" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; } else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        state.editBuffer = { ...(state.editBuffer||{}), foto: cv.toDataURL("image/jpeg", 0.82) };
        render();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  if (e.target.id === "reference-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 480; // reference visiva, non serve piena risoluzione
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; } else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        leadDraft.referenceImg = cv.toDataURL("image/jpeg", 0.82);
        renderLeadStepOnly();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  if (e.target.id === "logo-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // riduci a max 256px lato lungo per non appesantire localStorage
        const max = 256;
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; }
        else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL("image/png");
        state.studioBuffer = { ...(state.studioBuffer||{}), logoDataUrl: dataUrl };
        render();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  /* risposta dell'assistenza: sostituisce solo la busta della password.
     Le altre due (frase e assistenza) restano quelle di prima. */
  if (e.target.id === "ickey-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    (async () => {
      try {
        const blocco = JSON.parse(await leggiFileTesto(file));
        if (!blocco.bustaPw || !blocco.saltPw) throw new Error("formato");
        const vault = loadVault() || {};
        saveVault({ ...vault, saltPw: blocco.saltPw, bustaPw: blocco.bustaPw, daRinnovare: true });
        state.recoveryMode = false; state.recoveryReset = false;
        state.loginError = null;
        state.backupMsg = "Sbloccato. Entra con l'ID studio e la password provvisoria che ti ho dato.";
      } catch(err){
        state.loginError = "Questo non è il file che ti ho rimandato io. Controlla di aver scelto quello giusto.";
      }
      e.target.value = "";
      render();
    })();
    return;
  }
  if (e.target.id === "login-restore-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      const doRestore = async (pw, frase) => {
        const res = await importBackup(reader.result, pw, frase);
        applyStudioConfig();
        state.locked = false; state.needsSetup = false; state.recoveryMode = false;
        state.loginError = null;
        state.backupMsg = `Ripristino riuscito: ${res.sessions} consensi. Ora sei dentro.`;
        render();
      };
      try { await doRestore(""); }
      catch(err){
        if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
          const pw = prompt("Questo backup è cifrato. Inserisci la password del backup.\n\nSe non la ricordi lascia vuoto e premi OK: ti chiedo le 12 parole.");
          if (pw == null) return;
          if (pw.trim()){
            try { await doRestore(pw); return; }
            catch(e2){
              if (e2.message !== "WRONG_PASSWORD"){ state.loginError = "File non valido."; render(); return; }
            }
          }
          const frase = prompt("Scrivi le 12 parole di recupero, separate da uno spazio:");
          if (frase == null) return;
          try { await doRestore("", frase); }
          catch(e3){
            state.loginError = (e3.message === "WRONG_PHRASE" || e3.message === "PASSWORD_REQUIRED")
              ? "Né la password né le 12 parole aprono questo backup."
              : "File non valido.";
            render();
          }
        } else {
          state.loginError = err.message === "NOT_A_BACKUP" ? "Questo file non è un backup InkConsent." : "File non valido."; render();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
    return;
  }
  if (e.target.id === "import-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      let pw = "";
      // primo tentativo: se cifrato chiederà la password
      try {
        const res = await importBackup(reader.result, "");
        state.backupMsg = `Ripristinati ${res.sessions} consensi e ${res.richieste} richieste.`;
        state.backupMsgType = "ok";
        applyStudioConfig();
        if (loadAuth()) state.locked = false; // già dentro, non ri-bloccare ora
        render();
      } catch(err){
        if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
          pw = prompt("Questo backup è cifrato. Inserisci la password:");
          if (pw == null) return;
          try {
            const res = await importBackup(reader.result, pw);
            state.backupMsg = `Ripristinati ${res.sessions} consensi e ${res.richieste} richieste.`;
            state.backupMsgType = "ok";
            applyStudioConfig();
            render();
          } catch(err2){
            state.backupMsg = err2.message === "WRONG_PASSWORD" ? "Password errata: ripristino annullato." : "File non valido.";
            state.backupMsgType = "warn"; render();
          }
        } else {
          state.backupMsg = err.message === "NOT_A_BACKUP" ? "Questo file non è un backup InkConsent." : "File non valido.";
          state.backupMsgType = "warn"; render();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
  if (e.target.id === "import-consensi-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      const tentativo = async (pw) => {
        try {
          const res = await importConsensiSelettivo(reader.result, pw);
          state.importConsensiMsg = `Importati ${res.importati} consensi nuovi${res.saltati ? ` (${res.saltati} già presenti, saltati)` : ""}.`;
          state.importConsensiMsgType = "ok"; render();
        } catch(err){
          if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
            const pw2 = prompt("Questo file è cifrato. Inserisci la password:");
            if (pw2 == null) return;
            try {
              const res = await importConsensiSelettivo(reader.result, pw2);
              state.importConsensiMsg = `Importati ${res.importati} consensi nuovi${res.saltati ? ` (${res.saltati} già presenti, saltati)` : ""}.`;
              state.importConsensiMsgType = "ok"; render();
            } catch(err2){
              state.importConsensiMsg = err2.message === "WRONG_PASSWORD" ? "Password errata: import annullato." : "File non valido.";
              state.importConsensiMsgType = "warn"; render();
            }
          } else {
            state.importConsensiMsg = "File non valido o non riconosciuto.";
            state.importConsensiMsgType = "warn"; render();
          }
        }
      };
      tentativo("");
    };
    reader.readAsText(file);
    e.target.value = "";
  }
});

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function initClientMode(){
  // niente più fetch remota da Supabase: senza una sessione già locale
  // su questo dispositivo (es. importata da un codice/QR), si parte da
  // una bozza vuota — il passaggio dati cliente↔studio è solo il
  // codice/QR locale (encodeHandoff/decodeHandoff), mai un server.
  const sid = params.get("session");
  const s = sid ? getSession(sid) : null;
  draft = s || blankSession();
  state.step = 1;
  render();
}
function initRichiestaMode(){
  leadDraft = blankRichiesta();
  // prompt11, Task 2: link/QR condiviso da un tatuatore specifico (vedi
  // buildLeadLink) — precompila la scelta, il cliente può comunque
  // cambiarla nei chip di renderLeadStep1. Solo se il nome nel link
  // corrisponde davvero a un artista dichiarato di questo studio.
  const tParam = params.get("tatuatore");
  if (tParam && STUDIO_CONFIG.artists.includes(tParam)){
    leadDraft.tatuatoreScelto = tParam;
    leadDraft.tatuatoreSceltoId = params.get("tatuatore_id") || "";
  }
  state.leadStep = 1;
  render();
}

/* Il boot ora aspetta l'idratazione da IndexedDB: senza, il primo
   render leggerebbe un archivio vuoto e sembrerebbe che i consensi
   siano spariti.                                                   */
(async function boot(){
  applyStudioConfig();
  await caricaModuliEsterni();   // testi aggiornabili senza ripubblicare l'app
  caricaVersioneMotore().then(() => render()); // non blocca il boot, aggiorna il footer quando arriva
  caricaPacchettiIcone().then(() => render()); // idem, popola il selettore pacchetto icone in Impostazioni
  if (state.mode === "studio"){
    // prompt9, Task 1: se torniamo dal click sul link di conferma
    // email, l'URL porta una sessione vera (token emessi da Supabase
    // SOLO dopo una conferma reale) — verifichiala PRIMA di ogni altro
    // gate, cosi' non serve ridigitare email+password.
    const sessioneDaRedirect = SUPABASE_CONFIG.url ? await completaSessioneDaRedirect() : false;
    if (sessioneDaRedirect){
      // caso raro ma possibile: la prova gratuita risultava già avviata
      // altrove (stesso studio, altro dispositivo) — non richiederla di
      // nuovo, i dati arrivano da sincronizzaDatiStudioDaRemoto().
      const remoto = await sincronizzaDatiStudioDaRemoto();
      state.needsTrialChoice = !remoto.completato;
    }
    // primo avvio in assoluto, con Supabase configurato: prima di tutto
    // l'account studio (email+password), che identifica lo studio per
    // l'abbonamento e il limite dispositivi. Se Supabase non è
    // configurato, o il dispositivo ha già un'identità di licenza
    // (anche solo anonima, da prima di questa funzione), si salta
    // direttamente al percorso di sempre — nessuna rottura per chi già
    // usa l'app.
    if (sessioneDaRedirect){
      // gate già risolto sopra, niente altro qui
    } else if (SUPABASE_CONFIG.url && !hasLocalLicenseIdentity()){
      state.needsStudioAccount = true;
    } else if (authIsSet()){
      // sicurezza prima di tutto: se c'è un accesso, l'app parte bloccata.
      state.locked = true;
    } else if (!tourDismissed()){
      // primo utilizzo: tour, poi creazione accesso
      state.showTour = true;
    } else {
      state.needsSetup = true;
    }
    /* Condizioni: se non sono ancora accettate (primo avvio o versione nuova)
       si chiedono prima di tutto. Il tour, quando parte, le presenta lui alla
       fine; il blocco resta attivo perché il render le mostra comunque prima
       della schermata di accesso. */
    if (!termsAccepted() && !state.showTour) state.needsTerms = true;
  }
  // con il blocco attivo l'archivio si carica solo dopo l'accesso:
  // prima di allora la chiave non c'e' e i dati restano cifrati
  if (!state.locked){
    try { await hydrateStores(); }
    catch(e){ console.warn("Idratazione archivio fallita:", e); }
    // attivazione guest da link (?guest=1&codice=X): solo se i dati sono
    // già leggibili a questo punto (nessun blocco password, o già sbloccato
    // in questa stessa sessione). Se il blocco è attivo, il guest vede
    // comunque la schermata di accesso normale — vedi nota su GUEST_ACTIVE_KEY.
    if (state.mode === "studio" && params.get("guest") === "1"){
      const codice = (params.get("codice") || "").trim().toUpperCase();
      if (codice) attivaGuestDaCodice(codice);
    }
    // limite dispositivi: solo per studi con un vero account autenticato
    // (registraDispositivoCorrente è un no-op innocuo altrimenti, o se
    // Supabase/la rete non rispondono — non blocca mai l'uso offline).
    // Con più di un tatuatore la registrazione dispositivo/tatuatore
    // parte solo DOPO la scelta (vedi renderTatuatoreSwitch, action
    // "tatuatore-login"): qui serve sapere già chi è attivo, cosa che
    // a boot appena partito non è ancora possibile con più tatuatori.
    if (state.mode === "studio" && !state.needsStudioAccount && loadStudioAccount() && assicuraProfiliTatuatori().filter(tatuatoreAbilitato).length <= 1){
      const esito = await registraDispositivoCorrente();
      if (esito && esito.consentito === false) state.deviceLimitBlock = esito;
    }
    // "realtime" pragmatico per le richieste preventivo (prompt6, Task
    // 8-9): parte una volta sola, non blocca il boot, no-op se Supabase
    // non è configurato — vedi avviaPollingRichieste.
    if (state.mode === "studio" && FEATURES.richieste) avviaPollingRichieste();
  }

  if (state.mode === "client") await initClientMode();
  else if (state.mode === "richiesta") initRichiestaMode();
  else render();
})();

function accOpen(id, title, subtitle){

   stringa a virgole: indice 0 è sempre il titolare/unico tatuatore
   (sempre presente, nessuna sezione "aggiungi" per lui). Dal secondo in
   poi ogni campo diventa un futuro profilo/login locale con relativo ID
   opaco su Supabase — già gestito automaticamente da
   assicuraProfiliTatuatori() non appena il nome compare in
   STUDIO_CONFIG.artists, nulla da collegare qui in più. Il pulsante
   "+ Aggiungi tatuatore" resta sempre visibile (confermato: il piano è

/* ============================================================
   MULTI-STEP FORM — due fasi:
   • FASE CLIENTE (step 1-6): anagrafica → firma. Compilata dal
     cliente sul proprio telefono, in studio (touch-free via QR).
   • FASE STUDIO (step 7-8): dati seduta + controfirma, compilati
     in studio il giorno dell'appuntamento davanti al cliente.
   ============================================================ */
const STEP_LABELS = ["Anagrafica","Sanitario","Zona","Rischi e consenso","Privacy e disegno","Firma cliente","Dati seduta","Controfirma"];

/* Schermata d'ingresso di "Nuovo consenso" (prompt13, Task 4): il
   link/QR di compilazione remota viveva prima sparso in Impostazioni ->
   "Comunicazione col cliente" — spostato qui come prima scelta del
   flusso stesso, così chi lo usa lo trova dove lo sta effettivamente
   cercando (mentre sta aprendo un nuovo consenso), non in una sezione
   di configurazione. "Importa consenso" resta un menu a parte,
   invariato: scorciatoia/fallback per recuperare un consenso remoto
   anche se questa schermata è stata chiusa nel frattempo. */
function renderConsensoEntryChoice(){
  return `
  <div class="topbar">
    <div><h1>Nuovo consenso</h1><p>Come vuoi compilarlo?</p></div>
    <button class="btn btn-ghost btn-sm" data-action="nav" data-view="archive">${icon("arrowLeft",15)} Archivio</button>
  </div>
  <div class="main-inner">
    <div class="card" style="cursor:pointer;" data-action="consenso-qui">
      <h3 class="section-title">${icon("pen",17)} Compila qui, a mano</h3>
      <p class="section-desc">Il flusso di sempre: anagrafica, questionario, informativa e firme, passo per passo su questo dispositivo.</p>
    </div>
    <div class="card" style="cursor:pointer;margin-top:14px;" data-action="consenso-invia-link">
      <h3 class="section-title">${icon("restock",17)} Invia il link al cliente</h3>
      <p class="section-desc">Genera un link/QR: il cliente compila anagrafica, questionario e firma sul proprio telefono, in studio, mentre prepari. A fine compilazione ti mostra un codice da scansionare per importarlo.</p>
    </div>
  </div>`;
}
/* Schermata d'attesa dopo "Invia il link al cliente": il consenso
   remoto è già stato creato e salvato in locale (upsertSession, vedi
   action "consenso-invia-link") — chiudere questa schermata in
   qualsiasi momento non perde nulla, si recupera comunque da "Importa
   consenso" quando il cliente mostra il suo codice/QR finale. */
function renderConsensoWaitRemote(){
  return `
  <div class="topbar">
    <div><h1>In attesa del cliente</h1><p>Fagli aprire il link/QR sul suo telefono</p></div>
    <button class="btn btn-ghost btn-sm" data-action="consenso-wait-chiudi">${icon("close",15)} Chiudi</button>
  </div>
  <div class="main-inner">
    <div class="card">
      <p class="section-desc">Il cliente compila anagrafica, questionario, informativa e firme sul proprio telefono, in studio (touch-free, mentre prepari). A fine compilazione il suo telefono mostra un codice/QR da farti vedere: scansionalo (o incollalo) da "Importa consenso" e lo ritrovi in "Archivio" pronto per la controfirma. Nessun dato passa da un server: il trasferimento è solo quel codice, letto direttamente dal tuo dispositivo.</p>
      <div class="card" style="margin-top:14px;background:var(--paper);">
        <div class="qr-box"><div id="qr-host" data-sid="${state.lastRemoteId}"></div></div>
        <p class="field hint mono" style="margin-top:10px;word-break:break-all;">${esc(buildClientLink(state.lastRemoteId))}</p>
      </div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn btn-primary" data-action="nav" data-view="import">${icon("restock",15)} Il cliente ha finito, scansiona il suo codice</button>
        <button class="btn btn-ghost" data-action="consenso-wait-chiudi">Chiudi (recupero dopo da "Importa consenso")</button>
      </div>
    </div>
  </div>`;
}

function renderStudioForm(){
  return `
  <div class="topbar">
    <div>
      <h1>${draft.anagrafica.nome || draft.anagrafica.cognome ? `${esc(draft.anagrafica.cognome)} ${esc(draft.anagrafica.nome)}` : "Nuovo consenso"}</h1>
      <p class="mono">#${draft.id.slice(-6)} · ${STATUS[draft.status].label}${draft.filledByClientRemotely ? " · compilato dal cliente" : ""}</p>
    </div>
    <button class="btn btn-ghost btn-sm" data-action="nav" data-view="archive">${icon("arrowLeft",15)} Archivio</button>
  </div>
  <div class="main-inner">
    <div class="step-progress">
      <span class="lbl">Passo ${state.step} di ${STEP_LABELS.length}</span>
      <span class="track"><i style="width:${Math.round(state.step / STEP_LABELS.length * 100)}%"></i></span>
    </div>
    <div class="steps">
      ${STEP_LABELS.map((label,i) => {
        const n = i+1;
        const cls = n === state.step ? "on" : (n < state.step ? "done" : "");
        const inStudio = n > CLIENT_LAST_STEP;
        return `<button class="step-pill ${cls}" data-action="goto-step" data-step="${n}" title="${inStudio ? "Da compilare in studio" : "Parte del cliente"}">${n}. ${label}${inStudio ? icon("pen",13) : ""}</button>`;
      }).join("")}
    </div>
    <p class="field hint" style="margin:-4px 0 16px;">Passi 1-${CLIENT_LAST_STEP}: li compila il cliente, in studio, sul proprio telefono. Passi ${CLIENT_LAST_STEP+1}-${STEP_LABELS.length} ${icon("pen",13)}: sempre in studio, il giorno dell'appuntamento.</p>
    <div class="card" id="step-content">${renderStepBody(state.step, "studio")}</div>
  </div>`;
}

/* ============================================================
   AFTERCARE — barra "giorno X di N", raggiunta dal link mandato via
   WhatsApp dopo la seduta. Calcola tutto SOLO da due parametri
   nell'URL (data, giorni): nessuna sessione, nessun dato del cliente,
   riapribile da qualsiasi telefono quante volte serve.
   ============================================================ */
function renderAftercarePage(){
  const dataStr = params.get("data") || "";
  const giorniTot = Math.max(1, parseInt(params.get("giorni"), 10) || STUDIO_CONFIG.giorniGuarigione || 14);
  const start = dataStr ? new Date(dataStr + "T00:00:00") : null;
  let giornoGrezzo = null;
  if (start && !isNaN(start)){
    const oggi = new Date();
    const d0 = new Date(start.getFullYear(), start.getMonth(), start.getDate());
    const d1 = new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate());
    giornoGrezzo = Math.round((d1 - d0) / 86400000) + 1; // il giorno della seduta e' il giorno 1
  }
  const valido = giornoGrezzo !== null && giornoGrezzo >= 1;
  const giorno = valido ? Math.max(1, Math.min(giornoGrezzo, giorniTot)) : null;
  const finito = valido && giornoGrezzo > giorniTot;
  const pct = giorno ? Math.round((giorno / giorniTot) * 100) : 0;
  const fase = !giorno ? "" : giorno <= Math.ceil(giorniTot*0.25)
    ? "Fase iniziale: segui con attenzione le istruzioni ricevute, è il momento più delicato."
    : giorno <= Math.ceil(giorniTot*0.7)
    ? "A metà percorso: continua idratazione e protezione dal sole, evita piscina e mare."
    : "Ultimi giorni: la pelle sta completando la guarigione superficiale in vista.";
  return `
  <div class="client-shell area-consenso">
    <div class="client-head">
      <div class="rail-brand">
        <div class="rail-mark">${markHtml()}</div>
        <div>
          <div class="rail-brand-name" style="color:var(--ink);">${esc(STUDIO_CONFIG.studioName)}</div>
          <span class="area-badge">Guarigione</span>
          <div class="rail-brand-sub">Percorso di cura del tatuaggio</div>
        </div>
      </div>
    </div>
    <div class="client-body">
      <div class="card" style="text-align:center;">
        ${!valido ? `
          <h2>Link non valido</h2>
          <p class="section-desc">Questo link non contiene una data leggibile. Chiedi allo studio di rimandartelo.</p>
        ` : finito ? `
          <h2>Guarigione completata</h2>
          <p class="section-desc">Sono passati più di ${giorniTot} giorni dalla seduta. Se noti qualcosa che ti preoccupa, scrivi comunque allo studio.</p>
        ` : `
          <h2>Giorno ${giorno} di ${giorniTot}</h2>
          <div class="trial-track" style="height:10px;margin:16px 0;"><i style="width:${pct}%;background:var(--stencil);"></i></div>
          <p class="section-desc">${fase}</p>
        `}
      </div>
      ${STUDIO_CONFIG.aftercareText ? `
      <div class="card">
        <h3 class="section-title">Le istruzioni che ti abbiamo dato</h3>
        <p class="section-desc" style="white-space:pre-line;">${esc(STUDIO_CONFIG.aftercareText.replace(/\{nome\}/g, "").trim())}</p>
      </div>` : ""}
    </div>
  </div>`;
}

function renderClientShell(){
  if (!draft) draft = getSession(params.get("session")) || blankSession();
  const total = CLIENT_LAST_STEP; // il cliente compila fino alla propria firma
  if (draft.status === "attesa" || draft.status === "firmato" || draft.status === "archiviato"){
    return renderClientDone();
  }
  return `
  <div class="client-shell area-consenso">
    <div class="client-head">
      <div class="rail-brand">
        <div class="rail-mark">${markHtml()}</div>
        <div>
          <div class="rail-brand-name" style="color:var(--ink);">${esc(STUDIO_CONFIG.studioName)}</div>
          <span class="area-badge">Consenso medico-legale</span>
          <div class="rail-brand-sub">Consenso informato · passo ${state.step} di ${total}</div>
        </div>
      </div>
      <div class="progress-track">
        ${Array.from({length: total}).map((_,i) => `<div class="progress-dash"><i style="width:${i < state.step ? 100 : (i === state.step-1 ? 100 : 0)}%"></i></div>`).join("")}
      </div>
    </div>
    <div class="client-body">
      <div class="card" id="step-content">${renderStepBody(state.step, "client")}</div>
    </div>
  </div>`;
}
function renderClientDone(){
  const code = state.handoffCode || "";
  const kb = code ? (code.length/1024).toFixed(1) : "0";
  const tooBig = code.length > QR_BYTE_LIMIT;
  return `
  <div class="client-shell area-consenso">
    <div class="client-body" style="padding-top:40px;text-align:center;">
      <div class="rail-mark" style="width:56px;height:56px;font-size:22px;margin:0 auto 16px;">${markHtml()}</div>
      <h2>Fatto — grazie${draft.anagrafica.nome ? ", " + esc(draft.anagrafica.nome) : ""}</h2>
      <p class="section-desc">Manca solo un passaggio: mostra questo codice al tatuatore, che lo inquadra col suo dispositivo. I tuoi dati non passano da internet — vanno direttamente dal tuo telefono al suo.</p>

      ${!code ? `<p class="section-desc mono">Preparazione del codice…</p>` : (tooBig ? `
        <div class="callout warn" style="text-align:left;">
          <b>Il codice è troppo lungo per il QR</b>
          <p>Usa il pulsante qui sotto per copiarlo e mandalo al tatuatore su WhatsApp: funziona esattamente allo stesso modo.</p>
        </div>` : `
        <div class="handoff-qr"><div id="handoff-qr-host" data-code="${esc(code)}"></div></div>

      <details style="margin-top:18px;text-align:left;">
        <summary class="mono" style="cursor:pointer;font-size:12px;color:var(--ink-faint);">Non riesce a inquadrare? Passa il codice a mano</summary>

}

/* ---------- lato studio: importa il consenso dal telefono del cliente ---------- */
function renderImport(){
  return `

  <div class="main-inner">

    <div class="card">
      <h3 class="section-title">Inquadra il codice</h3>
      <p class="section-desc">Punta la fotocamera sul QR che il cliente ha sullo schermo. Appena lo legge, il consenso entra in archivio e puoi proseguire con dati seduta e controfirma.</p>
      ${state.scanning ? `
        <div class="scan-wrap"><video id="scan-video" playsinline muted></video><div class="scan-frame"></div></div>

    <div class="card">
      <h3 class="section-title">Oppure incolla il codice</h3>

      <div class="field">

function renderStepBody(step, ctx){
  if (step === 1) return renderStepAnagrafica(ctx);
  if (step === 2) return renderStepSanitario(ctx);
  if (step === 3) return renderStepZona(ctx);
  if (step === 4) return renderStepInformativa(ctx);
  if (step === 5) return renderStepPrivacyDisegno(ctx);
  if (step === 6) return renderStepFirma(ctx);
  if (step === 7) return renderStepSeduta(ctx);
  if (step === 8) return renderStepControfirma(ctx);
  return "";
}

function renderErrors(step){
  const errs = state.showErrors === step ? validateStep(step) : [];
  if (!errs.length) return "";
  return `<div class="callout warn" style="margin-bottom:18px;">${errs.map(esc).join("<br>")}</div>`;
}

function renderAvvisoEta(){
  const eta = calcolaEta(draft.anagrafica.nascita, draft.seduta && draft.seduta.dataApplicazione);
  if (eta === null) return "";
  const v = verdettoEta(eta, draft.tipoApplicazione || "tatuaggio", STUDIO_CONFIG.regione || "");
  if (!v) return "";
  if (v.livello === "ok") return `<div class="eta-bar ok">${icon("check",16)} <span>${eta} anni: maggiorenne. Firma in autonomia.</span></div>`;
  if (v.livello === "vietato") return `<div class="eta-bar stop">${icon("alert",18)} <span>${esc(v.msg)}${draft.tipoApplicazione==="piercing" ? " Il lobo dell'orecchio può fare eccezione: verifica." : ""}</span></div>`;
  return `<div class="eta-bar warn">${icon("alert",18)} <span>${esc(v.msg)}</span></div>`;
}

function renderStepSanitario(ctx){
  const risposte = HEALTH_QUESTIONS.filter(q => draft.sanitario[q.id]);
  const siCount = HEALTH_QUESTIONS.filter(q => draft.sanitario[q.id] === 'si').length;
  const tutteRisposte = risposte.length === HEALTH_QUESTIONS.length;
  const bloccato = siCount > 0;   // anche una sola positiva ferma il flusso
  return `
  ${renderErrors(2)}
  <h3 class="section-title">Questionario sanitario</h3>
  <p class="section-desc">Sposta l'interruttore su ogni voce. Se una condizione è presente, il tatuaggio potrebbe non essere eseguibile: se ne parla con il tatuatore prima di proseguire.</p>
  <div class="hq-legend"><span>No</span><span>Sì</span></div>
  ${HEALTH_QUESTIONS.map(q => {
    const val = draft.sanitario[q.id];
    const cls = val === 'si' ? 'sw-on' : (val === 'no' ? 'sw-no' : '');
    return `<div class="hq">
      <div class="hq-label">${esc(q.label)}</div>
      <div class="sw ${cls}" role="switch" aria-checked="${val==='si'}" title="${val==='si'?'Sì':val==='no'?'No':'Da rispondere'}">
        <button class="sw-zone sw-zone-no" data-action="set-sanitario" data-q="${q.id}" data-v="no" aria-label="No, nessun problema"></button>
        <button class="sw-zone sw-zone-si" data-action="set-sanitario" data-q="${q.id}" data-v="si" aria-label="Sì, condizione presente"></button>
      </div>
    </div>`;
  }).join("")}
  ${bloccato ? `<div class="hq-block">
    ${icon("alert",18)} <b>${siCount === 1 ? "Una condizione risulta presente" : siCount + " condizioni risultano presenti"}.</b>
    In presenza di quanto indicato non si procede in autonomia: <b>parla con il tatuatore prima di continuare col consenso.</b>
    Sarà lui a valutare se e come procedere.
  </div>` : ""}
  <div class="field" style="margin-top:16px;">
    <label>Note del tatuatore (facoltativo)</label>
    <textarea data-field="sanitarioNote" placeholder="Annotazioni su eventuali condizioni segnalate…">${esc(draft.sanitarioNote)}</textarea>
  </div>
  ${renderSanitarioNav(2, ctx, bloccato, tutteRisposte)}`;
}

/* Nav dello step sanitario: se c'e' una condizione positiva, Avanti e'
   sostituito da un pulsante di conferma esplicita del tatuatore. Il cliente
   da solo non supera il blocco; il tatuatore, in studio, puo' procedere
   consapevolmente. Non e' un divieto di legge: e' una valutazione medica
   che l'app rimette a chi la deve fare. */
function renderSanitarioNav(step, ctx, bloccato, tutteRisposte){
  if (!bloccato){
    return `<div class="btn-row">
      <button class="btn btn-ghost" data-action="prev-step">${icon("arrowLeft",15)} Indietro</button>
      <button class="btn btn-primary" data-action="next-step" ${tutteRisposte?"":"disabled"}>Avanti ${icon("arrowRight",15)}</button>
    </div>`;
  }
  const confermato = draft.sanitarioOverride;
  return `<div class="btn-row" style="flex-wrap:wrap;gap:10px;">
    <button class="btn btn-ghost" data-action="prev-step">${icon("arrowLeft",15)} Indietro</button>
    ${confermato
      ? `<button class="btn btn-primary" data-action="next-step">Avanti ${icon("arrowRight",15)}</button>`
      : `<button class="btn btn-accent" data-action="sanitario-override">Ho valutato, procedo io (tatuatore)</button>`}
  </div>
  ${confermato ? `<p class="lock-hint" style="margin-top:8px;">Hai confermato la valutazione. La segnalazione resta registrata nel consenso.</p>` : ""}`;
}

    </div>
  </div>

  <div class="field" style="margin-top:18px;">
    <label>L'area presenta uno o più nei nella zona da tatuare?</label>
    <div style="display:flex;gap:8px;">
      <button class="chip ${draft.zoneNei==='si'?'on':''}" data-action="set-zonenei" data-v="si">Sì</button>
      <button class="chip ${draft.zoneNei==='no'?'on':''}" data-action="set-zonenei" data-v="no">No</button>
    </div>
  </div>
  ${draft.zoneNei === 'si' ? `
    <div class="callout warn" style="margin-top:14px;">Attenzione: i nei non andrebbero mai tatuati sopra. Va mantenuta una distanza di almeno 1&nbsp;cm. Valutare con il cliente se spostare il disegno o consigliare un controllo dermatologico prima di procedere.</div>
    <div class="field" style="margin-top:12px;"><label>Note su posizione/gestione dei nei</label>
      <textarea data-field="zoneNeiNote" placeholder="Es. neo a 3cm dal bordo disegno, spostato il tracciato…">${esc(draft.zoneNeiNote)}</textarea>
    </div>` : ""}
  ${renderFormNav(3, ctx)}`;
}
function renderConsensoBodyFrame(view){
  const mode = draft.zonaSegnaMode || "pin";
  const pins = draft.markers.map((m,i) => m.view === view ? `<div class="body-pin" data-action="remove-pin-consenso" data-i="${i}" style="left:${m.xPct}%;top:${m.yPct}%;"><span>${i+1}</span></div>` : "").join("");
  return `
  <div>
    <div class="body-frame ${mode==='pin'?'mode-pin':''}" ${mode==='pin'?`data-action="mark-body-consenso" data-view="${view}"`:''}>
      <img class="body-bg" src="${bodyImg(draft.genere, view)}" alt="" draggable="false">
      ${mode==='disegno' ? `<canvas class="body-draw" data-draw-view="${view}" data-draw-ctx="consenso"></canvas>` : pins}
    </div>
    <div class="body-label">${view === "fronte" ? "Fronte" : "Retro"}</div>

}

  <div class="sigpad-wrap">
    ${!draft.firmaClienteData ? '<div class="sigpad-placeholder">Firma qui</div>' : ""}
    <canvas id="sig-canvas"></canvas>
  </div>
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn btn-ghost btn-sm" data-action="clear-sig" data-target="firmaClienteData">Cancella firma</button>
  </div>
  ${isMinor ? `
    ${!wantsSecond ? `
      <button class="btn btn-ghost btn-sm" style="margin-top:14px;" data-action="add-second-sig">+ Aggiungi firma del secondo genitore/tutore</button>
    ` : `
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h4 style="margin:0;font-family:var(--font-display);">Firma del secondo genitore/tutore</h4>
          <button class="btn btn-ghost btn-sm" data-action="remove-second-sig">Rimuovi</button>
        </div>
        <p class="section-desc">Firma del secondo genitore/tutore (facoltativa).</p>
        <div class="sigpad-wrap">
          ${!draft.firmaTutore2Data ? '<div class="sigpad-placeholder">Firma qui</div>' : ""}
          <canvas id="sig-canvas-2"></canvas>
        </div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn btn-ghost btn-sm" data-action="clear-sig" data-target="firmaTutore2Data">Cancella firma</button>
        </div>
      </div>
    `}
  ` : ""}
  ${renderFormNav(6, ctx)}`;
}

function renderStepSeduta(ctx){
  const s = draft.seduta;
  const inks = loadInks();
  const needles = loadNeedles();
  const selInk = new Set((s.inchiostri||[]).map(x => x.id));
  const selNeedle = new Set((s.aghi||[]).map(x => x.id));
  return `
  ${renderErrors(7)}
  <h3 class="section-title">Dati seduta <span class="stamp stamp-attesa" style="vertical-align:middle;">solo studio</span></h3>
  <p class="section-desc">Da compilare in studio il giorno dell'appuntamento, davanti al cliente. Sono i dati tecnici che esistono solo a tatuaggio eseguito.</p>
  <div class="grid-2">
    <div class="field"><label>Data effettiva dell'applicazione</label><input type="date" data-field="seduta.dataApplicazione" value="${esc(s.dataApplicazione)}"></div>
    <div class="field"><label>Zona effettivamente trattata</label><input type="text" data-field="seduta.sedeEffettiva" value="${esc(s.sedeEffettiva)}" placeholder="Es. avambraccio destro"></div>
  </div>

  <div class="subhead">Inchiostri usati</div>
  ${(s.inchiostri||[]).length ? `<div>${s.inchiostri.map(it => `<span class="inv-chip">${esc(it.nome)}${it.colore?` · ${esc(it.colore)}`:""} · lotto ${esc(it.lotto||"—")} <button data-action="seduta-remove-ink" data-id="${it.id}">${icon("close",12)}</button></span>`).join("")}</div>` : ""}
  ${inks.length ? `
    <div class="field" style="margin-top:8px;">
      <select data-action="seduta-add-ink">
        <option value="">+ Aggiungi inchiostro dall'archivio…</option>
        ${inks.filter(it => !selInk.has(it.id)).map(it => `<option value="${it.id}">${esc(it.nome)}${it.colore?` · ${esc(it.colore)}`:""} · lotto ${esc(it.lotto||"—")}${it.scadenza?` · scad. ${fmtDate(it.scadenza)}`:""}</option>`).join("")}
      </select>
    </div>` : `<p class="section-desc">Nessun inchiostro in archivio. <a href="#" data-action="nav" data-view="magazzino">Aggiungine nel Magazzino</a> per selezionarli qui.</p>`}

  <div class="subhead">Aghi usati</div>
  ${(s.aghi||[]).length ? `<div>${s.aghi.map(it => `<span class="inv-chip">${esc(it.tipo)}${it.marca?` · ${esc(it.marca)}`:""} · lotto ${esc(it.lotto||"—")} <button data-action="seduta-remove-needle" data-id="${it.id}">${icon("close",12)}</button></span>`).join("")}</div>` : ""}
  ${needles.length ? `
    <div class="field" style="margin-top:8px;">
      <select data-action="seduta-add-needle">
        <option value="">+ Aggiungi ago dall'archivio…</option>
        ${needles.filter(it => !selNeedle.has(it.id)).map(it => `<option value="${it.id}">${esc(it.tipo)}${it.marca?` · ${esc(it.marca)}`:""} · lotto ${esc(it.lotto||"—")}${it.scadenza?` · scad. ${fmtDate(it.scadenza)}`:""}</option>`).join("")}
      </select>
    </div>` : `<p class="section-desc">Nessun ago in archivio. <a href="#" data-action="nav" data-view="magazzino">Aggiungine nel Magazzino</a> per selezionarli qui.</p>`}

  <div class="field" style="margin-top:14px;"><label>Note aggiuntive sui materiali (facoltativo)</label><input type="text" data-field="seduta.materiali" value="${esc(s.materiali)}" placeholder="Es. cartuccia sterile monouso, altro…"></div>
  <div class="check-row">
    <input type="checkbox" id="schedatecnica" data-action="toggle-schedatecnica" ${s.schedaTecnicaAllegata?"checked":""}>
    <label for="schedatecnica" class="ct">Scheda tecnica delle sostanze usate allegata al fascicolo cliente</label>
  </div>
  <div class="field"><label>Eventuali reazioni avverse riscontrate</label><textarea data-field="seduta.reazioniAvverse" placeholder="Da compilare anche a un controllo successivo…">${esc(s.reazioniAvverse)}</textarea></div>
  ${renderFormNav(7, ctx)}`;
}

function renderStepControfirma(ctx){
  const zonaSummary = draft.zonaMode === "sagoma"
    ? `${draft.markers.length} punto/i sulla sagoma${draft.zonaLibera ? " — " + esc(draft.zonaLibera) : ""}`
    : `${draft.zone.map(esc).join(", ") || "—"}${draft.zonaLibera ? " (" + esc(draft.zonaLibera) + ")" : ""}`;
  return `
  ${renderErrors(8)}
  <h3 class="section-title">Controfirma del tatuatore</h3>
  <p class="section-desc">Rivedi il riepilogo, poi firma per archiviare il documento.</p>
  <div class="card" style="background:var(--paper);margin-bottom:16px;">
    <div class="kv"><span>Cliente</span><b>${esc(draft.anagrafica.cognome)} ${esc(draft.anagrafica.nome)}</b></div>
    <div class="kv"><span>Nato/a il</span><b>${fmtDate(draft.anagrafica.nascita)}</b></div>
    <div class="kv"><span>Tipo</span><b>${draft.tipoApplicazione === 'piercing' ? 'Piercing' : 'Tatuaggio'}</b></div>
    <div class="kv"><span>Data seduta</span><b>${draft.seduta.dataApplicazione ? fmtDate(draft.seduta.dataApplicazione) : "— (da compilare)"}</b></div>
    <div class="kv"><span>Zona</span><b>${zonaSummary}</b></div>
    <div class="kv"><span>Grandezza</span><b>${esc(draft.grandezza || "—")}</b></div>
    <div class="kv"><span>Nei nell'area</span><b>${draft.zoneNei === 'si' ? "Sì — vedi nota" : "No"}</b></div>
    <div class="kv"><span>Inchiostri / Aghi</span><b>${(draft.seduta.inchiostri||[]).length} inchiostro/i · ${(draft.seduta.aghi||[]).length} ago/aghi</b></div>
    <div class="kv"><span>Consenso e privacy</span><b>${draft.informativaLetta && draft.privacyConsenso && draft.disegnoConfermato ? "Confermati" : "Incompleti"}</b></div>
    <div class="kv"><span>Firma cliente</span><b>${draft.firmaClienteAt ? fmtDateTime(draft.firmaClienteAt) : "Mancante"}</b></div>
  </div>
  <div class="field">
    <label>Artista</label>
    <select data-field="artista">
      ${STUDIO_CONFIG.artists.map(a => `<option value="${esc(a)}" ${draft.artista===a?"selected":""}>${esc(a)}</option>`).join("")}
    </select>
  </div>
  <div class="field"><label>Note tecniche (facoltativo)</label><textarea data-field="noteStudio" placeholder="Note interne…">${esc(draft.noteStudio)}</textarea></div>
  <div class="sigpad-wrap">
    ${!draft.controfirmaData ? '<div class="sigpad-placeholder">Controfirma qui</div>' : ""}
    <canvas id="sig-canvas"></canvas>
  </div>
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn btn-ghost btn-sm" data-action="clear-sig" data-target="controfirmaData">Cancella firma</button>
    ${draft.status === "archiviato" ? `<button class="btn btn-ghost btn-sm" data-action="save-draft">Salva modifiche</button>` : ""}
    ${draft.status === "archiviato" && draft.anagrafica.telefono ? `<a class="btn btn-accent btn-sm" href="${waLink(draft.anagrafica.telefono, aftercareMessage(draft))}" target="_blank" rel="noopener">${icon("chat",15)} Invia aftercare</a>` : ""}
  </div>
  ${renderFormNav(8, ctx)}`;
}

function renderFormNav(step, ctx){
  const isClient = ctx === "client";
  const lastClientStep = CLIENT_LAST_STEP; // 6
  const lastStudioStep = 8;
  const isLast = isClient ? step === lastClientStep : step === lastStudioStep;
  let nextLabel = 'Avanti ' + icon("arrowRight",15);
  let nextAction = "next-step";
  if (isLast && isClient) { nextLabel = "Invia allo studio"; nextAction = "submit-client"; }
  if (isLast && !isClient) {
    if (draft.status === "archiviato") { nextLabel = icon("download",15) + ' Scarica di nuovo il PDF'; nextAction = "download-pdf"; }
    else { nextLabel = "Archivia consenso"; nextAction = "finalize-studio"; }
  }
  return `
  <div class="btn-row">
    ${step > 1 ? `<button class="btn btn-ghost" data-action="prev-step">${icon("arrowLeft",15)} Indietro</button>` : ""}
    <button class="btn ${isLast ? "btn-accent" : "btn-primary"}" data-action="${nextAction}">${nextLabel}</button>
  </div>`;
}
</script>
</body>
</html>
