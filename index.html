/* ============================================================
   SIGNATURE PAD — canvas a mano libera, salvata come dataURL
   ============================================================ */
/* Colore reso della firma: quello scelto a parte in Impostazioni, o —
   se non impostato — l'accento corrente dello studio (letto dal CSS,
   cosi' segue anche un cambio colore live senza bisogno di duplicare
   il valore). */
function signatureRenderColor(){
  return STUDIO_CONFIG.signatureColor
    || getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim()
    || "#1B1A19";
}
/* Disegna un segmento di tratto con lo stile scelto dallo studio.
   "Effetto inchiostro" e' SOLO resa: la variazione di spessore/posizione
   si ricalcola ogni volta dalle stesse coordinate (seed deterministico
   sul punto, non casuale), non viene mai scritta nei dati — il path
   salvato (draft[vecKey].s) resta sempre lo stesso, stesso valore legale. */
function strokeSegmentStyled(ctx, x1, y1, x2, y2, opts){
  const o = opts || {};
  ctx.strokeStyle = o.color || "#1B1A19";
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (!o.ink){
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    return;
  }
  const seed = Math.sin(x1 * 12.9898 + y1 * 78.233 + x2 * 4.14 + y2 * 2.71) * 43758.5453;
  const j = (seed - Math.floor(seed) - 0.5); // -0.5..0.5 deterministico sul punto
  ctx.lineWidth = 1.7 + Math.abs(j) * 1.9;
  ctx.beginPath();
  ctx.moveTo(x1 + j * 0.5, y1 - j * 0.5);
  ctx.lineTo(x2 - j * 0.5, y2 + j * 0.5);
  ctx.stroke();
}
function initSignaturePad(canvas, targetField){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineCap = "round";
  const sigStyle = { color: signatureRenderColor(), ink: STUDIO_CONFIG.inkEffect };

  const existing = draft[targetField];
  if (existing){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = existing;
  }

  /* Oltre al PNG teniamo i tratti come coordinate: una firma vettoriale
     pesa ~600 byte invece di 20-40 KB, e ci sta in un QR. Il PNG serve
     ancora per PDF e anteprima, ma non e' piu' l'unica copia.        */
  const vecKey = targetField.replace(/Data$/, "") + "Vec";
  const strokesVec = (draft[vecKey] && Array.isArray(draft[vecKey].s)) ? draft[vecKey].s.slice() : [];
  let curStroke = null;

  let drawing = false, lastX = 0, lastY = 0;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const start = (e) => {
    e.preventDefault(); drawing = true;
    const p = pos(e); lastX = p.x; lastY = p.y;
    curStroke = [[Math.round(p.x), Math.round(p.y)]];
  };
  const move = (e) => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e);
    strokeSegmentStyled(ctx, lastX, lastY, p.x, p.y, sigStyle);
    if (curStroke) curStroke.push([Math.round(p.x), Math.round(p.y)]);
    lastX = p.x; lastY = p.y;
  };
  const end = () => {
    if (!drawing) return;
    drawing = false;
    if (curStroke && curStroke.length > 1) strokesVec.push(curStroke);
    curStroke = null;
    draft[vecKey] = { w: Math.round(rect.width), h: Math.round(rect.height), s: strokesVec };
    draft[targetField] = canvas.toDataURL("image/png");
    if (targetField === "firmaClienteData") draft.firmaClienteAt = new Date().toISOString();
    if (targetField === "firmaTutore2Data") draft.firmaTutore2At = new Date().toISOString();
    if (targetField === "controfirmaData") draft.controfirmaAt = new Date().toISOString();
    upsertSession(draft);
  };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

/* Ridisegna una firma vettoriale e la riporta a PNG. Serve quando il
   consenso arriva dal telefono del cliente via QR: nel codice viaggiano
   i tratti, il PNG lo rigeneriamo qui identico all'originale. */
function vecToPng(vec, scale){
  if (!vec || !Array.isArray(vec.s) || !vec.s.length) return null;
  const k = scale || 2;
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round((vec.w||300) * k));
  cv.height = Math.max(1, Math.round((vec.h||170) * k));
  const c = cv.getContext("2d");
  c.scale(k, k);
  c.lineCap = "round"; c.lineJoin = "round";
  const style = { color: signatureRenderColor(), ink: STUDIO_CONFIG.inkEffect };
  vec.s.forEach(st => {
    if (!st || st.length < 2) return;
    for (let i = 1; i < st.length; i++) strokeSegmentStyled(c, st[i-1][0], st[i-1][1], st[i][0], st[i][1], style);
  });
  return cv.toDataURL("image/png");
}

/* ============================================================
   PASSAGGIO CONSENSO — dal telefono del cliente al tuo, offline
   Il cliente compila e firma sul proprio telefono (in studio, comodo).
   Alla fine il suo telefono genera un QR + un codice testuale: tu
   inquadri o incolli, e il consenso entra nel tuo archivio.
   Niente rete, niente server, nessun dato che esce dai dispositivi.
   Peso tipico del pacchetto compresso: 1-2 KB, dentro un QR solo.
   ============================================================ */
const HANDOFF_PREFIX = "IC1:";
const QR_BYTE_LIMIT = 2900; // capienza reale di un QR v40 livello L

function b64urlEncode(u8){
  let s = "";
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlDecode(str){
  const s = String(str).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
/* Un tratto campionato a mano libera e' pieno di punti inutili: due
   pixel di distanza non li vede nessuno, ma nel QR pesano. Qui li
   diradiamo e poi salviamo le differenze tra un punto e il successivo
   invece delle coordinate assolute: numeri piccolissimi, che il gzip
   schiaccia benissimo. La firma resta identica a occhio.          */
function thinPts(pts, minD){
  if (!pts || pts.length < 3) return pts || [];
  const out = [pts[0]];
  let last = pts[0];
  for (let i = 1; i < pts.length - 1; i++){
    const dx = pts[i][0]-last[0], dy = pts[i][1]-last[1];
    if (dx*dx + dy*dy >= minD*minD){ out.push(pts[i]); last = pts[i]; }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function deltaEnc(pts, scale){
  const out = []; let px = 0, py = 0;
  for (const p of pts){
    const x = Math.round(p[0]*scale), y = Math.round(p[1]*scale);
    out.push(x-px, y-py); px = x; py = y;
  }
  return out;
}
function deltaDec(arr, scale){
  const out = []; let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2){
    x += arr[i]; y += arr[i+1];
    out.push([x/scale, y/scale]);
  }
  return out;
}
function packVec(v){
  if (!v || !Array.isArray(v.s) || !v.s.length) return null;
  return { w: v.w, h: v.h, s: v.s.map(st => deltaEnc(thinPts(st, 2), 1)) };
}
function unpackVec(v){
  if (!v || !Array.isArray(v.s)) return null;
  return { w: v.w, h: v.h, s: v.s.map(a => deltaDec(a, 1)) };
}

/* Impacchetta solo la parte del cliente (passi 1-6), con chiavi corte
   e coordinate arrotondate: ogni byte risparmiato e' spazio nel QR. */
function packSession(s){
  return {
    v: 1, id: s.id, cr: s.createdAt,
    a: s.anagrafica,
    mi: s.minorenne ? 1 : 0,
    t1: s.minorenne ? s.tutore1 : null,
    t2: (s.minorenne && s.richiedeSecondaFirma) ? s.tutore2 : null,
    dc: s.minorenne ? s.documento : null,
    sa: s.sanitario, sn: s.sanitarioNote, so: s.sanitarioOverride ? 1 : 0,
    ta: s.tipoApplicazione,
    zm: s.zonaMode, z: s.zone, zl: s.zonaLibera, ge: s.genere, zs: s.zonaSegnaMode,
    mk: (s.markers||[]).map(m => [m.view === "retro" ? 1 : 0, Math.round(m.xPct*10), Math.round(m.yPct*10)]),
    sk: (s.strokes||[]).map(st => [st.view === "retro" ? 1 : 0,
        deltaEnc(thinPts((st.points||[]).map(p => [p.xPct, p.yPct]), 0.7), 10)]),
    gr: s.grandezza, zn: s.zoneNei, znn: s.zoneNeiNote,
    iv: s.informativaVersion,
    il: s.informativaLetta ? 1 : 0, pc: s.privacyConsenso ? 1 : 0, df: s.disegnoConfermato ? 1 : 0,
    r2: s.richiedeSecondaFirma ? 1 : 0,
    f1: packVec(s.firmaClienteVec), f1t: s.firmaClienteAt,
    f2: packVec(s.firmaTutore2Vec), f2t: s.firmaTutore2At,
  };
}
function unpackSession(p){
  const s = blankSession();
  if (p.id) s.id = p.id;
  if (p.cr) s.createdAt = p.cr;
  s.anagrafica = { ...s.anagrafica, ...(p.a || {}) };
  s.minorenne = !!p.mi;
  if (p.t1) s.tutore1 = { ...s.tutore1, ...p.t1 };
  if (p.t2) s.tutore2 = { ...s.tutore2, ...p.t2 };
  if (p.dc) s.documento = { ...s.documento, ...p.dc };
  s.sanitario = p.sa || {};
  s.sanitarioNote = p.sn || "";
  s.sanitarioOverride = !!p.so;
  s.tipoApplicazione = p.ta || s.tipoApplicazione;
  s.zonaMode = p.zm || s.zonaMode;
  s.zone = p.z || [];
  s.zonaLibera = p.zl || "";
  s.genere = p.ge || s.genere;
  s.zonaSegnaMode = p.zs || s.zonaSegnaMode;
  s.markers = (p.mk||[]).map(m => ({ view: m[0] ? "retro" : "fronte", xPct: m[1]/10, yPct: m[2]/10 }));
  s.strokes = (p.sk||[]).map(st => ({ view: st[0] ? "retro" : "fronte",
      points: deltaDec(st[1]||[], 10).map(pt => ({ xPct: pt[0], yPct: pt[1] })) }));
  s.grandezza = p.gr || "";
  s.zoneNei = p.zn || null;
  s.zoneNeiNote = p.znn || "";
  s.informativaVersion = p.iv || s.informativaVersion;
  s.informativaLetta = !!p.il;
  s.privacyConsenso = !!p.pc;
  s.disegnoConfermato = !!p.df;
  s.richiedeSecondaFirma = !!p.r2;
  s.firmaClienteVec = unpackVec(p.f1);
  s.firmaClienteData = vecToPng(s.firmaClienteVec, 2);
  s.firmaClienteAt = p.f1t || null;
  s.firmaTutore2Vec = unpackVec(p.f2);
  s.firmaTutore2Data = vecToPng(s.firmaTutore2Vec, 2);
  s.firmaTutore2At = p.f2t || null;
  s.status = "attesa";
  s.filledByClientRemotely = true;
  s.updatedAt = new Date().toISOString();
  return s;
}

async function encodeHandoff(session){
  const bytes = new TextEncoder().encode(JSON.stringify(packSession(session)));
  let out = bytes, flag = "R";
  if (typeof CompressionStream === "function"){
    try {
      const cs = new CompressionStream("gzip");
      const w = cs.writable.getWriter(); w.write(bytes); w.close();
      out = new Uint8Array(await new Response(cs.readable).arrayBuffer());
      flag = "G";
    } catch(e){ /* niente gzip su questo browser: si va grezzi */ }
  }
  return HANDOFF_PREFIX + flag + b64urlEncode(out);
}
async function decodeHandoff(code){
  const raw = String(code || "").trim().replace(/\s+/g, "");
  if (!raw.startsWith(HANDOFF_PREFIX)) throw new Error("BAD_CODE");
  const flag = raw[HANDOFF_PREFIX.length];
  let bytes = b64urlDecode(raw.slice(HANDOFF_PREFIX.length + 1));
  if (flag === "G"){
    const ds = new DecompressionStream("gzip");
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  return unpackSession(JSON.parse(new TextDecoder().decode(bytes)));
}

/* ============================================================
   LETTORE QR — usa BarcodeDetector, gia' dentro Chrome su Android.
   Dove non c'e', non carichiamo librerie da internet (l'app deve
   funzionare in un seminterrato senza campo): si passa al codice
   testuale, che fa lo stesso lavoro.
   ============================================================ */
let _scanStream = null, _scanTimer = null;

async function startScanner(){
  const video = qs("#scan-video");
  if (!video || _scanStream) return;
  if (!("BarcodeDetector" in window)){
    state.scanning = false;
    state.importError = "Questo browser non sa leggere i QR. Fatti mandare il codice testuale e incollalo qui sotto.";
    render(); return;
  }
  try {
    _scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = _scanStream;
    await video.play();
  } catch(e){
    stopScanner();
    state.importError = "Non riesco ad accedere alla fotocamera. Controlla i permessi del browser, oppure incolla il codice qui sotto.";
    render(); return;
  }
  const detector = new BarcodeDetector({ formats: ["qr_code"] });
  _scanTimer = setInterval(async () => {
    if (!_scanStream || video.readyState < 2) return;
    try {
      const found = await detector.detect(video);
      if (found && found.length){
        const raw = found[0].rawValue || "";
        if (raw.startsWith(HANDOFF_PREFIX)){
          stopScanner();
          await importHandoff(raw);
        }
      }
    } catch(e){ /* frame illeggibile: al prossimo giro */ }
  }, 350);
}
function stopScanner(){
  clearInterval(_scanTimer); _scanTimer = null;
  if (_scanStream){ _scanStream.getTracks().forEach(tr => tr.stop()); _scanStream = null; }
  state.scanning = false;
}

/* Importa il consenso e lo mette in archivio. Se un consenso con lo
   stesso id c'e' gia' (doppia scansione), non lo duplichiamo: apriamo
   quello, cosi' non ti ritrovi due schede identiche. */
async function importHandoff(code){
  state.importError = ""; state.importOk = "";
  let s;
  try { s = await decodeHandoff(code); }
  catch(e){
    state.importError = e && e.message === "BAD_CODE"
      ? "Questo non è un codice di consenso InkConsent. Controlla di aver copiato tutto, dall'inizio alla fine."
      : "Il codice risulta danneggiato o incompleto. Fattelo rimandare.";
    render(); return;
  }
  const esistente = getSession(s.id);
  if (esistente){
    draft = esistente;
    state.view = "form"; state.step = CLIENT_LAST_STEP + 1;
    state.importPaste = "";
    render(); return;
  }
  upsertSession(s);
  draft = s;
  state.importPaste = "";
  state.view = "form";
  state.step = CLIENT_LAST_STEP + 1; // dritto ai dati seduta: la parte del cliente e' fatta
  render();
}

/* ============================================================
   PDF EXPORT — jsPDF, client-side, nessun backend richiesto
   ============================================================ */
/* Compone la sagoma (immagine) con pin e disegni in un'unica PNG dataURL,
   per includerla nel PDF. Async perché deve caricare l'immagine di sfondo. */
function renderDiagramToImage(sess, view){
  return new Promise((resolve) => {
    const hasMarks = (sess.markers||[]).some(m=>m.view===view);
    const hasDraw = (sess.strokes||[]).some(st=>st.view===view);
    if (!hasMarks && !hasDraw){ resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      const W = 300, H = 500;
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const g = cv.getContext("2d");
      g.fillStyle = "#ffffff"; g.fillRect(0,0,W,H);
      // fit image preserving aspect
      const ar = img.width/img.height, cvar = W/H;
      let dw=W, dh=H, dx=0, dy=0;
      if (ar > cvar){ dh = W/ar; dy = (H-dh)/2; } else { dw = H*ar; dx = (W-dw)/2; }
      g.drawImage(img, dx, dy, dw, dh);
      // strokes
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim() || "#5B3B63";
      g.strokeStyle = accent; g.lineWidth = 3; g.lineCap="round"; g.lineJoin="round";
      (sess.strokes||[]).filter(st=>st.view===view).forEach(st => {
        g.beginPath(); st.points.forEach((p,i)=>{ const x=p.xPct/100*W, y=p.yPct/100*H; if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}); g.stroke();
      });
      // pins
      (sess.markers||[]).filter(m=>m.view===view).forEach((m,i) => {
        const x=m.xPct/100*W, y=m.yPct/100*H;
        g.fillStyle = accent; g.beginPath(); g.arc(x,y,10,0,Math.PI*2); g.fill();
        g.fillStyle="#fff"; g.font="bold 12px sans-serif"; g.textAlign="center"; g.textBaseline="middle";
        g.fillText(String(i+1), x, y);
      });
      try { resolve(cv.toDataURL("image/png")); }
      catch(e){ console.warn("Diagramma non esportabile (canvas tainted):", e); resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.crossOrigin = "anonymous";
    img.src = bodyImg(sess.genere, view);
  });
}
async function attachDiagrams(sess){
  if (sess.zonaMode !== "sagoma") return;
  const [fronte, retro] = await Promise.all([
    renderDiagramToImage(sess, "fronte"),
    renderDiagramToImage(sess, "retro"),
  ]);
  sess._diagImgs = {};
  if (fronte) sess._diagImgs.fronte = fronte;
  if (retro) sess._diagImgs.retro = retro;
}

/* QR "di verifica" per il timbro sul PDF: incapsula un breve testo di
   riepilogo (studio, numero di registro, data), MAI dati sensibili del
   cliente — non punta a nessun server, non c'e' nulla da consultare
   online, e' solo un modo rapido per ricontrollare a vista che il PDF
   in mano corrisponda al consenso archiviato. Sincrono: qrcode.min.js
   disegna nel costruttore, il canvas e' gia' pronto subito dopo. */
function generaQrDataUrl(testo, size){
  try {
    const host = document.createElement("div");
    host.style.cssText = "position:absolute;left:-9999px;top:-9999px;";
    document.body.appendChild(host);
    new QRCode(host, { text: testo, width: size || 120, height: size || 120, colorDark: "#1B1A19", colorLight: "#ffffff" });
    const canvas = host.querySelector("canvas");
    const dataUrl = canvas ? canvas.toDataURL("image/png") : null;
    document.body.removeChild(host);
    return dataUrl;
  } catch(e){ console.warn("QR verifica non generato:", e); return null; }
}
function buildPdf(s){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const PW = 595.28;                    // larghezza A4 in pt
  const M = 50;                          // margine
  const CW = PW - M*2;                   // larghezza contenuto
  const TOP = 54, BOTTOM = 760;
  let y = TOP;
  let pageNum = 1;

  // palette (dai colori studio, con fallback)
  const INK = "#1B1A19", SOFT = "#57514B", FAINT = "#8B837A";
  const cssAccent = getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim();
  const ACCENT = /^#?[0-9a-fA-F]{6}$/.test(cssAccent.replace("#","")) ? (cssAccent.startsWith("#")?cssAccent:"#"+cssAccent) : "#5B3B63";
  const hexToRgb = (h) => { const n = parseInt(h.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  const setFill = (h) => { const [r,g,b]=hexToRgb(h); doc.setFillColor(r,g,b); };
  const setText = (h) => { const [r,g,b]=hexToRgb(h); doc.setTextColor(r,g,b); };
  const setDraw = (h) => { const [r,g,b]=hexToRgb(h); doc.setDrawColor(r,g,b); };

  // ---- sigillo: logo/QR di verifica + numero di registro, al posto del footer anonimo ----
  const sigilloTesto = `InkConsent\n${STUDIO_CONFIG.studioName}\nConsenso N. ${s.progressivo || "non ancora archiviato"}\n${fmtDate((s.seduta && s.seduta.dataApplicazione) || s.createdAt)}`;
  const sigilloQr = generaQrDataUrl(sigilloTesto, 110);
  const footer = () => {
    setDraw("#DED7CC"); doc.setLineWidth(0.5); doc.line(M, BOTTOM+18, PW-M, BOTTOM+18);
    const sealY = BOTTOM + 24;
    let sx = M;
    if (sigilloQr){
      try { doc.addImage(sigilloQr, "PNG", M, sealY, 26, 26); sx = M + 32; } catch(e){}
    }
    doc.setFont("helvetica","bold"); doc.setFontSize(8); setText(INK);
    doc.text(`${STUDIO_CONFIG.studioName}${s.progressivo ? " · Consenso N. " + s.progressivo : ""}`, sx, sealY + 9);
    doc.setFont("helvetica","normal"); doc.setFontSize(7); setText(FAINT);
    doc.text(`Documento generato con InkConsent · da conservare almeno ${STUDIO_CONFIG.retentionYears} anni${sigilloQr ? " · QR di verifica a fianco" : ""}`, sx, sealY + 19);
    doc.text(`Pag. ${pageNum}`, PW-M, sealY + 9, { align: "right" });
  };
  const newPage = () => { footer(); doc.addPage(); pageNum++; y = TOP; };
  const ensure = (needed) => { if (y + needed > BOTTOM) newPage(); };

  // ---- intestazione con logo + riquadro registro ----
  const hasFisc = !!(STUDIO_CONFIG.ragioneSociale || STUDIO_CONFIG.indirizzoStudio || STUDIO_CONFIG.partitaIva || STUDIO_CONFIG.protocolloScia);
  const headerH = hasFisc ? 82 : 66;
  // logo (se presente come dataURL)
  let tx = M;
  if (STUDIO_CONFIG.logoDataUrl){
    try { doc.addImage(STUDIO_CONFIG.logoDataUrl, "PNG", M, y, 46, 46); tx = M + 58; } catch(e){}
  }
  doc.setFont("helvetica","bold"); doc.setFontSize(16); setText(INK);
  doc.text(STUDIO_CONFIG.studioName, tx, y+18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); setText(SOFT);
  doc.text(STUDIO_CONFIG.studioCity, tx, y+33);
  // riga dati fiscali/autorizzativi: solo i campi compilati, per chi ne ha l'obbligo
  const fisc = [
    STUDIO_CONFIG.ragioneSociale,
    STUDIO_CONFIG.indirizzoStudio,
    STUDIO_CONFIG.partitaIva ? "P.IVA/C.F. " + STUDIO_CONFIG.partitaIva : "",
    STUDIO_CONFIG.protocolloScia ? "SCIA/SUAP " + STUDIO_CONFIG.protocolloScia : "",
  ].filter(Boolean).join("  ·  ");
  let yInfo = y + 33;
  if (fisc){ doc.setFontSize(7.5); setText(FAINT); doc.text(fisc, tx, y+45); yInfo = y + 45; }
  doc.setFontSize(10.5); setText(ACCENT); doc.setFont("helvetica","bold");
  doc.text(`Consenso informato · ${s.tipoApplicazione === "piercing" ? "Piercing" : "Tatuaggio"}`, tx, yInfo+16);
  // riquadro numero registro a destra
  if (s.progressivo){
    const bw = 130, bh = 44, bx = PW - M - bw;
    setFill("#F5F1EB"); setDraw("#DED7CC"); doc.setLineWidth(0.8);
    doc.roundedRect(bx, y, bw, bh, 5, 5, "FD");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); setText(FAINT);
    doc.text("N. REGISTRO", bx+12, y+16);
    doc.setFont("helvetica","bold"); doc.setFontSize(15); setText(INK);
    doc.text(s.progressivo, bx+12, y+34);
  }
  y += headerH;
  setDraw(ACCENT); doc.setLineWidth(1.6); doc.line(M, y, PW-M, y); y += 22;

  // ---- helpers di sezione ----
  const section = (txt) => {
    ensure(40);
    setFill("#F5F1EB"); doc.rect(M, y-2, CW, 22, "F");
    setFill(ACCENT); doc.rect(M, y-2, 4, 22, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); setText(INK);
    doc.text(txt.toUpperCase(), M+14, y+13);
    y += 32;
  };
  // riga etichetta/valore in due colonne
  const kv = (label, value, opts={}) => {
    const val = (value==null||value==="") ? "—" : String(value);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); setText(FAINT);
    const labelW = 150;
    const split = doc.splitTextToSize(val, CW - labelW - 6);
    const h = Math.max(13, split.length*12);
    ensure(h);
    doc.text(label, M, y+9);
    doc.setFontSize(10); setText(opts.color || INK);
    if (opts.bold) doc.setFont("helvetica","bold");
    doc.text(split, M+labelW, y+9);
    doc.setFont("helvetica","normal");
    y += h;
  };
  // paragrafo lungo
  const para = (txt, size=9.5, color=SOFT) => {
    doc.setFont("helvetica","normal"); doc.setFontSize(size); setText(color);
    const split = doc.splitTextToSize(txt, CW);
    ensure(split.length*13);
    doc.text(split, M, y+9); y += split.length*13 + 4;
  };

  // ---- DATI CLIENTE ----
  section("Dati del cliente");
  kv("Nome e cognome", `${s.anagrafica.cognome} ${s.anagrafica.nome}`, {bold:true});
  kv("Data di nascita", fmtDate(s.anagrafica.nascita));
  kv("Residenza", `${s.anagrafica.comuneResidenza || "—"} (${s.anagrafica.provinciaResidenza || "—"})`);
  kv("Codice fiscale", s.anagrafica.cf);
  kv("Telefono", s.anagrafica.telefono);
  kv("Email", s.anagrafica.email);
  y += 8;

  if (s.minorenne){
    section("Autorizzazione per il minore");
    kv("Genitore/tutore 1", s.tutore1.nome, {bold:true});
    kv("Nato/a il", `${fmtDate(s.tutore1.dataNascita)} a ${s.tutore1.luogoNascita || "—"} (${s.tutore1.provNascita || "—"})`);
    kv("Residente in", `${s.tutore1.comuneResidenza || "—"} (${s.tutore1.provResidenza || "—"}), ${s.tutore1.via || "—"} n. ${s.tutore1.numeroCivico || "—"}`);
    if (s.tutore2.nome){
      kv("Genitore/tutore 2", s.tutore2.nome, {bold:true});
      kv("Nato/a il", `${fmtDate(s.tutore2.dataNascita)} a ${s.tutore2.luogoNascita || "—"} (${s.tutore2.provNascita || "—"})`);
      kv("Residente in", `${s.tutore2.comuneResidenza || "—"} (${s.tutore2.provResidenza || "—"}), ${s.tutore2.via || "—"} n. ${s.tutore2.numeroCivico || "—"}`);
    }
    kv(`Documento (${s.documento.intestatario})`, `${s.documento.tipo || "—"} n. ${s.documento.numero || "—"}, ril. da ${s.documento.autorita || "—"} il ${fmtDate(s.documento.dataRilascio)}, scad. ${fmtDate(s.documento.dataScadenza)}`);
    y += 8;
  }

  // ---- QUESTIONARIO SANITARIO (due colonne) ----
  section("Questionario sanitario");
  doc.setFontSize(9);
  const colW = CW/2;
  let qi = 0;
  const startY = y;
  const half = Math.ceil(HEALTH_QUESTIONS.length/2);
  HEALTH_QUESTIONS.forEach((q, i) => {
    const col = i < half ? 0 : 1;
    const row = i < half ? i : i - half;
    if (col === 0 && i === half) {} // no-op
    const cx = M + col*colW;
    const cy = startY + row*15;
    if (cy + 15 > BOTTOM){ /* raro: lascia scorrere sotto */ }
    const ans = (s.sanitario[q.id]||"—").toUpperCase();
    setText(FAINT); doc.setFont("helvetica","normal");
    const qlabel = doc.splitTextToSize(q.label, colW - 44)[0];
    doc.text(qlabel, cx, cy+9);
    setText(ans==="SÌ"||ans==="SI" ? ACCENT : SOFT); doc.setFont("helvetica","bold");
    doc.text(ans, cx + colW - 40, cy+9);
    doc.setFont("helvetica","normal");
  });
  y = startY + half*15 + 6;
  if (s.sanitarioNote){ setText(SOFT); doc.setFont("helvetica","italic"); doc.setFontSize(9); para(`Note: ${s.sanitarioNote}`); doc.setFont("helvetica","normal"); }
  const nSi = HEALTH_QUESTIONS.filter(q => s.sanitario[q.id] === "si").length;
  if (nSi > 0 && s.sanitarioOverride){
    setText(ACCENT); doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
    para(`${nSi} condizione/i segnalata/e: il tatuatore ha valutato e proceduto sotto la propria responsabilità.`);
    doc.setFont("helvetica","normal"); setText(FAINT);
  }
  y += 8;

  // ---- ZONA E DISEGNO ----
  section("Zona e disegno");
  if (s.zonaMode === "sagoma"){
    kv("Modalità", `Sagoma anatomica (${s.genere})`);
    kv("Segni", `${(s.markers||[]).length} punto/i · ${(s.strokes||[]).length} disegno/i${s.zonaLibera ? " — " + s.zonaLibera : ""}`);
    if (s._diagImgs && (s._diagImgs.fronte || s._diagImgs.retro)){
      ensure(210);
      const imgW = 116, imgH = 194; let ix = M;
      setDraw("#DED7CC"); doc.setLineWidth(0.6);
      ["fronte","retro"].forEach(v => {
        if (s._diagImgs[v]){
          try {
            doc.roundedRect(ix-4, y-4, imgW+8, imgH+8, 4, 4, "S");
            doc.addImage(s._diagImgs[v], "PNG", ix, y, imgW, imgH);
            setText(FAINT); doc.setFontSize(8);
            doc.text(v === "fronte" ? "Fronte" : "Retro", ix, y+imgH+14);
          } catch(e){}
          ix += imgW + 24;
        }
      });
      y += imgH + 24;
    }
  } else {
    kv("Zona/e", `${s.zone.join(", ") || "—"}${s.zonaLibera ? " — " + s.zonaLibera : ""}`);
  }
  kv("Grandezza indicativa", s.grandezza);
  kv("Nei nell'area", s.zoneNei === "si" ? "Sì — " + (s.zoneNeiNote || "nessuna nota") : "No");
  y += 8;

  // ---- CONSENSO ----
  section(`Consenso informato · ${s.informativaVersion || ""}`);
  para("Il cliente dichiara di aver letto e compreso il Modulo di Consenso Informato, di aver fornito dichiarazioni veritiere, di impegnarsi a seguire le istruzioni di cura ed esonera l'esecutore e lo studio da responsabilità per i rischi illustrati.");
  kv("Trattamento dati (GDPR, Reg. UE 2016/679, artt. 9 e 13)", s.privacyConsenso ? "Consenso esplicito prestato" : "Non prestato", {bold:true, color: s.privacyConsenso?ACCENT:INK});
  kv("Disegno visionato e approvato", s.disegnoConfermato ? "Sì" : "No", {bold:true});
  y += 8;

  // ---- DATI SEDUTA ----
  const sd = s.seduta || {};
  section("Dati della seduta (compilati in studio)");
  kv("Data applicazione", sd.dataApplicazione ? fmtDate(sd.dataApplicazione) : "—");
  kv("Zona trattata", sd.sedeEffettiva);
  if ((sd.inchiostri||[]).length){
    kv("Inchiostri usati", sd.inchiostri.map(it => `${it.nome||"—"}${it.colore?" ("+it.colore+")":""} · lotto ${it.lotto||"—"}${it.scadenza?" · scad. "+fmtDate(it.scadenza):""}`).join("\n"));
  } else kv("Inchiostri usati", "—");
  if ((sd.aghi||[]).length){
    kv("Aghi usati", sd.aghi.map(it => `${it.tipo||"—"}${it.marca?" ("+it.marca+")":""} · lotto ${it.lotto||"—"}${it.scadenza?" · scad. "+fmtDate(it.scadenza):""}`).join("\n"));
  } else kv("Aghi usati", "—");
  if (sd.materiali) kv("Note materiali", sd.materiali);
  kv("Scheda tecnica allegata", sd.schedaTecnicaAllegata ? "Sì" : "No");
  if (sd.reazioniAvverse) kv("Reazioni avverse", sd.reazioniAvverse);
  y += 10;

  // ---- FIRME (box incorniciati) ----
  const sigBox = (x, w, label, imgData, caption) => {
    const bh = 96;
    setDraw("#DED7CC"); doc.setLineWidth(0.8);
    doc.roundedRect(x, y, w, bh, 4, 4, "S");
    setText(FAINT); doc.setFont("helvetica","bold"); doc.setFontSize(7.5);
    doc.text(label.toUpperCase(), x+10, y+15);
    if (imgData){ try { doc.addImage(imgData, "PNG", x+10, y+20, w-20, 50); } catch(e){} }
    setDraw("#EAE4DA"); doc.setLineWidth(0.5); doc.line(x+10, y+76, x+w-10, y+76);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); setText(SOFT);
    doc.text(caption, x+10, y+88);
  };
  const twoSig = s.minorenne && s.firmaTutore2Data;
  ensure(twoSig ? 210 : 110);
  section("Firme");
  const halfW = (CW - 20) / 2;
  sigBox(M, halfW, s.minorenne ? "Genitore / tutore" : "Cliente", s.firmaClienteData, `Firmato il ${fmtDateTime(s.firmaClienteAt)}`);
  sigBox(M + halfW + 20, halfW, `Tatuatore · ${s.artista||""}`, s.controfirmaData, `Controfirmato il ${fmtDateTime(s.controfirmaAt)}`);
  y += 96 + 14;
  if (twoSig){
    sigBox(M, halfW, "Secondo genitore / tutore", s.firmaTutore2Data, `Firmato il ${fmtDateTime(s.firmaTutore2At)}`);
    y += 96 + 14;
  }

  footer();
  const dataFile = (s.seduta && s.seduta.dataApplicazione) || (s.updatedAt||"").slice(0,10) || new Date().toISOString().slice(0,10);
  const slug = (x) => String(x||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const nome = `${dataFile}_${slug(s.anagrafica.cognome)}-${slug(s.anagrafica.nome)}.pdf`.replace(/_-/,"_");
  if (window.__pdfBatch){ window.__pdfBatch.push({ doc, nome }); return; }   // in batch non salva, accumula
  doc.save(nome);
  delete s._diagImgs; // transiente: non salvare le immagini pesanti in localStorage
}

/* ============================================================
   RICHIESTE PREVENTIVO — vista cliente (lead intake)
   ============================================================ */
let leadDraft = null;
const LEAD_STEP_LABELS = ["I tuoi dati","Il tatuaggio","Dove","Invio"];

function validateLeadStep(step){
  const errs = [];
  if (step === 1){
    if (!leadDraft.cliente.nome.trim()) errs.push("Inserisci il nome.");
    if (!leadDraft.cliente.cognome.trim()) errs.push("Inserisci il cognome.");
    if (!leadDraft.cliente.telefono.trim()) errs.push("Inserisci un numero di telefono: è come ti contattiamo su WhatsApp.");
  }
  if (step === 2){
    if (!leadDraft.stile.length && !leadDraft.stileAltro.trim()) errs.push("Scegli almeno uno stile (o descrivilo in \"Altro\").");
    if (!leadDraft.descrizione.trim()) errs.push("Racconta in poche righe cosa hai in mente.");
  }
  if (step === 3){
    if (!leadDraft.markers.length && !(leadDraft.strokes||[]).length) errs.push("Segna la zona sulla sagoma (con un punto o disegnando).");
  }
  return errs;
}

function renderLeadShell(){
  if (!leadDraft) leadDraft = blankRichiesta();
  const total = 4;
  if (state.leadDone) return renderLeadDone();
  return `
  <div class="client-shell area-preventivo">
    <div class="client-head">
      <div class="rail-brand">
        <div class="rail-mark">${markHtml()}</div>
        <div>
          <div class="rail-brand-name" style="color:var(--ink);">${esc(STUDIO_CONFIG.studioName)}</div>
          <span class="area-badge">Preventivo</span>
          <div class="rail-brand-sub">Richiesta consulenza · passo ${state.leadStep} di ${total}</div>
        </div>
      </div>
      <div class="progress-track">
        ${Array.from({length: total}).map((_,i) => `<div class="progress-dash"><i style="width:${i < state.leadStep ? 100 : 0}%"></i></div>`).join("")}
      </div>
    </div>
    <div class="client-body">
      <div class="card" id="lead-step-content">${renderLeadStepBody(state.leadStep)}</div>
    </div>
  </div>`;
}
function renderLeadDone(){
  return `
  <div class="client-shell area-preventivo">
    <div class="client-body" style="padding-top:60px;text-align:center;">
      <div class="rail-mark" style="width:56px;height:56px;font-size:22px;margin:0 auto 18px;">${markHtml()}</div>
      <h2>Richiesta inviata${leadDraft.cliente.nome ? ", grazie " + esc(leadDraft.cliente.nome) : ""}!</h2>
      <p class="section-desc">Ti scriviamo su WhatsApp al numero che ci hai lasciato per fissare una consulenza gratuita in studio, dove ti diamo un preventivo su misura.</p>
      ${state.leadSyncFailed ? `<div class="callout warn" style="text-align:left;margin-top:18px;">La richiesta è salvata sul tuo telefono, ma non siamo riusciti a inviarla in automatico allo studio per un problema di rete. Se non ricevi risposta entro un paio di giorni, ricontattaci direttamente.</div>` : ""}
    </div>
  </div>`;
}

function renderLeadErrors(step){
  const errs = state.leadShowErrors === step ? validateLeadStep(step) : [];
  if (!errs.length) return "";
  return `<div class="callout warn" style="margin-bottom:18px;">${errs.map(esc).join("<br>")}</div>`;
}

function renderLeadStepBody(step){
  if (step === 1) return renderLeadStep1();
  if (step === 2) return renderLeadStep2();
  if (step === 3) return renderLeadStep3();
  if (step === 4) return renderLeadStep4();
  return "";
}

function renderLeadStep1(){
  const c = leadDraft.cliente;
  return `
  ${renderLeadErrors(1)}
  ${STUDIO_CONFIG.artists.length > 1 ? `
  <h3 class="section-title">Con chi vorresti parlare?</h3>
  <p class="section-desc">Facoltativo: se non hai una preferenza, lascia stare e ci pensiamo noi.</p>
  <div class="chip-grid" style="margin-bottom:20px;">
    ${STUDIO_CONFIG.artists.map(nome => `<button class="chip ${leadDraft.tatuatoreScelto===nome?'on':''}" data-action="set-lead-tatuatore" data-nome="${esc(nome)}">${esc(nome)}</button>`).join("")}
  </div>` : ""}
  <h3 class="section-title">I tuoi dati</h3>
  <p class="section-desc">Ci servono per ricontattarti su WhatsApp e fissare la consulenza.</p>
  <div class="grid-2">
    <div class="field"><label>Nome</label><input type="text" data-field-lead="cliente.nome" value="${esc(c.nome)}"></div>
    <div class="field"><label>Cognome</label><input type="text" data-field-lead="cliente.cognome" value="${esc(c.cognome)}"></div>
  </div>
  <div class="field"><label>Data di nascita</label><input type="date" data-field-lead="cliente.nascita" value="${esc(c.nascita)}"></div>
  <div class="grid-2">
    <div class="field"><label>Telefono (WhatsApp)</label><input type="tel" data-field-lead="cliente.telefono" value="${esc(c.telefono)}" placeholder="333 1234567"></div>
    <div class="field"><label>Email (facoltativa)</label><input type="email" data-field-lead="cliente.email" value="${esc(c.email)}"></div>
  </div>
  ${renderLeadNav(1)}`;
}

function renderLeadStep2(){
  return `
  ${renderLeadErrors(2)}
  <h3 class="section-title">Il tatuaggio</h3>
  <p class="section-desc">Che stile hai in mente?</p>
  <div class="chip-grid">
    ${TATTOO_STYLES.map(s => `<button class="chip ${leadDraft.stile.includes(s)?'on':''}" data-action="toggle-stile" data-s="${esc(s)}">${esc(s)}</button>`).join("")}
  </div>
  ${leadDraft.stile.includes("Altro") ? `
  <div class="field" style="margin-top:12px;"><label>Descrivi lo stile</label><input type="text" data-field-lead="stileAltro" value="${esc(leadDraft.stileAltro)}"></div>` : ""}
  <div class="field" style="margin-top:16px;">
    <label>Raccontaci cosa hai in mente</label>
    <textarea data-field-lead="descrizione" placeholder="Soggetto, riferimenti, dettagli…">${esc(leadDraft.descrizione)}</textarea>
  </div>
  <div class="field">
    <label>Dimensione indicativa</label>
    <div class="chip-grid">
      ${DIMENSIONI.map(d => `<button class="chip ${leadDraft.dimensione===d?'on':''}" data-action="set-dimensione" data-d="${esc(d)}">${esc(d)}</button>`).join("")}
    </div>
    <div class="hint">Se hai già un'idea precisa, indica anche i centimetri qui sotto — aiuta il tatuatore a fare un preventivo più giusto.</div>
  </div>
  <div class="field" style="max-width:160px;">
    <label>Lato più lungo (cm)</label>
    <input type="number" min="1" max="120" inputmode="numeric" data-field-lead="dimensioneCm" value="${esc(leadDraft.dimensioneCm||"")}" placeholder="Es. 15">
  </div>
  <div class="field">
    <label>Foto di riferimento (facoltativa)</label>
    <div style="display:flex;align-items:center;gap:14px;">
      ${leadDraft.referenceImg ? `<div class="disp-thumb"><img src="${leadDraft.referenceImg}" alt="riferimento"></div>` : ""}
      <div>
        <button type="button" class="btn btn-ghost btn-sm" data-action="pick-reference">${leadDraft.referenceImg ? "Cambia foto…" : "Carica foto…"}</button>
        ${leadDraft.referenceImg ? `<button type="button" class="btn btn-ghost btn-sm" data-action="remove-reference">Rimuovi</button>` : ""}
        <div class="hint">Uno screenshot, un disegno, una foto simile a quello che vuoi.</div>
      </div>
      <input type="file" id="reference-file" accept="image/png,image/jpeg" style="display:none;">
    </div>
  </div>
  ${renderLeadNav(2)}`;
}

function renderLeadStep3(){
  const sm = leadDraft.zonaSegnaMode || "pin";
  return `
  ${renderLeadErrors(3)}
  <h3 class="section-title">Dove vorresti farlo</h3>
  <p class="section-desc">${sm==='pin' ? "Tocca il punto sulla sagoma. Tocca un punto già segnato per rimuoverlo." : "Disegna col dito attorno alla zona che ti interessa."}</p>
  <div class="gender-toggle">
    <button class="chip ${leadDraft.genere==='maschile'?'on':''}" data-action="set-genere" data-g="maschile">Corpo maschile</button>
    <button class="chip ${leadDraft.genere==='femminile'?'on':''}" data-action="set-genere" data-g="femminile">Corpo femminile</button>
  </div>
  <div class="gender-toggle" style="margin-top:8px;">
    <button class="chip ${sm==='pin'?'on':''}" data-action="set-segnamode" data-m="pin">${icon("pin",15)} Punto</button>
    <button class="chip ${sm==='disegno'?'on':''}" data-action="set-segnamode" data-m="disegno">${icon("pen",15)} Disegna</button>
    <button class="chip" data-action="clear-sagoma">Cancella</button>
  </div>
  <div class="body-pair">
    ${renderBodyFrame("fronte")}
    ${renderBodyFrame("retro")}
  </div>
  ${renderLeadNav(3)}`;
}
function renderBodyFrame(view){
  const mode = leadDraft.zonaSegnaMode || "pin";
  const pins = leadDraft.markers.map((m,i) => m.view === view ? `<div class="body-pin" data-action="remove-pin" data-i="${i}" style="left:${m.xPct}%;top:${m.yPct}%;"><span>${i+1}</span></div>` : "").join("");
  return `
  <div>
    <div class="body-frame ${mode==='pin'?'mode-pin':''}" ${mode==='pin'?`data-action="mark-body" data-view="${view}"`:''}>
      <img class="body-bg" src="${bodyImg(leadDraft.genere, view)}" alt="" draggable="false">
      ${mode==='disegno' ? `<canvas class="body-draw" data-draw-view="${view}" data-draw-ctx="lead"></canvas>` : pins}
    </div>
    <div class="body-label">${view === "fronte" ? "Fronte" : "Retro"}</div>
  </div>`;
}

function renderLeadStep4(){
  const c = leadDraft.cliente;
  return `
  ${renderLeadErrors(4)}
  <h3 class="section-title">Riepilogo</h3>
  <p class="section-desc">Controlla e invia: ti ricontattiamo su WhatsApp.</p>
  <div class="card" style="background:var(--paper);">
    <div class="kv"><span>Nome</span><b>${esc(c.nome)} ${esc(c.cognome)}</b></div>
    <div class="kv"><span>Telefono</span><b>${esc(c.telefono)}</b></div>
    <div class="kv"><span>Stile</span><b>${leadDraft.stile.map(esc).join(", ")}${leadDraft.stileAltro ? " — " + esc(leadDraft.stileAltro) : ""}</b></div>
    <div class="kv"><span>Dimensione</span><b>${esc(leadDraft.dimensione || "—")}${leadDraft.dimensioneCm ? " · ~" + esc(leadDraft.dimensioneCm) + " cm" : ""}</b></div>
    <div class="kv"><span>Punti segnati</span><b>${leadDraft.markers.length}</b></div>
    ${leadDraft.referenceImg ? `<div class="kv"><span>Foto di riferimento</span><b>Allegata</b></div>` : ""}
  </div>
  ${renderLeadNav(4)}`;
}

function renderLeadNav(step){
  const isLast = step === 4;
  const inStudio = leadDraft && leadDraft.creataInStudio;
  return `
  <div class="btn-row">
    ${step > 1 ? `<button class="btn btn-ghost" data-action="lead-prev">${icon("arrowLeft",15)} Indietro</button>` : ""}
    <button class="btn btn-accent" data-action="${isLast ? "lead-submit" : "lead-next"}">${isLast ? (inStudio ? "Salva preventivo" : "Invia richiesta") : 'Avanti ' + icon("arrowRight",15)}</button>
  </div>`;
}

/* ============================================================
   RICHIESTE PREVENTIVO — vista studio (lista + dettaglio + nuovo)

/* "Nuovo preventivo" (prompt6, Task 7): riusa lo stesso modulo a passi

    <div class="card">${renderLeadStepBody(state.leadStep)}</div>
  </div>`;
}
function renderLeads(){

  <div class="topbar">
    <div><h1>Richieste preventivo</h1><p>${leads.length} richiest${leads.length===1?"a":"e"}${nuove ? ` · ${nuove} da contattare` : ""}</p></div>

        <span class="lead-status ${LEAD_STATUS[l.status].cls}">${LEAD_STATUS[l.status].label}</span>

              : `<span class="wa-btn disabled" title="Indirizzata a ${esc(l.tatuatoreScelto)}: solo lei/lui può prenderla in carico">${icon("lock",13)} WhatsApp</span>`)

        </div>
      </div>
      <div class="field"><label>Data consulenza fissata</label><input type="date" data-field-lead="dataConsulenza" value="${esc(l.dataConsulenza)}"></div>
      <div class="field"><label>Note interne</label><textarea data-field-lead="noteStudio" placeholder="Note su questo cliente…">${esc(l.noteStudio)}</textarea></div>
      <div class="btn-row">
        ${c.telefono ? `<a class="wa-btn" href="${waLink(c.telefono, waMessageFor(l))}" target="_blank" rel="noopener">Scrivi su WhatsApp</a>` : ""}
        <button class="btn btn-primary" data-action="lead-to-consenso">Crea consenso per questo cliente</button>
      </div>
      <div class="btn-row"><button class="btn btn-ghost btn-sm" data-action="save-lead">Salva</button></div>
    </div>
  </div>`;
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function resumeStep(s){
  if (!s.anagrafica.nome.trim()) return 1;
  if (Object.keys(s.sanitario).length < HEALTH_QUESTIONS.length) return 2;
  const zonaOk = s.zonaMode === "sagoma" ? s.markers.length : (s.zone.length || s.zonaLibera.trim());
  if (!zonaOk || !s.zoneNei) return 3;
  if (!s.informativaLetta) return 4;
  if (!s.privacyConsenso || !s.disegnoConfermato) return 5;
  if (!s.firmaClienteData) return 6;
  if (!s.seduta.dataApplicazione) return 7;
  return 8;
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  // --- tour di benvenuto ---
  if (action === "tour-next"){ state.tourStep = Math.min(TOUR_SLIDES.length-1, state.tourStep+1); render(); return; }
  else if (action === "tour-prev"){ state.tourStep = Math.max(0, state.tourStep-1); render(); return; }
  else if (action === "tour-toggle-dont"){ state.tourDontShow = !state.tourDontShow; return; }
  else if (action === "tour-skip" || action === "tour-finish"){
    if (state.tourDontShow) localStorage.setItem(TOUR_KEY, JSON.stringify({ dontShow: true }));
    state.showTour = false; state.tourStep = 0;
    // dopo il tour: condizioni, poi accesso
    if (!termsAccepted()) state.needsTerms = true;
    else if (!authIsSet()) state.needsSetup = true;
    else state.locked = true;
    render(); return;
  }
  else if (action === "terms-check"){
    const k = btn.dataset.k || (e.target && e.target.dataset.k);
    if (k){ state.termsChecks = { ...(state.termsChecks||{}), [k]: !(state.termsChecks||{})[k] }; state.loginError = null; render(); }
    return;
  }
  else if (action === "terms-accept"){
    const c = state.termsChecks || {};
    if (!(c.uso && c.dati && c.assistenza)){
      state.loginError = "Servono tutte e tre le spunte per continuare.";
      render(); return;
    }
    saveTermsAccepted();
    state.needsTerms = false; state.loginError = null;
    if (!authIsSet()) state.needsSetup = true; else state.locked = true;
    render(); return;
  }

  // --- account studio (email+password, Supabase Auth) ---
  else if (action === "account-goto-signin"){ state.accountMode = "signin"; state.accountError = null; state.accountNeedsConfirm = false; render(); }
  else if (action === "account-goto-signup"){ state.accountMode = "signup"; state.accountError = null; render(); }
  else if (action === "account-signup"){
    const b = state.accountBuffer || {};
    const email = (b.email||"").trim(), pw = b.password||"", pw2 = b.password2||"";
    if (!email || !email.includes("@")){ state.accountError = "Inserisci un'email valida."; render(); return; }
    if (pw.length < 6){ state.accountError = "La password deve avere almeno 6 caratteri."; render(); return; }
    if (pw !== pw2){ state.accountError = "Le due password non coincidono."; render(); return; }
    state.accountBusy = true; state.accountError = null; render();
    savePendingTrialSignup({ telefono: b.telefono||"", titolare: b.titolare||"" });
    supabaseSignUp(email, pw).then(data => {
      state.accountBusy = false;
      if (data.access_token){
        saveStudioAccount(accountFromAuthResponse(data));
        state.needsStudioAccount = false; state.accountBuffer = null;
        state.needsTrialChoice = true;
        render();
      } else {
        // conferma email richiesta dal progetto: nessuna sessione ancora
        state.accountNeedsConfirm = true; render();
      }
    }).catch(err => { state.accountBusy = false; state.accountError = err.message; render(); });
  }
  else if (action === "account-signin"){
    const b = state.accountBuffer || {};
    const email = (b.email||"").trim(), pw = b.password||"";
    if (!email || !pw){ state.accountError = "Inserisci email e password."; render(); return; }
    state.accountBusy = true; state.accountError = null; render();
    supabaseSignIn(email, pw).then(async data => {
      state.accountBusy = false;
      saveStudioAccount(accountFromAuthResponse(data));
      state.needsStudioAccount = false; state.accountBuffer = null;
      // dispositivo NUOVO su uno studio che esiste già (prompt9,
      // "secondo dispositivo"): recupera nome studio/città/titolare da
      // Supabase invece di richiederli di nuovo — evita un secondo
      // profilo tatuatore con un nome diverso per la stessa persona.
      const remoto = await sincronizzaDatiStudioDaRemoto();
      if (remoto.completato){
        registraDispositivoCorrente().then(esito => {
          if (esito && esito.consentito === false) state.deviceLimitBlock = esito;
          render();
        });
        return;
      }
      // altrimenti: prova gratuita non ancora avviata da nessuna parte
      // (segue una creazione account con conferma email in sospeso, o
      // caso limite) — manca ancora quel passaggio esplicito.
      state.needsTrialChoice = true; render();
    }).catch(err => { state.accountBusy = false; state.accountError = err.message; render(); });
  }
  else if (action === "trial-start"){
    const pending = loadPendingTrialSignup();
    const telefono = campoTrial("telefono", pending).trim();
    const titolare = campoTrial("titolare", pending).trim();
    const studioName = campoTrial("studioName", pending).trim();
    const citta = campoTrial("citta", pending).trim();
    const password = ((state.trialBuffer||{}).password || "");
    const password2 = ((state.trialBuffer||{}).password2 || "");
    if (!titolare || !studioName || !citta){
      state.trialError = "Nome studio, città e titolare sono obbligatori.";
      render(); return;
    }
    // prompt13, Task 3: la password locale del titolare si raccoglie QUI,
    // nello stesso passaggio — non più un secondo "login" percepito come
    // separato la prima volta che sceglie se stesso in "chi sta lavorando
    // ora" (vedi setCredenzialiTatuatore più sotto).
    if (!password || password.length < 4){
      state.trialError = "Scegli una password locale di almeno 4 caratteri.";
      render(); return;
    }
    if (password !== password2){
      state.trialError = "Le due password non coincidono.";
      render(); return;
    }
    state.trialBusy = true; state.trialError = null; render();
    // dati reali dello studio applicati subito in locale (prompt9, Task
    // 2): sostituiscono i placeholder di STUDIO_DEFAULTS. artistsText =
    // titolare rende STUDIO_CONFIG.artists[0] il titolare stesso, cosi'
    // assicuraProfiliTatuatori() sotto crea il SUO profilo, non uno
    // generico "Nome Artista".
    const ov = loadStudioOverrides();
    saveStudioOverrides({ ...ov, studioName, studioCity: citta, artistsText: titolare });
    applyStudioConfig();
    // primo profilo tatuatore = il titolare, nato ORA (prompt9, Task 3):
    // niente ACTIVE_TATUATORE qui apposta — con un solo tatuatore il
    // conteggio dispositivi resta quello per-studio esistente
    // (confermato), il profilo serve solo a registrare l'identità su
    // licenza_tatuatori, non cambia come si registra il dispositivo.
    const profilo = assicuraProfiliTatuatori().find(t => t.nome === titolare);
    Promise.resolve(profilo ? setCredenzialiTatuatore(profilo.id, titolare, password) : null).then(() => {
      supabaseAvviaTrial(telefono, titolare, studioName, citta, profilo ? profilo.supabaseId : null).then(() => {
        clearPendingTrialSignup();
        const acc = loadStudioAccount();
        if (acc) saveStudioAccount({ ...acc, telefono, titolare });
        state.trialBusy = false; state.needsTrialChoice = false; state.trialBuffer = null;
        state.showPostOnboardingNotice = true;
        registraDispositivoCorrente().then(esito => {
          if (esito && esito.consentito === false) state.deviceLimitBlock = esito;
          render();
        });
      }).catch(err => { state.trialBusy = false; state.trialError = err.message; render(); });
    });
  }
  else if (action === "trial-start-manual"){
    const acc = loadStudioAccount() || {};
    const profilo = assicuraProfiliTatuatori().find(t => t.nome === STUDIO_CONFIG.artists[0]);
    state.trialManualBusy = true; state.trialManualError = null; state.trialManualOk = false; render();
    supabaseAvviaTrial(acc.telefono||"", acc.titolare||"", STUDIO_CONFIG.studioName||"", STUDIO_CONFIG.studioCity||"", profilo ? profilo.supabaseId : null).then(() => {
      state.trialManualBusy = false; state.trialManualOk = true; render();
    }).catch(err => { state.trialManualBusy = false; state.trialManualError = err.message; render(); });
  }
  else if (action === "account-sign-out"){
    clearStudioAccount();
    state.deviceLimitBlock = null; ACTIVE_TATUATORE = null;
    state.needsStudioAccount = true; state.accountMode = "signin";
    render();
  }
  else if (action === "device-limit-retry"){
    state.accountBusy = true; render();
    (async () => {
      const t = tatuatoreAttivo();
      if (t){
        const esitoT = await registraTatuatoreCorrente(t);
        if (esitoT && esitoT.consentito === false){ state.accountBusy = false; state.deviceLimitBlock = esitoT; render(); return; }
      }
      const esito = await registraDispositivoCorrente();
      state.accountBusy = false;
      state.deviceLimitBlock = (esito && esito.consentito === false) ? esito : null;
      render();
    })();
  }
  else if (action === "remove-dispositivo"){
    rimuoviDispositivoRemoto(btn.dataset.id).then(() => elencoDispositiviStudio()).then(list => { state.deviceList = list; render(); });
  }
  else if (action === "refresh-device-list"){
    elencoDispositiviStudio().then(list => { state.deviceList = list; render(); });
  }

  // --- scelta/switch tatuatore attivo (prompt6, Task 1) ---
  else if (action === "tatuatore-pick"){
    state.tatuatoreSwitchPick = btn.dataset.id; state.tatuatoreSwitchError = null; state.tatuatoreSwitchBuffer = {};
    render();
  }
  else if (action === "tatuatore-pick-back"){
    state.tatuatoreSwitchPick = null; state.tatuatoreSwitchError = null; render();
  }
  else if (action === "dismiss-richieste-banner"){ clearTimeout(richiesteBannerTimer); state.nuoveRichiesteBanner = []; render(); }
  else if (action === "dismiss-post-onboarding-notice"){ state.showPostOnboardingNotice = false; render(); }
  else if (action === "goto-richieste-da-banner"){
    clearTimeout(richiesteBannerTimer);
    const nuove = state.nuoveRichiesteBanner || [];
    // prompt13, Task 1: "vai direttamente a quella richiesta" — con una
    // sola richiesta nuova si apre subito il suo dettaglio, non solo
    // l'elenco; con più di una (impossibile sapere "quella" giusta) si
    // apre l'elenco, come prima.
    if (nuove.length === 1 && getRichiesta(nuove[0].id)){
      leadDraft = getRichiesta(nuove[0].id); state.view = "lead-detail";
    } else {
      state.view = "leads";
    }
    state.nuoveRichiesteBanner = []; state.railOpen = false; render();
  }
  else if (action === "cambia-tatuatore"){
    ACTIVE_TATUATORE = null; render();
  }
  else if (action === "reset-credenziali-tatuatore"){
    const list = loadTatuatori();
    const i = list.findIndex(t => t.id === btn.dataset.id);
    if (i >= 0){ list[i] = { ...list[i], username: "", salt: "", hash: "" }; saveTatuatori(list); }
    if (ACTIVE_TATUATORE === btn.dataset.id) ACTIVE_TATUATORE = null;
    render();
  }
  else if (action === "tatuatore-claim" || action === "tatuatore-login"){
    const id = state.tatuatoreSwitchPick;
    const b = state.tatuatoreSwitchBuffer || {};
    (async () => {
      if (action === "tatuatore-claim"){
        const username = (b.username||"").trim(), pw = b.password||"", pw2 = b.password2||"";
        if (!username){ state.tatuatoreSwitchError = "Inserisci uno username."; render(); return; }
        if (pw.length < 4){ state.tatuatoreSwitchError = "La password deve avere almeno 4 caratteri."; render(); return; }
        if (pw !== pw2){ state.tatuatoreSwitchError = "Le due password non coincidono."; render(); return; }
        state.tatuatoreSwitchBusy = true; render();
        await setCredenzialiTatuatore(id, username, pw);
      } else {
        const pw = b.password||"";
        state.tatuatoreSwitchBusy = true; render();
        const ok = await verificaCredenzialiTatuatore(id, pw);
        if (!ok){
          state.tatuatoreSwitchBusy = false; state.tatuatoreSwitchError = "Password sbagliata."; render(); return;
        }
      }
      ACTIVE_TATUATORE = id;
      const t = tatuatoreAttivo();
      const esitoT = await registraTatuatoreCorrente(t);
      if (esitoT && esitoT.consentito === false){
        state.tatuatoreSwitchBusy = false; state.deviceLimitBlock = esitoT; state.tatuatoreSwitchPick = null; render(); return;
      }
      const esitoD = await registraDispositivoCorrente();
      state.tatuatoreSwitchBusy = false;
      state.tatuatoreSwitchPick = null; state.tatuatoreSwitchBuffer = null;
      state.deviceLimitBlock = (esitoD && esitoD.consentito === false) ? esitoD : null;
      render();
    })();
  }

  // --- primo avvio: crea accesso ---
  if (action === "setup-create"){
    const b = state.setupBuffer || {};
    const id = (b.studioId||"").trim(), pw = b.pw||"", pw2 = b.pw2||"";
    if (id.length < 3){ state.loginError = "L'ID studio deve avere almeno 3 caratteri."; render(); return; }
    if (pw.length < 4){ state.loginError = "La password deve avere almeno 4 caratteri."; render(); return; }
    if (pw !== pw2){ state.loginError = "Le due password non coincidono."; render(); return; }
    // crea la cassaforte e passa alla fase 2: le 12 parole
    state.loginError = null;
    (async () => {
      try {
        await setAuth(id, pw, null);
        state.recoveryPhrase = await creaCassaforteEMigra(pw);
        chiediPersistenza();
        state.setupPhase = "recovery"; state.recoverySaved = false;
      } catch(e){
        console.error(e);
        state.loginError = "Non sono riuscito a creare la cassaforte su questo browser.";
      }
      render();
    })();
    return;
  }
  if (action === "copy-recovery"){
    if (navigator.clipboard) navigator.clipboard.writeText(state.recoveryPhrase||"").catch(()=>{});
    return;
  }
  if (action === "toggle-recovery-saved"){ state.recoverySaved = !state.recoverySaved; renderLockOnly(); return; }
  if (action === "setup-finish"){
    if (!state.recoverySaved){ state.loginError = "Conferma di aver trascritto le 12 parole prima di procedere."; render(); return; }
    state.needsSetup = false; state.setupPhase = null; state.locked = false;
    state.loginError = null; state.setupBuffer = {}; state.recoveryPhrase = null;
    render();
    return;
  }

  // --- login ID + password ---
  if (action === "login-submit"){
    const pw = state.loginPw;
    (async () => {
      const a = loadAuth() || {};
      const idOk = !a.studioId || (state.loginId||"").trim().toLowerCase() === (a.studioId||"").trim().toLowerCase();
      if (!idOk){ state.loginError = "ID o password errati."; state.loginPw = ""; render(); return; }
      try {
        if (vaultEsiste()){
          /* La verita' e' una sola: la password buona e' quella che apre la
             cassaforte. L'hash salvato non decide piu' niente, altrimenti dopo
             uno sblocco dell'assistenza le due cose si contraddicono e non
             entri piu' con nessuna delle due password. */
          const vault = loadVault();
          let dek;
          try { dek = await apriConPassword(vault, pw); }
          catch(e){ state.loginError = "ID o password errati."; state.loginPw = ""; render(); return; }
          await apriArchivio(dek);
          await setAuth(a.studioId || state.loginId || "studio", pw, null);  // riallinea l'hash
          if (vault.daRinnovare){                          // rientro con password provvisoria
            state.recoveryMode = true; state.recoveryReset = true;
            state.loginId = ""; state.loginPw = ""; state.loginError = null;
            render(); return;
          }
        } else {
          const ok = await checkCredentials(state.loginId, pw);
          if (!ok){ state.loginError = "ID o password errati."; state.loginPw = ""; render(); return; }
          // installazione precedente: creo ora la cassaforte e ricifro
          state.recoveryPhrase = await creaCassaforteEMigra(pw);
          state.setupPhase = "recovery"; state.recoverySaved = false; state.needsSetup = true;
          state.loginId = ""; state.loginPw = ""; state.loginError = null;
          render(); return;
        }
      } catch(e){
        console.error(e);
        state.loginError = "Password corretta ma l'archivio non si apre. Usa le 12 parole.";
        state.loginPw = ""; render(); return;
      }
      state.locked = false; state.loginId = ""; state.loginPw = ""; state.loginError = null;
      render();
    })();
    return;
  }
  // --- recupero: mostra la schermata per inserire il codice ---
  if (action === "show-recovery"){ state.recoveryMode = true; state.loginError = null; state.recoveryOk = null; state.recoveryInput = ""; render(); return; }
  if (action === "cancel-recovery"){ state.recoveryMode = false; state.recoveryReset = false; state.loginError = null; state.recoveryOk = null; render(); return; }

  if (action === "recovery-submit"){
    (async () => {
      const vault = loadVault();
      if (!vault){ state.loginError = "Su questo dispositivo non c'è nessuna cassaforte."; render(); return; }
      const frase = state.recoveryInput || "";
      if (!(await fraseValida(frase))){
        state.loginError = "Le parole non tornano: controlla l'ordine e che siano esattamente 12.";
        render(); return;
      }
      try {
        const dek = await apriConFrase(vault, frase);
        await apriArchivio(dek);
        state.recoveryReset = true; state.loginError = null; state.recoveryInput = "";
      } catch(e){
        state.loginError = "La frase è scritta bene ma non apre questo archivio.";
      }
      render();
    })();
    return;
  }

  if (action === "recovery-reset-pw"){
    const pw = state.recoveryNewPw||"", pw2 = state.recoveryNewPw2||"";
    if (pw.length < 4){ state.loginError = "La password deve avere almeno 4 caratteri."; render(); return; }
    if (pw !== pw2){ state.loginError = "Le due password non coincidono."; render(); return; }
    if (!DEK){ state.loginError = "Chiave non disponibile: rifai il recupero."; render(); return; }
    (async () => {
      const a = loadAuth() || {};
      const vault = loadVault();
      await rifaiBustaPassword(vault, DEK, pw);   // cambia la serratura, non ricifra l'archivio
      delete vault.daRinnovare;
      saveVault(vault);
      await setAuth(a.studioId || "studio", pw, null);
      state.recoveryMode = false; state.recoveryReset = false; state.locked = false;
      state.loginError = null; state.recoveryNewPw = ""; state.recoveryNewPw2 = "";
      render();
    })();
    return;
  }

  /* ---- scambio file con l'assistenza ---- */
  if (action === "ickey-export"){
    const vault = loadVault();
    if (!vault){ state.loginError = "Non c'è nessuna cassaforte da recuperare."; render(); return; }
    const a = loadAuth() || {};
    if (!confirm("Sto per creare il file di sblocco.\n\nContiene SOLO le serrature dell'archivio: nessun dato dei tuoi clienti.\nMandami solo questo file, nient'altro. Verrà cancellato entro 24 ore.\n\nProcedo?")) return;
    scaricaFile("recupero-" + (a.studioId || "studio") + ".ickey", JSON.stringify(vault, null, 2));
    state.recoveryOk = "File scaricato. Mandami solo questo: non serve altro, e altro non devi mandarmelo.";
    state.loginError = null; render(); return;
  }
  if (action === "ickey-import-pick"){ const i = qs("#ickey-file"); if (i) i.click(); return; }
  // --- ripristino da backup dalla schermata di login ---
  if (action === "login-restore-pick"){ const inp = qs("#login-restore-file"); if (inp) inp.click(); return; }

  if (action === "nav"){ state.view = btn.dataset.view; state.step = 1; state.showErrors = null; state.railOpen = false; state.studioSaved = false; state.authSaved = false; state.authError = null; state.backupMsg = null; render(); }
  else if (action === "new-session"){
    // prompt13, Task 4: prima uno schermo di scelta (renderConsensoEntryChoice),
    // non subito il passo 1 — draft nasce solo dopo aver scelto "Compila
    // qui" (action "consenso-qui") o "Invia il link" (action
    // "consenso-invia-link").
    draft = null; state.view = "form"; state.consensoEntryChoice = true; state.consensoWaitRemote = false;
    state.showErrors = null; state.pdfWarning = false; state.railOpen = false; render();
  }
  else if (action === "consenso-qui"){
    draft = blankSession(); state.consensoEntryChoice = false; state.step = 1;
    state.showErrors = null; state.pdfWarning = false; render();
  }
  else if (action === "consenso-invia-link"){
    const s = blankSession(); upsertSession(s);
    state.lastRemoteId = s.id; state.consensoEntryChoice = false; state.consensoWaitRemote = true;
    render();
  }
  else if (action === "consenso-wait-chiudi"){
    state.consensoWaitRemote = false; state.lastRemoteId = null; state.view = "archive"; render();
  }
  else if (action === "open-session"){ draft = getSession(btn.dataset.id); state.view = "form"; state.step = resumeStep(draft); state.showErrors = null; state.pdfWarning = false; state.railOpen = false; render(); }
  else if (action === "toggle-rail"){ state.railOpen = !state.railOpen; render(); }
  else if (action === "goto-step"){ upsertSession(draft); state.step = Number(btn.dataset.step); state.showErrors = null; render(); }
  else if (action === "next-step"){
    const errs = validateStep(state.step);
    if (errs.length){ state.showErrors = state.step; renderStepOnly(); return; }
    upsertSession(draft); state.step += 1; state.showErrors = null; render();
  }
  else if (action === "prev-step"){ state.step -= 1; state.showErrors = null; render(); }
  else if (action === "toggle-minorenne"){ draft.minorenne = !draft.minorenne; renderStepOnly(); }
  else if (action === "set-tipo"){ draft.tipoApplicazione = btn.dataset.v; renderStepOnly(); }
  else if (action === "toggle-informativa"){ draft.informativaLetta = !draft.informativaLetta; renderStepOnly(); }
  else if (action === "toggle-privacy"){ draft.privacyConsenso = !draft.privacyConsenso; renderStepOnly(); }
  else if (action === "toggle-disegno"){ draft.disegnoConfermato = !draft.disegnoConfermato; renderStepOnly(); }
  else if (action === "toggle-schedatecnica"){ draft.seduta.schedaTecnicaAllegata = !draft.seduta.schedaTecnicaAllegata; renderStepOnly(); }
  else if (action === "set-sanitario"){
    const q = btn.dataset.q;
    draft.sanitario[q] = btn.dataset.v;
    if (!HEALTH_QUESTIONS.some(x => draft.sanitario[x.id] === "si")) draft.sanitarioOverride = false;
    renderStepOnly();
  }
  else if (action === "sanitario-override"){ draft.sanitarioOverride = true; renderStepOnly(); }
  else if (action === "set-zonamode"){ draft.zonaMode = btn.dataset.v; renderStepOnly(); }
  else if (action === "set-genere-consenso"){ draft.genere = btn.dataset.g; draft.markers = []; draft.strokes = []; renderStepOnly(); }

  else if (action === "pick-reference"){ const inp = qs("#reference-file"); if (inp) inp.click(); }
  else if (action === "remove-reference"){ leadDraft.referenceImg = ""; renderLeadStepOnly(); }
  else if (action === "remove-logo"){
    state.studioBuffer = { ...(state.studioBuffer||{}), logoDataUrl: "" };
    render();
  }
  else if (action === "add-artista"){
    const arr = artistiArray(studioCfgLive());
    if (arr.length < 5){
      arr.push("");
      state.studioBuffer = { ...(state.studioBuffer||{}), artistsText: arr.join(", ") };
      render();
    }
  }
  else if (action === "remove-artista"){
    const arr = artistiArray(studioCfgLive());
    arr.splice(parseInt(btn.dataset.idx, 10), 1);
    state.studioBuffer = { ...(state.studioBuffer||{}), artistsText: arr.join(", ") };
    render();
  }
  else if (action === "do-export"){
    const pw = state.cifraBackup ? ((state.backupBuffer||{}).password || "").trim() : "";
    if (state.cifraBackup && !pw){ state.backupMsg = "Inserisci una password per il backup cifrato."; state.backupMsgType = "warn"; render(); return; }
    const msg = state.cifraBackup
      ? "BACKUP CIFRATO\n\nIl file sarà illeggibile senza la password che hai scelto. Custodiscila: se la perdi, questo backup NON è recuperabile in alcun modo. Procedere?"
      : "BACKUP IN CHIARO\n\nIl file conterrà i dati dei clienti leggibili da chiunque lo apra. Conservalo in un luogo sicuro (non su servizi condivisi). Procedere?";
    if (!confirm(msg)) return;
    exportBackup(pw).then(() => {
      state.backupMsg = state.cifraBackup ? "Backup cifrato esportato." : "Backup esportato (non cifrato).";
      state.backupMsgType = "ok"; state.backupBuffer = null; render();
    }).catch(err => { state.backupMsg = "Errore durante l'export: " + err.message; state.backupMsgType = "warn"; render(); });
  }
  else if (action === "do-import-pick"){
    const inp = qs("#import-file");
    if (inp) inp.click();
  }
  else if (action === "toggle-sel-tutti-mesi"){
    const tuttiMesi = raggruppaPerMese(loadSessions()).map(([ym]) => ym);
    state.exportConsensiMesi = (state.exportConsensiMesi||[]).length === tuttiMesi.length ? [] : tuttiMesi;
    render();
  }
  else if (action === "toggle-sel-mese"){
    const ym = btn.dataset.ym;
    const cur = state.exportConsensiMesi || [];
    state.exportConsensiMesi = cur.includes(ym) ? cur.filter(x => x !== ym) : [...cur, ym];
    render();
  }
  else if (action === "export-consensi-selettivo"){
    const pw = ((state.backupBuffer||{}).passwordConsensi || "").trim();
    exportConsensiSelettivo(state.exportConsensiMesi || [], pw).then(n => {
      state.importConsensiMsg = `Esportati ${n} consensi.`; state.importConsensiMsgType = "ok"; render();
    }).catch(err => { state.importConsensiMsg = "Errore durante l'export: " + err.message; state.importConsensiMsgType = "warn"; render(); });
  }
  else if (action === "do-import-consensi-pick"){
    const inp = qs("#import-consensi-file");
    if (inp) inp.click();
  }
  else if (action === "reset-studio"){
    localStorage.removeItem(STUDIO_STORE_KEY);
    applyStudioConfig();
    state.studioBuffer = null; state.studioSaved = false;
    render();
  }
  else if (action === "open-lead"){ leadDraft = getRichiesta(btn.dataset.id); state.view = "lead-detail"; state.railOpen = false; render(); }
  else if (action === "new-preventivo-studio"){
    leadDraft = blankRichiesta();
    leadDraft.creataInStudio = true;
    if (STUDIO_CONFIG.artists.length === 1) leadDraft.tatuatoreScelto = STUDIO_CONFIG.artists[0];
    else if (nomeTatuatoreAttivo()) leadDraft.tatuatoreScelto = nomeTatuatoreAttivo();
    state.leadStep = 1; state.leadShowErrors = null;
    state.view = "lead-new"; state.railOpen = false; render();
  }
  else if (action === "copy-lead-link"){
    navigator.clipboard.writeText(buildLeadLink()).then(() => {
      state.leadLinkCopied = true; render();
      setTimeout(() => { state.leadLinkCopied = false; render(); }, 2000);
    }).catch(() => { prompt("Copia il link:", buildLeadLink()); });
  }
  else if (action === "set-lead-status"){ leadDraft.status = btn.dataset.v; upsertRichiesta(leadDraft); render(); }
  else if (action === "save-lead"){ upsertRichiesta(leadDraft); render(); }
  else if (action === "lead-to-consenso"){
    const s = blankSession();
    s.anagrafica.nome = leadDraft.cliente.nome;
    s.anagrafica.cognome = leadDraft.cliente.cognome;
    s.anagrafica.nascita = leadDraft.cliente.nascita;
    s.anagrafica.telefono = leadDraft.cliente.telefono;
    s.anagrafica.email = leadDraft.cliente.email;
    // porta con sé la zona segnata sul preventivo: usa direttamente la sagoma
    if ((leadDraft.markers && leadDraft.markers.length) || (leadDraft.strokes && leadDraft.strokes.length)){
      s.zonaMode = "sagoma";
      s.genere = leadDraft.genere;
      s.zonaSegnaMode = leadDraft.zonaSegnaMode || "pin";
      s.markers = (leadDraft.markers||[]).map(m => ({...m}));
      s.strokes = (leadDraft.strokes||[]).map(st => ({ view: st.view, points: st.points.map(p=>({...p})) }));
    }
    if (leadDraft.dimensione) s.grandezza = leadDraft.dimensione;
    s.origineRichiestaId = leadDraft.id; // per la statistica "preventivi convertiti"
    upsertSession(s);
    leadDraft.status = "chiusa"; leadDraft.convertito = true; upsertRichiesta(leadDraft);
    draft = s; state.view = "form"; state.step = 1; state.showErrors = null;
    render();
  }
  // --- richiesta preventivo (client-facing lead intake) ---
  else if (action === "set-lead-tatuatore"){
    const nome = btn.dataset.nome;
    leadDraft.tatuatoreScelto = leadDraft.tatuatoreScelto === nome ? "" : nome;
    leadDraft.tatuatoreSceltoId = ""; // tocco manuale: l'id precompilato dal link (se c'era) non è più affidabile
    renderLeadStepOnly();
  }
  else if (action === "toggle-stile"){
    const st = btn.dataset.s;
    leadDraft.stile = leadDraft.stile.includes(st) ? leadDraft.stile.filter(x => x !== st) : [...leadDraft.stile, st];
    renderLeadStepOnly();
  }
  else if (action === "set-dimensione"){ leadDraft.dimensione = btn.dataset.d; renderLeadStepOnly(); }
  else if (action === "set-genere"){ leadDraft.genere = btn.dataset.g; leadDraft.markers = []; leadDraft.strokes = []; renderLeadStepOnly(); }
  else if (action === "set-segnamode"){ leadDraft.zonaSegnaMode = btn.dataset.m; renderLeadStepOnly(); }
  else if (action === "clear-sagoma"){ leadDraft.markers = []; leadDraft.strokes = []; renderLeadStepOnly(); }
  else if (action === "mark-body"){
    const rect = btn.getBoundingClientRect();
    const xPct = Math.max(2, Math.min(98, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(2, Math.min(98, ((e.clientY - rect.top) / rect.height) * 100));
    leadDraft.markers.push({ view: btn.dataset.view, xPct, yPct });
    renderLeadStepOnly();
  }
  else if (action === "remove-pin"){ leadDraft.markers.splice(Number(btn.dataset.i), 1); renderLeadStepOnly(); }
  else if (action === "lead-next"){
    const errs = validateLeadStep(state.leadStep);
    if (errs.length){ state.leadShowErrors = state.leadStep; renderLeadStepOnly(); return; }
    state.leadStep += 1; state.leadShowErrors = null; render();
  }
  else if (action === "lead-prev"){ state.leadStep -= 1; state.leadShowErrors = null; render(); }
  else if (action === "lead-submit"){
    const errs = validateLeadStep(3);
    if (errs.length){ state.leadStep = 3; state.leadShowErrors = 3; render(); return; }
    upsertRichiesta(leadDraft);
    if (leadDraft.creataInStudio){
      // già in studio: nessun bisogno di notifiche a te stesso, si apre
      // subito il dettaglio per aggiungere caparra/note se serve.
      state.view = "lead-detail"; render();
    } else {
      notifyNewRichiesta(leadDraft);
      // niente await qui: la conferma appare subito, offline-first come
      // sempre (vedi commento sopra inviaRichiestaSupabase) — se l'invio
      // fallisce davvero lo si scopre un attimo dopo e si aggiorna la
      // stessa schermata con un avviso (prompt12, Task A), non si
      // blocca l'utente in attesa della rete per vederla.
      state.leadDone = true; state.leadSyncFailed = false; render();
      inviaRichiestaSupabase(leadDraft).then(ok => {
        if (ok === false){ state.leadSyncFailed = true; render(); }
      });
    }
  }
});
