  return Array.isArray(data) ? data[0] : data;
}

/* Verifica REALE della conferma email (prompt9, Task 1) — non più un
   bottone che si limita a fidarsi. Dopo il click sul link nella mail,
   Supabase Auth reindirizza qui con access_token/refresh_token nel
   frammento dell'URL (#...): quei token li emette SOLO Supabase, SOLO
   dopo una conferma reale, quindi la loro sola presenza è già la prova
   — nessuna autocertificazione dell'utente. Verifica anche chi è
   l'utente (GET /auth/v1/user col token) prima di fidarsi. */
async function supabaseGetUser(accessToken){
  const res = await fetch(supabaseAuthUrl("user"), {
    headers: { "apikey": SUPABASE_CONFIG.anonKey, "Authorization": `Bearer ${accessToken}` },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || "Errore imprevisto.");
  return data;
}
async function completaSessioneDaRedirect(){
  if (!location.hash || location.hash.length < 2) return false;
  const hp = new URLSearchParams(location.hash.slice(1));
  const accessToken = hp.get("access_token");
  const refreshToken = hp.get("refresh_token");
  const expiresIn = hp.get("expires_in");
  if (!accessToken) return false;
  try {
    const user = await supabaseGetUser(accessToken);
    if (!user || !user.id) return false;
    saveStudioAccount({
      userId: user.id,
      email: user.email,
      access_token: accessToken,
      refresh_token: refreshToken || null,
      expires_at: Date.now() + ((Number(expiresIn) || 3600) * 1000),
    });
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  } catch(e){ console.warn("Verifica sessione da redirect fallita:", e); return false; }
}

/* Recupera nome studio/città/titolare già salvati su Supabase per
   QUESTO studio — usata quando un dispositivo NUOVO fa login/redirect
   su uno studio che ha già completato l'onboarding altrove: evita di
   richiederli di nuovo, e soprattutto evita che nasca un secondo
   profilo tatuatore con un nome diverso per la stessa persona
   (prompt9, "secondo dispositivo"). Applica i dati in locale SOLO se
   questo dispositivo non li ha già (non sovrascrive scelte fatte qui). */
async function sincronizzaDatiStudioDaRemoto(){
  if (!SUPABASE_CONFIG.url) return { completato: false };
  const token = await validStudioAccessToken();
  if (!token) return { completato: false };
  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/rpc/dati_studio`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_CONFIG.anonKey, "Authorization": `Bearer ${token}` },
      body: "{}",
    });
    if (!res.ok) return { completato: false };
    const rows = await res.json();
    const r = Array.isArray(rows) ? rows[0] : rows;
    if (!r || !r.nome_titolare) return { completato: false };
    const o = loadStudioOverrides();
    const patch = {};
    if (r.nome && !o.studioName) patch.studioName = r.nome;
    if (r.citta && !o.studioCity) patch.studioCity = r.citta;
    if (r.nome_titolare && !(o.artistsText||"").trim()) patch.artistsText = r.nome_titolare;
    if (Object.keys(patch).length){ saveStudioOverrides({ ...o, ...patch }); applyStudioConfig(); }
    return { completato: true, nomeTitolare: r.nome_titolare };
  } catch(e){ console.warn("Sincronizzazione dati studio fallita:", e); return { completato: false }; }
}

function accountFromAuthResponse(data){
  return {
    userId: data.user && data.user.id,
    email: data.user && data.user.email,
    access_token: data.access_token || null,
    refresh_token: data.refresh_token || null,
    expires_at: data.access_token ? Date.now() + ((data.expires_in || 3600) * 1000) : null,
  };
}
/* Token valido per chiamare le funzioni "autenticate" (registra_dispositivo_autenticato
   e affini): lo rinfresca da solo se scaduto. Torna null se non c'è un
   account studio o se la sessione non è più recuperabile (in quel caso
   l'app resta comunque usabile in locale: qui non si blocca mai nulla
   per un problema di rete). */
async function validStudioAccessToken(){
  const acc = loadStudioAccount();
  if (!acc || !acc.userId) return null;
  if (acc.access_token && acc.expires_at && Date.now() < acc.expires_at - 30000) return acc.access_token;
  if (!acc.refresh_token) return acc.access_token || null;
  try {
    const fresh = await supabaseRefreshSession(acc.refresh_token);
    const updated = { ...acc, ...accountFromAuthResponse(fresh) };
    saveStudioAccount(updated);
    return updated.access_token;
  } catch(e){ console.warn("Rinnovo sessione account studio fallito:", e); return null; }
}

/* Registra (o rinnova) il dispositivo corrente per lo studio autenticato
   e applica il limite di 2. No-op innocuo se Supabase non è configurato
   o lo studio è ancora sul percorso anonimo legacy: in quei casi l'app
   resta usabile senza alcun limite, come sempre finora. */
/* Con un solo tatuatore dichiarato, registra il dispositivo per lo
   STUDIO (comportamento invariato da prima di questo giro: nessuna
   schermata di scelta, vedi serveSceltaTatuatore). Con più di un
   tatuatore, registra per il TATUATORE ATTIVO (limite 2 dispositivi
   ciascuno, non più 2 per l'intero studio) — chiamata di nuovo dopo
   ogni cambio di tatuatore, vedi renderTatuatoreSwitch. */
async function registraDispositivoCorrente(){
  if (!SUPABASE_CONFIG.url) return { consentito: true };
  const token = await validStudioAccessToken();
  if (!token) return { consentito: true };
  const { deviceId } = licenseIds();
  const nomeDispositivo = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "Dispositivo";
  const t = tatuatoreAttivo();
  const fn = t ? "registra_dispositivo_per_tatuatore" : "registra_dispositivo_autenticato";
  const body = t
    ? { p_device_id: deviceId, p_tatuatore_id: t.supabaseId, p_nome_dispositivo: nomeDispositivo }
    : { p_device_id: deviceId, p_nome_dispositivo: nomeDispositivo };
  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_CONFIG.anonKey,
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) return { consentito: true }; // errore lato server: non blocchiamo l'uso offline per questo
    const rows = await res.json();
    return (Array.isArray(rows) ? rows[0] : rows) || { consentito: true };
  } catch(e){ console.warn("Registrazione dispositivo fallita, resto usabile offline:", e); return { consentito: true }; }
}
async function elencoDispositiviStudio(){

}

/* ============================================================
   TATUATORI — profilo locale per singolo tatuatore, dentro
   l'account studio (prompt6, Task 1). Username+password restano
   SEMPRE e SOLO locali (stesso hash+salt già usato per AUTH_KEY,
   vedi randomSalt()/sha256() più sopra): su Supabase va SOLO un
   ID opaco per tatuatore (supabaseId), collegato allo studio_id,
   usato per contare quanti tatuatori/dispositivi occupa lo
   studio contro il tetto del piano — mai nome, mai credenziali.
   Il profilo serve ad attribuire consensi/preventivi/appuntamenti
   al tatuatore attivo (Task 5/7/10) e a contare 2 dispositivi per
   TATUATORE invece che per studio (Task 5). Con un solo tatuatore
   dichiarato in Impostazioni, tutto questo resta invisibile:
   nessuna schermata di scelta, comportamento invariato rispetto
   a prima di questo giro. */
const TATUATORI_KEY = "inkconsent_tatuatori_v1";
BIG_STORES.push(TATUATORI_KEY);
function loadTatuatori(){ return readStore(TATUATORI_KEY, []); }
function saveTatuatori(list){ writeStore(TATUATORI_KEY, list); }
function getTatuatoreProfilo(id){ return loadTatuatori().find(t => t.id === id) || null; }
/* isTitolare: true SOLO per il profilo creato durante l'onboarding
   (trial-start) — usato per dare sempre accesso pieno alle richieste
   preventivo indipendentemente da chi sono indirizzate (prompt11,
   Task 2), coerente col resto dell'app dove il titolare vede/gestisce
   sempre tutto (agenda condivisa, contabilità...). */
function blankTatuatoreProfilo(nome, isTitolare){
  return { id: uuidv4(), nome, username: "", salt: "", hash: "", supabaseId: uuidv4(), isTitolare: !!isTitolare, abilitato: !!isTitolare, createdAt: new Date().toISOString() };
}
/* Crea (o ritrova) un profilo per ogni nome già dichiarato in
   Impostazioni -> "Artisti": esiste subito per poter contare/attribuire,
   ma senza credenziali finché il tatuatore non le imposta lui la prima
   volta che sceglie il proprio nome (vedi renderTatuatoreSwitch). Se un
   nome viene tolto da "Artisti", il profilo resta (storico attribuzioni
   passate) ma non compare più nella scelta. */
function assicuraProfiliTatuatori(){
  const nomi = STUDIO_CONFIG.artists || [];
  const list = loadTatuatori();
  let changed = false;
  nomi.forEach((nome, i) => {
    if (!list.some(t => t.nome === nome)){ list.push(blankTatuatoreProfilo(nome, i === 0)); changed = true; }
  });
  if (changed) saveTatuatori(list);
  return list.filter(t => nomi.includes(t.nome));
}
/* CORREZIONE (prompt12, Task B): scrivere un nome in "Artisti" creava
   subito un profilo che veniva CONTATO come tatuatore vero (faceva
   scattare "chi sta lavorando ora?" anche in Trial/SoloPro, dove il
   piano vero ammette solo il titolare) — indipendentemente dal fatto
   che registra_tatuatore() lato server lo avesse davvero accettato
   sotto il tetto del piano attivo. Un profilo conta ora solo se:
   è il titolare (nasce già abilitato, vedi avvia_trial), oppure ha
   già delle credenziali impostate (t.hash — prova che in passato è
   stato scelto e usato davvero: mantiene lo stato per i profili creati
   prima di questo giro, nessuna migrazione manuale da fare), oppure ha
   ricevuto risposta positiva da registra_tatuatore (t.abilitato, vedi
   action "save-studio"). Un nome scritto ma non ancora abilitato resta
   nel profilo locale (si vede in Impostazioni -> Tatuatori) ma non
   compare nello switch né conta ai fini di accessoPienoRichieste. */
function tatuatoreAbilitato(t){ return !!(t && (t.abilitato || t.isTitolare || t.hash)); }
async function setCredenzialiTatuatore(id, username, password){
  const list = loadTatuatori();
  const i = list.findIndex(t => t.id === id);
  if (i < 0) return false;
  const salt = randomSalt();
  const hash = await sha256(salt + ":" + password);
  list[i] = { ...list[i], username: (username||"").trim(), salt, hash };
  saveTatuatori(list);
  return true;
}
async function verificaCredenzialiTatuatore(id, password){
  const t = getTatuatoreProfilo(id);
  if (!t || !t.hash) return false;
  const hash = await sha256((t.salt||"") + ":" + password);
  return hash === t.hash;
}
function rimuoviProfiloTatuatoreLocale(id){
  saveTatuatori(loadTatuatori().filter(t => t.id !== id));
  if (ACTIVE_TATUATORE === id) ACTIVE_TATUATORE = null;
}

/* Chi sta lavorando ora su questo dispositivo condiviso: solo in
   memoria (come DEK), sparisce a ogni blocco/sblocco — un dispositivo
   condiviso ripropone la scelta a ogni turno di lavoro. */
let ACTIVE_TATUATORE = null;
function tatuatoreAttivo(){ return ACTIVE_TATUATORE ? getTatuatoreProfilo(ACTIVE_TATUATORE) : null; }
function nomeTatuatoreAttivo(){ const t = tatuatoreAttivo(); return t ? t.nome : (STUDIO_CONFIG.artists[0] || ""); }
/* true se serve mostrare la schermata di scelta/switch: più di un
   tatuatore dichiarato e nessuno ancora attivo in questa sessione. */
function serveSceltaTatuatore(){
  return assicuraProfiliTatuatori().filter(tatuatoreAbilitato).length > 1 && !ACTIVE_TATUATORE;
}
/* Accesso pieno alle richieste preventivo (prompt11, Task 2): sempre
   vero per il titolare, e sempre vero anche con un solo tatuatore
   (SoloPro/trial — "un solo tatuatore = sempre lui", comportamento
   invariato). Con più tatuatori, vero solo per il profilo marcato
   isTitolare — non per gli altri, che vedono tutto ma agiscono solo
   sulle richieste indirizzate a loro (vedi puoAprireRichiesta). */
function accessoPienoRichieste(){
  if (assicuraProfiliTatuatori().filter(tatuatoreAbilitato).length <= 1) return true;
  const t = tatuatoreAttivo();
  return !!(t && t.isTitolare);
}
/* Una richiesta senza tatuatore scelto dal cliente resta aperta a
   chiunque la prenda in carico (nessuna preferenza espressa). */
function puoAprireRichiesta(r){
  if (accessoPienoRichieste()) return true;
  if (!r.tatuatoreScelto) return true;
  return r.tatuatoreScelto === nomeTatuatoreAttivo();
}

/* Registra (o rinnova) il tatuatore attivo su Supabase — conteggio
   contro il tetto del piano, mai un blocco locale: no-op innocuo se
   Supabase non è configurato, lo studio è ancora anonimo, o la rete
   non risponde. */
async function registraTatuatoreCorrente(t){
  if (!SUPABASE_CONFIG.url || !t) return { consentito: true };
  const token = await validStudioAccessToken();
  if (!token) return { consentito: true };
  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/rpc/registra_tatuatore`, {

const SUBSCRIPTION_KEY = "inkconsent_subscription_active_v1";
function subscriptionActive(){ try { return localStorage.getItem(SUBSCRIPTION_KEY) === "1"; } catch(e){ return false; } }
function setSubscriptionActive(v){ if (v) localStorage.setItem(SUBSCRIPTION_KEY, "1"); else localStorage.removeItem(SUBSCRIPTION_KEY); }

/* Un consenso "conta" quando viene davvero archiviato (firmato dal
   cliente e controfirmato dal tatuatore) — le bozze non consumano la
   soglia gratuita. E' lo stesso momento in cui si assegna il progressivo
   di registro (assignProgressivo), quindi non serve un contatore separato
   da tenere sincronizzato: si ricava sempre dall'archivio vero. */
function consensiArchiviatiCount(){
  return loadSessions().filter(s => s.status === "archiviato").length;
}
/* Ultimo conteggio aggregato per studio (tutti i dispositivi) visto da
   Supabase — la funzione SQL register_consenso_firmato/get_stato_licenza
   somma già consensi_firmati su TUTTI i dispositivi dello studio, ma
   prima di questo giro il client usava SOLO il conteggio locale per
   decidere se bloccare: uno studio con più dispositivi poteva quindi
   archiviarne 10 su ognuno prima che il gate scattasse davvero da
   qualche parte (prompt6, Task 5). Cache locale, aggiornata a ogni
   risposta server valida (syncLicenseOnFinalize/refreshLicenseFromSupabase),
   usata come minimo garantito: mai usata per ABBASSARE il conteggio
   locale (offline-first, non deve mai sbloccare qualcosa che il
   dispositivo non ha ancora sincronizzato), solo per alzarlo quando il
   server ne sa di più. */
const SERVER_LICENSE_CACHE_KEY = "inkconsent_server_license_cache_v1";
function loadServerLicenseCache(){ try { return JSON.parse(localStorage.getItem(SERVER_LICENSE_CACHE_KEY)); } catch(e){ return null; } }
function saveServerLicenseCache(r){
  if (!r || typeof r.count_totale !== "number") return;
  try { localStorage.setItem(SERVER_LICENSE_CACHE_KEY, JSON.stringify({ count_totale: r.count_totale, fetchedAt: Date.now() })); } catch(e){}
}
function licenseState(){
  const localCount = consensiArchiviatiCount();
  const cache = loadServerLicenseCache();
  const count = cache ? Math.max(localCount, cache.count_totale) : localCount;
  const limit = FREE_CONSENSI_LIMIT;
  return {
    count, limit,
    remaining: Math.max(0, limit - count),
    // il piano a pagamento non blocca MAI, qualunque sia il conteggio
    // (prompt6, Task 5): il limite dei consensi gratuiti vale solo
    // durante il trial.
    subscriptionActive: subscriptionActive(),
    blocked: !subscriptionActive() && count >= limit,
  };
}

/* Riscontro server-side (no-op se Supabase non configurato O se lo
   studio non ha un account autenticato — vedi prompt7.md/
   supabase-consolidamento-licenza.sql: da questo giro register_
   consenso_firmato/get_stato_licenza richiedono una sessione vera,
   auth.uid() è l'UNICA fonte di verità per lo studio_id, non più un id
   passato dal client. Uno studio senza account funziona come uno
   studio senza Supabase configurato: gate solo locale, nessuna sync —
   coerente con l'offline-first, mai un blocco per questo). Registra il
   consenso appena archiviato tramite la funzione SQL register_consenso_
   firmato, che fa da gate "vero" lato database e restituisce lo stato
   reale dell'abbonamento. Non blocca mai l'archiviazione locale, gia'
   avvenuta: aggiorna solo lo stato abbonamento per la prossima volta. */
async function syncLicenseOnFinalize(){
  if (!SUPABASE_CONFIG.url) return;
  const token = await validStudioAccessToken();
  if (!token) return;
  const { deviceId } = licenseIds();
  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/rpc/register_consenso_firmato`, {
      method: "POST",

        "Content-Type": "application/json",
        "apikey": SUPABASE_CONFIG.anonKey,
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({ p_device_id: deviceId }),
    });
    if (!res.ok) return;
    const rows = await res.json();
    const r = Array.isArray(rows) ? rows[0] : rows;
    if (r && typeof r.abbonamento_attivo === "boolean") setSubscriptionActive(r.abbonamento_attivo);
    saveServerLicenseCache(r);
  } catch(e){ console.warn("Sync licenza fallita, resta valido il conteggio locale:", e); }
}

  } catch(e){
    console.warn("Invio richiesta a Supabase fallito, resta comunque salvata in locale sul telefono del cliente:", e);

/* Lato studio: "realtime" pragmatico via polling REST invece del vero
   Supabase Realtime (WebSocket/Phoenix — richiederebbe supabase-js o
   un client scritto a mano, vedi la nota nel file SQL). Ogni ~20s,
   mentre l'app studio è aperta, controlla se sono arrivate richieste
   nuove e le fonde in locale (dedup per id, additivo come l'import
   selettivo del Task 6) — stesso risultato pratico del realtime vero:
   arrivano senza dover ricaricare la pagina. */
let richiestePollingTimer = null;
let richiesteBannerTimer = null;
async function pollRichiesteSupabase(){
  if (!SUPABASE_CONFIG.url) return;
  const token = await validStudioAccessToken();
  if (!token) return;
  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/richieste?select=id,payload,creato_il&order=creato_il.desc&limit=50`, {
      headers: { "apikey": SUPABASE_CONFIG.anonKey, "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) return;
    const rows = await res.json();
    const esistenti = new Set(loadRichieste().map(r => r.id));
    const nuove = rows.filter(row => row.id && row.payload && !esistenti.has(row.id)).map(row => ({ ...row.payload, id: row.id }));
    if (nuove.length){
      saveRichieste([...nuove, ...loadRichieste()]);
      state.nuoveRichiesteBanner = [...(state.nuoveRichiesteBanner||[]), ...nuove];
      render();
      // prompt13, Task 1: il toast sparisce da solo se non interagito —
      // il badge sul menu (derivato da loadRichieste() per status, non
      // da questo stato) resta comunque aggiornato indipendentemente.
      // Un nuovo giro di polling durante l'attesa riparte da capo invece
      // di sommarsi a un timer già in corsa.
      clearTimeout(richiesteBannerTimer);
      richiesteBannerTimer = setTimeout(() => { state.nuoveRichiesteBanner = []; render(); }, 8000);
    }
  } catch(e){ console.warn("Controllo nuove richieste fallito:", e); }
}
function avviaPollingRichieste(){
  if (richiestePollingTimer || !SUPABASE_CONFIG.url) return;
  pollRichiesteSupabase();
  richiestePollingTimer = setInterval(pollRichiesteSupabase, 20000);
}

/* ============================================================
   PACCHETTI ICONE MAGAZZINO (prompt8ui, Task 1-3) — le icone
   categoria (cat-guanti, cat-disinfettante, ecc.) vivono in
   assets/icon-packs/<nome-pacchetto>/, un pacchetto per sottocartella,
   stessi nomi file in ognuno. L'elenco dei pacchetti disponibili viene
   letto da assets/icon-packs/manifest.json, MAI hardcoded: aggiungere
   un pacchetto in futuro significa solo creare la cartella (stessi
   nomi cat-*.png o .svg) e aggiungere una riga al manifest — zero
   modifiche qui. Ogni pacchetto può dichiarare un "format" preferito
   (png o svg); senza indicazione, o se il file in quel formato non
   c'è, il fallback automatico prova l'altro formato (vedi
   catIconOnerror). */
const ICON_PACKS_BASE = "assets/icon-packs";
let ICON_PACK_LIST = [{ name: "default", format: "png" }]; // rimpiazzato al boot da caricaPacchettiIcone()
async function caricaPacchettiIcone(){
  try {
    const r = await fetch(`${ICON_PACKS_BASE}/manifest.json`, { cache: "no-cache" });
    if (!r.ok) return;
    const j = await r.json();
    if (Array.isArray(j.packs) && j.packs.length){
      ICON_PACK_LIST = j.packs.map(p => typeof p === "string" ? { name: p } : { name: p.name, format: p.format });
    }
  } catch(e){ /* resta il pacchetto di base già incorporato */ }
}
function pacchettoIconeScelto(){ return loadStudioOverrides().iconPack || "default"; }
function setPacchettoIcone(nome){
  const o = loadStudioOverrides();
  saveStudioOverrides({ ...o, iconPack: nome });
}
function pacchettoIconeAttivo(){
  return ICON_PACK_LIST.find(p => p.name === pacchettoIconeScelto()) || ICON_PACK_LIST[0] || { name: "default" };
}
function catIconUrl(iconSlug, extForzata){
  const pack = pacchettoIconeAttivo();
  const ext = extForzata || pack.format || "png";
  return `${ICON_PACKS_BASE}/${pack.name}/cat-${iconSlug}.${ext}`;
}
/* Attributo onerror da mettere su ogni <img> di icona categoria: se
   l'estensione provata non esiste nel pacchetto, tenta l'altra
   (png<->svg) una volta sola — this.onerror=null evita loop se manca
   anche quella. */
function catIconOnerrorAttr(iconSlug){
  const pack = pacchettoIconeAttivo();
  const primaExt = pack.format || "png";
  const altExt = primaExt === "svg" ? "png" : "svg";
  return `this.onerror=null;this.src='${catIconUrl(iconSlug, altExt)}';`;
}

  const list = loadForniture();

  if (i >= 0) list[i] = item; else list.unshift(item);
  saveForniture(list); return item;
}

/* movimento: delta (+ carico, - scarico), prezzo totale opzionale (solo carichi) */
function addMovimento(id, delta, prezzo){
  const list = loadForniture();
  const it = list.find(x => x.id === id);
  if (!it) return;
  it.quantita = Math.max(0, (it.quantita||0) + delta);
  it.movimenti = it.movimenti || [];
  it.movimenti.push({ at: new Date().toISOString(), delta, prezzo: prezzo||0 });
  saveForniture(list);
  return it;
}
/* stato scorta in base a quantità vs soglia riordino */
function statoScorta(it){
  const q = it.quantita||0, s = it.soglia||0;
  if (q <= 0) return { key:"esaurito", label:"Esaurito", cls:"stk-out" };
  if (q <= s) return { key:"bassa", label:"Riordina", cls:"stk-low" };
  if (s > 0 && q <= s*2) return { key:"buono", label:"In riserva", cls:"stk-ok" };
  return { key:"ottimo", label:"Coperto", cls:"stk-top" };
}
/* spesa in un dato mese (YYYY-MM) sommando i carichi con prezzo */
function spesaMese(ym){
  let tot = 0;
  loadForniture().forEach(it => (it.movimenti||[]).forEach(m => {
    if (m.prezzo > 0 && m.at.slice(0,7) === ym) tot += m.prezzo;
  }));
  return tot;
}
/* scadenza: true se manca meno di 30 giorni o è già passata */
function isExpiringSoon(dateStr){
  if (!dateStr) return false;
  const d = new Date(dateStr), now = new Date();
  return (d - now) / 86400000 < 30;
}
function isExpired(dateStr){
  if (!dateStr) return false;
  return new Date(dateStr) < new Date();
}

/* lunedì-domenica della settimana che contiene dataISO */
function settimanaDi(dataISO){
  const d = new Date(dataISO + "T00:00:00");
  const dow = (d.getDay() + 6) % 7; // lunedì = 0
  const monday = new Date(d); monday.setDate(d.getDate() - dow);
  return Array.from({length:7}, (_,i) => { const x = new Date(monday); x.setDate(monday.getDate()+i); return x.toISOString().slice(0,10); });
}
function addGiorni(dataISO, n){
  const d = new Date(dataISO + "T00:00:00"); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
/* Stesso giorno del mese ±n mesi; se il mese di arrivo è più corto (es.
   31 gennaio +1 mese) JS riporta al 1° marzo — normale comportamento
   Date, qui va bene: la vista mese sotto la testa comunque a inizio
   mese, non a un giorno specifico. */
function addMesi(dataISO, n){
  const d = new Date(dataISO + "T00:00:00"); d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}

/* Compenso per artista (prompt6, Task 10) — sostituisce la vecchia
   percentuale fissa sulla sola caparra: due modalità alternative,
   configurate dal titolare in Contabilità (nessuna self-service per il
   singolo tatuatore — l'app non ha un sistema di permessi separato,
   quindi "solo il titolare la cambia" è già garantito dal fatto che
   Impostazioni/Contabilità è un'unica area condivisa, non una vista
   per-tatuatore):
     - 'percentuale': applicata al TOTALE del lavoro chiuso (caparra +
       saldo, non più solo alla caparra come prima di questo giro)
     - 'fisso': una quota mensile fissa, accreditata UNA volta per mese
       indipendentemente da quanti lavori chiude quel tatuatore — tutto
       l'incasso dei suoi lavori resta comunque allo studio.
   Vive negli stessi overrides dello studio (localStorage), come mappa
   nome -> config. Il vecchio formato (numero 0-100) resta letto per
   compatibilità con chi lo aveva già impostato prima di questo giro. */
function compensiArtisti(){ return loadStudioOverrides().compensi || {}; }
function compensoArtista(nome){
  const c = compensiArtisti()[nome];
  if (typeof c === "number") return { modalita: "percentuale", percentuale: c, quotaFissa: 0 };
  if (c && typeof c === "object") return { modalita: c.modalita === "fisso" ? "fisso" : "percentuale", percentuale: c.percentuale ?? 50, quotaFissa: c.quotaFissa || 0 };
  return { modalita: "percentuale", percentuale: 50, quotaFissa: 0 };
}
function setCompensoArtista(nome, cfg){
  const o = loadStudioOverrides();
  const compensi = { ...(o.compensi||{}), [nome]: {
    modalita: cfg.modalita === "fisso" ? "fisso" : "percentuale",
    percentuale: Math.max(0, Math.min(100, Number(cfg.percentuale)||0)),
    quotaFissa: Math.max(0, Number(cfg.quotaFissa)||0),
  } };
  saveStudioOverrides({ ...o, compensi });
}
/* Solo per piano SoloPro (un tatuatore, magari ospite in studio
   altrui): percentuale che versa al titolare che lo ospita. Campo
   unico (non per-artista: con un solo tatuatore non serve una mappa),
   vuoto di default = nessuna trattenuta (lo studio è suo). */
function percentualeVersoTitolareOspitante(){ const v = loadStudioOverrides().percVersoTitolare; return (v === "" || v == null) ? "" : v; }
function setPercentualeVersoTitolareOspitante(v){

  saveStudioOverrides({ ...o, percVersoTitolare: (v === "" || v == null) ? "" : Math.max(0, Math.min(100, Number(v)||0)) });
}
/* Lavori CHIUSI nel mese (YYYY-MM, per data dell'appuntamento): il
   conteggio compensi parte SOLO da qui, non più da ogni caparra
   incassata su una richiesta — quella poteva non corrispondere a un
   lavoro davvero concluso (prompt6, Task 10: "si conferma quando
   l'appuntamento in agenda viene chiuso"). Senza artista assegnato
   resta "non attribuito": conta per intero allo studio, non spartito
   a caso — stesso principio di prima di questo giro. */
function lavoriChiusiNelMese(ym){
  return loadAppuntamenti().filter(a => a.chiuso && (a.data||"").slice(0,7) === ym);
}
function chiusuraPeriodica(ym){
  const lavori = lavoriChiusiNelMese(ym);
  const totaleLavoro = a => (Number(a.caparraVersata)||0) + (Number(a.saldoFinale)||0);
  const entrateCaparre = lavori.reduce((s,a) => s + totaleLavoro(a), 0);
  const movimenti = loadMovimenti().filter(m => (m.data||"").slice(0,7) === ym);
  const entrateManuali = movimenti.filter(m => m.tipo === "entrata").reduce((s,m) => s + (Number(m.importo)||0), 0);
  const usciteManuali = movimenti.filter(m => m.tipo === "uscita").reduce((s,m) => s + (Number(m.importo)||0), 0);
  const speseMateriali = spesaMese(ym);
  const entrateTotali = entrateCaparre + entrateManuali;
  const usciteTotali = usciteManuali + speseMateriali;
  const perArtista = {};
  const fissoGiaContato = new Set();
  lavori.forEach(a => {
    if (!a.artista) return;
    const totale = totaleLavoro(a);
    const cfg = compensoArtista(a.artista);
    if (cfg.modalita === "fisso"){
      perArtista["__studio__" + a.artista] = (perArtista["__studio__" + a.artista]||0) + totale;
      if (!fissoGiaContato.has(a.artista)){
        perArtista[a.artista] = (perArtista[a.artista]||0) + cfg.quotaFissa;
        fissoGiaContato.add(a.artista);
      }
    } else {
      const pct = cfg.percentuale / 100;
      perArtista[a.artista] = (perArtista[a.artista]||0) + totale * pct;
      perArtista["__studio__" + a.artista] = (perArtista["__studio__" + a.artista]||0) + totale * (1 - pct);
    }
  });
  const nonAttribuito = lavori.filter(a => !a.artista).reduce((s,a) => s + totaleLavoro(a), 0);
  return { ym, entrateCaparre, entrateManuali, usciteManuali, speseMateriali, entrateTotali, usciteTotali,
    netto: entrateTotali - usciteTotali, perArtista, nonAttribuito, movimenti, lavori };
}

/* ============================================================
   AUTH — blocco accesso con codice, per proteggere i dati se il
   dispositivo viene perso. Il codice è salvato come hash SHA-256
   (non in chiaro). Questo blocca l'accesso all'interfaccia; per
   rendere i DATI illeggibili serve il backup cifrato (sotto).
   ============================================================ */
const AUTH_KEY = "inkconsent_auth_v1";   // { studioId, salt, hash }
const VAULT_KEY = "inkconsent_vault_v1"; // le tre buste: password, frase, assistenza

/* La chiave che cifra l'archivio. Vive solo in memoria: chiudi l'app
   e sparisce. Finche' e' null l'archivio resta in chiaro (installazioni
   vecchie, prima della migrazione). */
let DEK = null;

function loadVault(){ try { return JSON.parse(localStorage.getItem(VAULT_KEY)); } catch(e){ return null; } }
function saveVault(v){ localStorage.setItem(VAULT_KEY, JSON.stringify(v)); }
function vaultEsiste(){ const v = loadVault(); return !!(v && v.bustaPw); }

/* Carica l'archivio da IndexedDB usando la chiave appena ottenuta.
   Se la cassaforte non c'era ancora (utente della versione precedente)
   la crea adesso, ricifra quello che c'e' e restituisce la frase da
   mostrare una volta sola. */
async function apriArchivio(dek){
  DEK = dek || null;
  try { await hydrateStores(); } catch(e){ console.warn("Archivio non caricato:", e); }
}
async function creaCassaforteEMigra(password){
  await apriArchivio(null);                 // prima leggo quello che c'e' in chiaro
  const r = await creaCassaforte(password, SUPPORT_PUBLIC_KEY || null);
  saveVault(r.vault);
  DEK = r.dek;
  BIG_STORES.forEach(k => { if (_mem[k] !== undefined) writeStore(k, _mem[k]); });  // riscrive cifrato
  flushStores();
  return r.frase;
}

/* ---- scambio file con l'assistenza ---- */
function scaricaFile(nome, testo, tipo){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([testo], { type: tipo || "application/json" }));
  a.download = nome;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function leggiFileTesto(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ""));
    r.onerror = () => rej(new Error("File illeggibile."));
    r.readAsText(file);
  });
}
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function randomSalt(){
  return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2,"0")).join("");
}
function loadAuth(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e){ return null; } }
/* Genera un codice di recupero leggibile tipo INK-7K2P-9QX4-M3F8 */
function generateRecoveryCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // niente 0/O/1/I ambigui
  const grp = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
  return `INK-${grp()}-${grp()}-${grp()}`;
}
/* setAuth: se recoveryCode è fornito, ne salva l'hash accanto alle credenziali.
   Se non fornito (cambio password da impostazioni), mantiene quello esistente. */
async function setAuth(studioId, password, recoveryCode){
  const salt = randomSalt();
  const hash = await sha256(salt + ":" + password);
  const existing = loadAuth() || {};
  let recoveryHash = existing.recoveryHash || null;
  let recoverySalt = existing.recoverySalt || null;
  if (recoveryCode){
    recoverySalt = randomSalt();
    recoveryHash = await sha256(recoverySalt + ":" + recoveryCode.trim().toUpperCase());
  }
  localStorage.setItem(AUTH_KEY, JSON.stringify({ studioId, salt, hash, recoverySalt, recoveryHash }));
}
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
function authIsSet(){ const a = loadAuth(); return !!(a && a.hash); }
async function checkCredentials(studioId, password){
  const a = loadAuth();
  if (!a || !a.hash) return true;               // nessun blocco impostato
  const hash = await sha256((a.salt||"") + ":" + password);
  // ID case-insensitive, password esatta
  return hash === a.hash && (studioId||"").trim().toLowerCase() === (a.studioId||"").trim().toLowerCase();
}
/* Verifica il codice di recupero (per rientrare dopo password dimenticata) */
async function checkRecoveryCode(code){
  const a = loadAuth();
  if (!a || !a.recoveryHash || !a.recoverySalt) return false;
  const hash = await sha256(a.recoverySalt + ":" + (code||"").trim().toUpperCase());
  return hash === a.recoveryHash;
}
/* Reimposta solo la password mantenendo ID e codice di recupero */
async function resetPasswordKeepingRecovery(newPassword){
  const a = loadAuth(); if (!a) return;
  const salt = randomSalt();
  const hash = await sha256(salt + ":" + newPassword);
  localStorage.setItem(AUTH_KEY, JSON.stringify({ ...a, salt, hash }));
}
// compat: vecchi backup senza salt
async function checkPassword(password){
  const a = loadAuth();
  if (!a || !a.hash) return true;
  if (a.salt) return await sha256(a.salt + ":" + password) === a.hash;
  return await sha256(password) === a.hash; // hash legacy senza salt
}

/* ============================================================
   BACKUP / RIPRISTINO — esporta impostazioni + consensi + richieste
   in un unico file .json. Cifratura opzionale (AES-GCM, chiave da
   PBKDF2). Cifrato = illeggibile senza password anche se il file
   finisce in mani altrui, ma password persa = dati irrecuperabili.
   ============================================================ */
function collectBackup(){
  return {
    _app: "InkConsent",
    _version: 1,
    _exportedAt: new Date().toISOString(),
    studio: loadStudioOverrides(),
    auth: loadAuth(),
    sessions: loadSessions(),
    richieste: loadRichieste(),
    inks: loadInks(),
    needles: loadNeedles(),
    forniture: loadForniture(),
  };
}
async function deriveKey(password, salt){
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt","decrypt"]
  );
}
/* b64/unb64 sicure sono definite piu' su (ciclo, niente spread che
   esplode sulle firme grandi). Qui NON le ridefinisco: la vecchia
   versione con lo spread mandava in errore il backup non appena
   l'archivio conteneva una firma. */

/* Backup formato 2: dentro il file ci va anche una copia delle buste
   della cassaforte. Cosi' un backup cifrato si riapre in tre modi —
   password del backup, le 12 parole, oppure assistenza — invece che
   in uno solo. Prima, password del backup dimenticata = backup perso. */
/* Mese di competenza di un consenso: la data reale della seduta.
   E' quella che pinzi col lotto e gli inchiostri, quindi e' quella
   con cui il consenso va archiviato. Se manca, si ripiega su quando
   e' stato aggiornato. */
function meseSeduta(s){
  const d = (s.seduta && s.seduta.dataApplicazione) || (s.updatedAt||"").slice(0,10) || (s.createdAt||"").slice(0,10);
  return (d || "").slice(0,7);   // YYYY-MM
}
const MESI_IT = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function meseLabel(ym){
  if (!ym) return "Senza data";
  const [y,m] = ym.split("-");
  return (MESI_IT[Number(m)-1] || "") + " " + y;
}

async function exportBackup(password){
  const payload = JSON.stringify(collectBackup());
  let out;
  if (DEK && vaultEsiste()){
    const vaultCopia = { ...loadVault() };
    delete vaultCopia.daRinnovare;
    if (password){
      const salt = randomBytes(16);
      vaultCopia.saltBk = b64(salt);
      vaultCopia.bustaBk = await chiudiBusta(DEK, await kekDa(password, salt));
    }
    const iv = randomBytes(12);
    const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, DEK, new TextEncoder().encode(payload));
    out = JSON.stringify({ _app:"InkConsent", _encrypted:true, _v:2,
                           vault: vaultCopia, iv:b64(iv), data:b64(new Uint8Array(ct)) }, null, 2);
  } else if (password){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(payload));
    out = JSON.stringify({ _app:"InkConsent", _encrypted:true, salt:b64(salt), iv:b64(iv), data:b64(ct) }, null, 2);
  } else {
    out = payload;
  }
  const blob = new Blob([out], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `inkconsent-backup-${stamp}${password ? "-cifrato" : ""}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  segnaBackupFatto();
}

async function importBackup(fileText, password, frase){
  let obj = JSON.parse(fileText);
  if (obj._encrypted && obj._v === 2){
    const v = obj.vault || {};
    let dek = null;
    if (frase && await fraseValida(frase)){
      try { dek = await apriConFrase(v, frase); } catch(e){ throw new Error("WRONG_PHRASE"); }
    } else if (password){
      // prima la password specifica del backup, poi quella dello studio
      try { dek = await apriBusta(v.bustaBk, await kekDa(password, unb64(v.saltBk))); }
      catch(e){ try { dek = await apriConPassword(v, password); } catch(e2){ throw new Error("WRONG_PASSWORD"); } }
    } else {
      throw new Error("PASSWORD_REQUIRED");
    }
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(obj.iv) }, dek, unb64(obj.data));
    obj = JSON.parse(new TextDecoder().decode(plain));
    saveVault(v);          // il dispositivo eredita la cassaforte del backup
    DEK = dek;
  } else if (obj._encrypted){
    if (!password) throw new Error("PASSWORD_REQUIRED");
    const key = await deriveKey(password, unb64(obj.salt));
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(obj.iv) }, key, unb64(obj.data));
    } catch(e){ throw new Error("WRONG_PASSWORD"); }
    obj = JSON.parse(new TextDecoder().decode(plain));
  }
  if (obj._app !== "InkConsent") throw new Error("NOT_A_BACKUP");
  // ripristina tutto
  if (obj.studio) saveStudioOverrides(obj.studio);
  if (obj.auth) localStorage.setItem(AUTH_KEY, JSON.stringify(obj.auth));
  if (obj.sessions) saveSessions(obj.sessions);
  if (obj.richieste) saveRichieste(obj.richieste);
  if (obj.inks) saveInks(obj.inks);
  if (obj.needles) saveNeedles(obj.needles);
  if (obj.forniture) saveForniture(obj.forniture);
  return {
    sessions: (obj.sessions||[]).length,
    richieste: (obj.richieste||[]).length,
  };
}

/* ============================================================
   EXPORT/IMPORT SOLO CONSENSI (prompt6, Task 6) — diverso dal
   backup completo qui sopra: nessuna impostazione/credenziale/
   magazzino, solo l'archivio consensi (tutto o una selezione di
   mesi). L'import è ADDITIVO e fa dedup per id: usato per spostare
   consensi tra i dispositivi/tatuatori consentiti dello stesso
   studio, senza sovrascrivere quello che c'è già sul dispositivo
   di destinazione (a differenza del ripristino da backup completo,
   che sostituisce tutto).
   ============================================================ */
async function exportConsensiSelettivo(mesiSelezionati, password){
  const tutti = loadSessions().filter(s => s.status === "archiviato");
  const sessions = (!mesiSelezionati || !mesiSelezionati.length)
    ? tutti
    : tutti.filter(s => mesiSelezionati.includes(meseSeduta(s)));
  const payload = JSON.stringify({ _app: "InkConsent", _tipo: "consensi-selettivi", _v: 1, _exportedAt: new Date().toISOString(), sessions });
  let out;
  if (password){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(payload));
    out = JSON.stringify({ _app: "InkConsent", _tipo: "consensi-selettivi", _encrypted: true, salt: b64(salt), iv: b64(iv), data: b64(ct) }, null, 2);
  } else {
    out = payload;
  }
  const blob = new Blob([out], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `inkconsent-consensi-${new Date().toISOString().slice(0,10)}${password ? "-cifrato" : ""}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return sessions.length;
}
async function importConsensiSelettivo(fileText, password){
  let obj = JSON.parse(fileText);
  if (obj._encrypted){
    if (!password) throw new Error("PASSWORD_REQUIRED");
    const key = await deriveKey(password, unb64(obj.salt));
    let plain;
    try { plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(obj.iv) }, key, unb64(obj.data)); }
    catch(e){ throw new Error("WRONG_PASSWORD"); }
    obj = JSON.parse(new TextDecoder().decode(plain));
  }
  if (obj._app !== "InkConsent" || obj._tipo !== "consensi-selettivi" || !Array.isArray(obj.sessions)) throw new Error("NOT_A_BACKUP");
  const esistenti = new Set(loadSessions().map(s => s.id));
  const nuovi = obj.sessions.filter(s => s && s.id && !esistenti.has(s.id));
  if (nuovi.length) saveSessions([...nuovi, ...loadSessions()]);
  return { importati: nuovi.length, saltati: obj.sessions.length - nuovi.length };
}

/* ---------- WhatsApp click-to-chat ----------
   Formato ufficiale wa.me: numero senza simboli, prefisso Italia
   assunto se il cliente non l'ha scritto lui stesso.            */
function waLink(telefono, message){
  let digits = (telefono || "").replace(/[^\d]/g, "");
  if (digits && !digits.startsWith("39") && digits.length <= 10) digits = "39" + digits;
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}
function waMessageFor(r){

}
function aftercareMessage(session){
  const nome = session.anagrafica ? session.anagrafica.nome : "";
  const tpl = STUDIO_CONFIG.aftercareText || "";
  const testo = tpl.replace(/\{nome\}/g, nome || "").trim();

/* Link alla barra "giorno X di N": porta con sé SOLO una data e un
   numero di giorni, calcolati lato client dalla pagina stessa — nessun
   id di sessione, nessun dato del cliente nel link. Riapribile quante

function validateStep(step){
  const errs = [];
  if (step === 1){
    if (!draft.anagrafica.nome.trim()) errs.push("Inserisci il nome.");
    const etaCli = calcolaEta(draft.anagrafica.nascita, draft.seduta && draft.seduta.dataApplicazione);
    if (etaCli !== null){
      const vEta = verdettoEta(etaCli, draft.tipoApplicazione || "tatuaggio", STUDIO_CONFIG.regione || "");
      if (vEta && vEta.livello === "vietato") errs.push(vEta.msg + " Non è possibile procedere.");
    }
    if (!draft.anagrafica.cognome.trim()) errs.push("Inserisci il cognome.");
    if (!draft.anagrafica.nascita) errs.push("Inserisci la data di nascita.");
    if (draft.minorenne){
      if (!draft.tutore1.nome.trim()) errs.push("Inserisci i dati di almeno un genitore/tutore.");
      if (!draft.documento.numero.trim()) errs.push("Inserisci gli estremi del documento del genitore/tutore firmatario.");
    }
  }
  if (step === 2){
    const unanswered = HEALTH_QUESTIONS.filter(q => !draft.sanitario[q.id]);
    if (unanswered.length) errs.push("Rispondi a tutte le domande del questionario sanitario.");
  }
  if (step === 3){
    if (draft.zonaMode === "sagoma"){
      if (!draft.markers.length && !(draft.strokes||[]).length) errs.push("Segna la zona sulla sagoma (con un punto o disegnando).");
    } else {
      if (!draft.zone.length && !draft.zonaLibera.trim()) errs.push("Indica la zona del corpo (seleziona o scrivi la zona).");
    }
    if (!draft.zoneNei) errs.push("Indica se l'area presenta nei.");
  }
  if (step === 4){
    if (!draft.informativaLetta) errs.push("Conferma di aver letto e compreso il modulo di consenso informato.");
  }
  if (step === 5){
    if (!draft.privacyConsenso) errs.push("Conferma il consenso al trattamento dei dati personali.");
    if (!draft.disegnoConfermato) errs.push("Conferma di aver visionato e approvato il disegno.");
  }
  if (step === 6){
    if (!draft.firmaClienteData) errs.push("È necessaria la firma del cliente per procedere.");
  }
  if (step === 7){
    if (!draft.seduta.dataApplicazione) errs.push("Inserisci la data effettiva dell'applicazione.");
  }
  if (step === 8){
    if (!draft.controfirmaData) errs.push("È necessaria la controfirma del tatuatore.");
  }
  return errs;
}

function render(){
  const root = qs("#app-root");
  if (state.mode === "aftercare") root.innerHTML = renderAftercarePage();
  else if (state.mode === "client") root.innerHTML = renderClientShell();
  else if (state.mode === "richiesta") root.innerHTML = renderLeadShell();
  else if (state.needsStudioAccount) root.innerHTML = renderStudioAccountSetup();
  else if (state.needsTrialChoice) root.innerHTML = renderTrialChoice();
  else if (state.showTour) root.innerHTML = renderTour();
  else if (state.needsTerms) root.innerHTML = renderTerms();
  else if (state.needsSetup) root.innerHTML = renderFirstRunSetup();
  else if (state.locked) root.innerHTML = renderLockScreen();
  else if (!(guestSessionState() && !guestSessionState().scaduto) && serveSceltaTatuatore()) root.innerHTML = renderTatuatoreSwitch();
  else if ((guestSessionState()||{}).scaduto) root.innerHTML = renderGuestGate();
  else if (state.deviceLimitBlock) root.innerHTML = renderDeviceLimitBlock();
  else root.innerHTML = renderStudioShell();
  afterRender();
}
const BACKUP_META_KEY = "inkconsent_backup_meta_v1"; // { last: ISO, count }
function backupMeta(){ try { return JSON.parse(localStorage.getItem(BACKUP_META_KEY)) || {}; } catch(e){ return {}; } }
function segnaBackupFatto(){
  const m = backupMeta();
  localStorage.setItem(BACKUP_META_KEY, JSON.stringify({ last: new Date().toISOString(), count: (m.count||0)+1 }));
}
function giorniDaUltimoBackup(){
  const m = backupMeta();
  if (!m.last) return null;
  return Math.floor((Date.now() - new Date(m.last).getTime()) / 86400000);
}
function backupFattoOggi(){
  const m = backupMeta();
  return m.last && m.last.slice(0,10) === new Date().toISOString().slice(0,10);
}

/* Chiede al browser di non buttare via i dati per far spazio. Non ferma
   la cancellazione manuale, ma su Safari evita che un sito poco usato
   venga svuotato da solo dopo giorni di inattivita'. Una riga, gratis. */
async function chiediPersistenza(){
  try {
    if (navigator.storage && navigator.storage.persist){
      if (!(await navigator.storage.persisted())) await navigator.storage.persist();
    }
  } catch(e){ /* non supportato: pazienza */ }
}

  if (canvas2) initSignaturePad(canvas2, "firmaTutore2Data");
  const qrHost = qs("#qr-host");
  if (qrHost && window.QRCode) {
    qrHost.innerHTML = "";
    new QRCode(qrHost, { text: buildClientLink(qs("#qr-host").dataset.sid), width: 132, height: 132, colorDark: "#1B1A19", colorLight: "#ffffff" });
  }
  const hoHost = qs("#handoff-qr-host");
  if (hoHost && window.QRCode){

      new QRCode(hoHost, {

        colorDark: "#1B1A19", colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.L, // capienza massima: serve tutto lo spazio
      });
    } catch(e){
      hoHost.innerHTML = '<p class="field hint">Il QR non è stato generato. Usa il codice testuale qui sotto.</p>';
    }
  }
  if (state.scanning) startScanner();

  // lavagnetta: canvas di disegno libero (una per vista fronte/retro)
  qsa(".body-draw").forEach(cv => initBodyDrawing(cv));
}

/* Disegno libero sulla sagoma: salva tracce come percentuali (indipendenti
   dalla dimensione del canvas) così si ridisegnano identiche a qualsiasi scala. */
function initBodyDrawing(cv){
  const ctx = cv.dataset.drawCtx;              // 'lead' | 'consenso'
  const view = cv.dataset.drawView;            // 'fronte' | 'retro'
  const obj = ctx === "lead" ? leadDraft : draft;
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  g.lineWidth = 3; g.lineCap = "round"; g.lineJoin = "round";
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim() || "#5B3B63";
  g.strokeStyle = accent;

  function redraw(){
    g.clearRect(0,0,rect.width,rect.height);
    (obj.strokes||[]).filter(s => s.view === view).forEach(s => {
      g.beginPath();
      s.points.forEach((p,i) => {
        const x = p.xPct/100*rect.width, y = p.yPct/100*rect.height;
        if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
      });
      g.stroke();
    });
  }
  redraw();

  let drawing = false, cur = null;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { xPct: ((t.clientX-r.left)/r.width)*100, yPct: ((t.clientY-r.top)/r.height)*100 };
  };
  const start = (e) => { e.preventDefault(); drawing = true; cur = { view, points:[pos(e)] }; };
  const move = (e) => { if(!drawing) return; e.preventDefault(); cur.points.push(pos(e));
    const r = cv.getBoundingClientRect();
    g.beginPath();
    cur.points.forEach((p,i)=>{ const x=p.xPct/100*rect.width, y=p.yPct/100*rect.height; if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});
    g.stroke();
  };
  const end = () => { if(!drawing) return; drawing=false; if(cur && cur.points.length>1){ obj.strokes = obj.strokes||[]; obj.strokes.push(cur);
    if (ctx === "consenso") upsertSession(draft); } cur=null; };
  cv.addEventListener("mousedown", start); cv.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
  cv.addEventListener("touchstart", start, {passive:false}); cv.addEventListener("touchmove", move, {passive:false}); cv.addEventListener("touchend", end);
}

function buildLeadLink(){

}

   marcato), out (limite raggiunto, invita al piano giusto per il numero
   di tatuatori dichiarato — o al contatto diretto se multi-studio). */
function renderTrialProgress(st){
  const pct = Math.min(100, Math.round((st.count / st.limit) * 100));
  const low = st.remaining > 0 && st.remaining <= 3;
  const out = st.remaining <= 0;
  const cls = out ? "out" : low ? "low" : "ok";
  const piano = pianoConsigliato();
  const pianoLabel = piano.id === "multi-studio"
    ? (gembucherContattoDisponibile()
        ? `<a href="${gembucherContactLink('Ciao, vorrei un preventivo InkConsent per più sedi.')}" target="_blank" rel="noopener">contatta GemBucher per un preventivo multi-studio</a>`

    : `il piano ${esc(piano.nome)} (${esc(piano.desc)})`;
  return `
  <div class="trial-bar trial-${cls}">
    <div class="trial-bar-top">
      <span>${out ? "Consensi gratuiti terminati" : "Prova gratuita"}</span>

    ${low ? `<p class="trial-note">Ti restano ${st.remaining} consens${st.remaining===1?"o":"i"} gratuit${st.remaining===1?"o":"i"}: quando finiscono, valuta ${pianoLabel}.</p>` : ""}

/* ============================================================
   STATISTICHE — sola lettura, zero storage nuovo: solo
   aggregazione di quello che c'e' già in loadSessions()/loadRichieste().
   ============================================================ */
function renderStatistiche(){
  const sessions = loadSessions().filter(s => s.status === "archiviato");
  const richieste = loadRichieste();
  const now = new Date();
  const ym = now.toISOString().slice(0,7);
  const meseCorrente = sessions.filter(s => (s.createdAt||"").slice(0,7) === ym
    || ((s.seduta && s.seduta.dataApplicazione)||"").slice(0,7) === ym);
  const prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const ymPrev = prevDate.toISOString().slice(0,7);
  const mesePrec = sessions.filter(s => (s.createdAt||"").slice(0,7) === ymPrev);
  const delta = mesePrec.length === 0 ? null : meseCorrente.length - mesePrec.length;

  const convertiti = richieste.filter(l => l.convertito).length;
  const tassoConv = richieste.length ? Math.round((convertiti / richieste.length) * 100) : null;

  const zoneCount = {};
  sessions.forEach(s => (s.zone||[]).forEach(z => { zoneCount[z] = (zoneCount[z]||0) + 1; }));
  const zoneTop = Object.entries(zoneCount).sort((a,b) => b[1]-a[1]).slice(0,5);
  const zoneMax = zoneTop.length ? zoneTop[0][1] : 0;

  return `
  <div class="topbar">
    <div><h1>Statistiche</h1><p>Solo lettura, calcolate sui dati già in archivio su questo dispositivo</p></div>
  </div>
  <div class="main-inner">
    <div class="disp-summary">
      <div class="disp-stat">
        <span>Consensi questo mese</span>
        <b>${meseCorrente.length}</b>
        ${delta !== null ? `<small class="trend ${delta>0?'trend-up':delta<0?'trend-down':'trend-flat'}">${delta>0?'+':''}${delta} vs mese scorso</small>` : `<small>—</small>`}
      </div>
      <div class="disp-stat">
        <span>Preventivi convertiti</span>
        <b>${tassoConv === null ? "—" : tassoConv + "%"}</b>
        <small>${convertiti} su ${richieste.length} richiest${richieste.length===1?"a":"e"}</small>
      </div>
      <div class="disp-stat">
        <span>Zona più richiesta</span>
        <b style="font-size:16px;">${zoneTop.length ? esc(zoneTop[0][0]) : "—"}</b>
        <small>${zoneTop.length ? zoneTop[0][1] + " consens" + (zoneTop[0][1]===1?"o":"i") : "nessun dato ancora"}</small>
      </div>
    </div>
    ${zoneTop.length ? `
    <div class="card">
      <h3 class="section-title">Zone anatomiche più richieste</h3>
      <div class="disp-grid" style="grid-template-columns:1fr;gap:8px;">
        ${zoneTop.map(([z,n]) => `
          <div class="disp-qty-row">
            <span style="flex:0 0 130px;font-size:13.5px;">${esc(z)}</span>
            <div class="disp-bar"><i class="stk-ok" style="width:${Math.round(n/zoneMax*100)}%;"></i></div>
            <span class="mono" style="font-size:12px;color:var(--ink-faint);width:26px;text-align:right;">${n}</span>
          </div>`).join("")}
      </div>
    </div>` : `<div class="arch-empty"><b>Ancora nessun dato</b><p>Le statistiche si popolano da sole man mano che archivi consensi e ricevi richieste di preventivo.</p></div>`}
  </div>`;
}

function renderAgendaGiorno(dataISO){
  const list = appuntamentiDelGiorno(dataISO);
  const d = new Date(dataISO+"T00:00:00");
  const label = `${GIORNI_SETTIMANA[(d.getDay()+6)%7]} ${d.getDate()} ${d.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}`;
  return `
  <h3 class="section-title" style="text-transform:capitalize;">${esc(label)}</h3>

function renderAgendaSettimana(dataISO){
  const giorni = settimanaDi(dataISO);
  const oggi = new Date().toISOString().slice(0,10);
  return `

    ${giorni.map(g => {

      const d = new Date(g+"T00:00:00");

/* Griglia mese classica (prompt10, Task 2): tocco su un giorno apre la
   vista giorno di quella data, non un dettaglio inline — la griglia
   resta leggibile anche con molti appuntamenti, il dettaglio si vede
   dove c'è già spazio (vista giorno). */
function renderAgendaMese(dataISO){
  const d = new Date(dataISO + "T00:00:00");
  const anno = d.getFullYear(), mese = d.getMonth();
  const dowPrimo = (new Date(anno, mese, 1).getDay() + 6) % 7; // lunedì=0
  const giorniInMese = new Date(anno, mese+1, 0).getDate();
  const celle = [];
  for (let i = 0; i < dowPrimo; i++) celle.push(null);
  for (let g = 1; g <= giorniInMese; g++) celle.push(`${anno}-${String(mese+1).padStart(2,"0")}-${String(g).padStart(2,"0")}`);
  while (celle.length % 7 !== 0) celle.push(null);
  const oggi = new Date().toISOString().slice(0,10);
  const meseLabel = d.toLocaleDateString("it-IT", { month: "long", year: "numeric" });
  return `
  <h3 class="section-title" style="text-transform:capitalize;">${esc(meseLabel)}</h3>
  <div class="agenda-month">
    <div class="agenda-month-dow">${GIORNI_SETTIMANA.map(g => `<span>${g.slice(0,3)}</span>`).join("")}</div>
    <div class="agenda-month-grid">
      ${celle.map(g => {
        if (!g) return `<div class="agenda-month-cell empty"></div>`;
        const list = appuntamentiDelGiorno(g);
        return `
        <div class="agenda-month-cell ${g===oggi?'is-today':''}${list.length?' has-appt':''}" data-action="agenda-mese-apri-giorno" data-data="${g}">
          <span class="amc-num">${Number(g.slice(8,10))}</span>
          ${list.length ? `<span class="amc-count">${list.length > 9 ? "9+" : list.length}</span>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

/* ============================================================

    <div class="btn-row">

    <div class="subhead" style="margin-top:20px;">Esporta i PDF per mese</div>
    <p class="section-desc">Ogni consenso archiviato finisce nel mese della sua seduta. Scarica un mese intero: i PDF escono nominati <span class="mono">AAAA-MM-GG_cognome-nome.pdf</span>, pronti da mettere in cartella.</p>
    ${mesi.length === 0 ? `<p class="hint">Nessun consenso archiviato ancora.</p>` : mesi.map(([ym, arr]) => `
      <div class="arch-month">
        <h4>${meseLabel(ym)}</h4><span class="cnt">${arr.length} consens${arr.length===1?"o":"i"}</span>
        <span class="line"></span>

      </div>`).join("")}
    <div class="callout warn" style="margin-top:14px;"><b>I PDF non sono cifrati.</b> Una volta salvati sul telefono, chi vi accede può aprirli: trattali come le fotocopie dei consensi cartacei. La cifratura protegge l'archivio dentro l'app, non i file che ne escono.</div>

    <h3 class="section-title">Solo consensi: sposta l'archivio tra dispositivi</h3>
    <p class="section-desc">Diverso dal backup completo qui sopra: esporta SOLO i consensi archiviati (tutti o dei mesi che scegli), niente impostazioni/credenziali/magazzino. Importarlo su un altro dispositivo AGGIUNGE quei consensi ai suoi senza cancellare nulla — i consensi già presenti (stesso id) vengono saltati, non duplicati.</p>
    ${mesi.length === 0 ? `<p class="hint">Nessun consenso archiviato ancora da esportare.</p>` : `
    <div class="check-row"><input type="checkbox" id="sel-tutti-mesi" data-action="toggle-sel-tutti-mesi" ${(state.exportConsensiMesi||[]).length === mesi.length ? "checked" : ""}><label for="sel-tutti-mesi" class="ct">Tutti i mesi (${loadSessions().filter(s=>s.status==="archiviato").length} consensi)</label></div>
    ${mesi.map(([ym, arr]) => `

      <button class="btn btn-ghost" data-action="do-import-consensi-pick">${icon("upload",16)} Importa consensi da file</button>

/* consensi archiviati, in gruppi mensili ordinati dal più recente */
function raggruppaPerMese(sessions){
  const arch = (sessions||[]).filter(s => s.status === "archiviato");
  const map = {};
  arch.forEach(s => { const k = meseSeduta(s); (map[k] = map[k] || []).push(s); });
  return Object.keys(map).sort((a,b) => b.localeCompare(a)).map(k => [k, map[k]]);
}
function renderRegistro(){
  const archived = loadSessions()
    .filter(s => s.status === "archiviato" && s.progressivo)
    .sort((a,b) => (b.progressivo||"").localeCompare(a.progressivo||""));
  const rows = archived.map(s => {
    const dataSeduta = s.seduta && s.seduta.dataApplicazione ? fmtDate(s.seduta.dataApplicazione) : "—";
    const zona = s.zonaMode === "sagoma"
      ? `sagoma (${(s.markers||[]).length}p/${(s.strokes||[]).length}d)`
      : (s.zone||[]).join(", ") || (s.zonaLibera || "—");
    return `<tr>
      <td class="mono">${esc(s.progressivo)}</td>
      <td>${esc(s.anagrafica.cognome)} ${esc(s.anagrafica.nome)}${s.minorenne ? ' <span class="reg-minor">min.</span>' : ""}</td>
      <td>${dataSeduta}</td>
      <td>${esc(s.tipoApplicazione === "piercing" ? "Piercing" : "Tatuaggio")}</td>
      <td>${esc(zona)}</td>
      <td>${esc(s.artista || "—")}</td>
    </tr>`;
  }).join("");
  return `
  <div class="topbar">
    <div><h1>Registro consensi</h1><p>${archived.length} consensi archiviati · pronto per la stampa in caso di controllo</p></div>
    <button class="btn btn-primary btn-sm no-print" data-action="print-registro">${icon("printer",16)} Stampa registro</button>
  </div>
  <div class="main-inner">
    <div class="card" id="registro-print">
      <div class="registro-head only-print">
        <strong>${esc(STUDIO_CONFIG.studioName)}</strong> — ${esc(STUDIO_CONFIG.studioCity)}<br>
        Registro dei consensi informati · estratto del ${fmtDate(new Date().toISOString().slice(0,10))}
      </div>
      ${archived.length === 0 ? `<p class="section-desc">Ancora nessun consenso archiviato. I consensi compaiono qui con il loro numero di registro una volta completati e controfirmati.</p>` : `
      <table class="reg-table">
        <thead><tr><th>N. registro</th><th>Cliente</th><th>Data seduta</th><th>Tipo</th><th>Zona</th><th>Artista</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="reg-note">Conservazione minima ${STUDIO_CONFIG.retentionYears} anni. Ogni consenso è archiviato con firma del cliente e controfirma dell'operatore; il documento completo è esportabile in PDF dall'archivio.</p>
      `}
    </div>
  </div>`;
}

function renderFornCard(it){
  const cat = catInfo(it.categoria);
  const st = statoScorta(it);
  const q = it.quantita||0, soglia = it.soglia||0;
  const pct = soglia > 0 ? Math.max(6, Math.min(100, (q/(soglia*3))*100)) : (q>0?100:6);
  const img = it.foto || catIconUrl(cat.iconSlug);
  const imgOnerror = it.foto ? "this.style.opacity=0" : catIconOnerrorAttr(cat.iconSlug);
  const cardCls = st.key === "esaurito" ? " is-out" : (st.key === "bassa" ? " is-low" : "");
  return `
  <div class="disp-card${cardCls}">
    <div class="disp-card-top">
      <div class="disp-thumb"><img src="${img}" alt="" onerror="${imgOnerror}"></div>
      <div class="disp-info">
        <div class="disp-name-row">
          <span class="disp-name">${esc(it.nome||"—")}</span>
          <span class="disp-badge ${st.cls}">${st.label}</span>
        </div>
        <div class="disp-cat">${esc(cat.label)}</div>
        <div class="disp-qty-row">
          <span class="disp-qty">${q}</span>
          <div class="disp-bar">
            <i class="${st.cls}" style="width:${pct}%"></i>
            ${soglia > 0 ? `<span class="tick" style="left:33.3%" title="soglia di riordino"></span>` : ""}
          </div>
        </div>
        <div class="disp-thresh">${soglia > 0 ? `riordina sotto ${soglia}` : `soglia di riordino non impostata`}</div>
      </div>
    </div>
    <div class="disp-card-bot">
      <div class="disp-mov">
        <div class="disp-qtybtns">
          <button class="disp-step" data-action="forn-minus" data-id="${it.id}" title="Ne ho consumato uno" aria-label="Togli un pezzo">${icon("minus",16)}</button>
          <button class="disp-step" data-action="forn-plus" data-id="${it.id}" title="Ne ho aggiunto uno" aria-label="Aggiungi un pezzo">${icon("plus",16)}</button>
        </div>
        <button class="disp-icon-btn" data-action="forn-load" data-id="${it.id}" title="Registra un acquisto con il prezzo" aria-label="Registra acquisto">${icon("restock",16)}</button>
        <button class="disp-icon-btn" data-action="forn-edit" data-id="${it.id}" title="Modifica articolo" aria-label="Modifica articolo">${icon("pen",16)}</button>
        <button class="disp-icon-btn danger" data-action="forn-delete" data-id="${it.id}" title="Elimina articolo" aria-label="Elimina articolo">${icon("trash",16)}</button>
      </div>
    </div>
  </div>`;
}
