<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkConsent · Podere 173 Tattoo Studio</title>
<meta name="description" content="Consenso informato digitale per studi di tatuaggio">
<meta name="theme-color" content="#1B1A19">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   INKCONSENT — design tokens
   Palette evokes tattoo stencil-transfer paper (violet carbon),
   healed-ink black and vellum. Swap values in :root to re-skin
   per studio — see STUDIO_CONFIG in the script for the rest of
   the whitelabel surface (name, artists, informativa text).
   ============================================================ */
:root{
  --paper:       #EDE8E2;
  --paper-raised:#F8F5F0;
  --ink:         #1B1A19;
  --ink-soft:    #57514B;
  --ink-faint:   #8B837A;
  --stencil:     #5B3B63;
  --stencil-deep:#402C46;
  --stencil-tint:#E5DAE8;
  --flesh:       #C98F6C;
  --warn:        #9C3B26;
  --warn-tint:   #F1DAD2;
  --ok:          #3F6B4E;
  --ok-tint:     #DCE6DE;
  --line:        #C7BEB2;
  --line-soft:   #DAD3C8;
  --shadow: 0 1px 2px rgba(27,26,25,.06), 0 8px 24px -12px rgba(27,26,25,.18);
  --radius: 3px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;color:var(--ink);}
.mono{font-family:var(--font-mono);}
a{color:var(--stencil);}
button{font-family:inherit;}
::selection{background:var(--stencil-tint);}
:focus-visible{outline:2px solid var(--stencil);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

/* ---------- layout shell ---------- */
#app-root{min-height:100vh;}

.shell{display:flex;min-height:100vh;}
.rail{
  width:248px;flex:none;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;padding:22px 18px;
}
.rail-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.rail-mark{
  width:34px;height:34px;border-radius:50%;background:var(--stencil);
  color:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;flex:none;overflow:hidden;
}
.rail-brand-name{font-family:var(--font-display);font-size:15px;line-height:1.2;font-weight:600;}
.rail-brand-sub{font-size:11px;color:#B9AFA4;font-family:var(--font-mono);letter-spacing:.03em;}
.rail-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:auto;}
.rail-btn{
  all:unset;cursor:pointer;padding:10px 12px;border-radius:var(--radius);
  font-size:13.5px;color:#D8D2CA;display:flex;align-items:center;gap:9px;
}
.rail-btn:hover{background:rgba(255,255,255,.06);}
.rail-btn.active{background:var(--stencil);color:#fff;}
.rail-foot{font-size:11px;color:#8A8178;font-family:var(--font-mono);padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}

.main{flex:1;min-width:0;padding:34px 40px 60px;}
.main-inner{max-width:820px;margin:0 auto;}
.topbar{max-width:820px;margin:0 auto 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.topbar h1{font-size:22px;margin:0;}
.topbar p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;}

/* ---------- client (mobile self-fill) shell ---------- */
.client-shell{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 48px;}
.client-head{
  background:var(--ink);color:var(--paper);padding:22px 22px 26px;
  border-radius:0 0 18px 18px;
}
.client-head .rail-brand{margin-bottom:14px;}
.progress-track{display:flex;gap:5px;}
.progress-dash{height:3px;flex:1;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;}
.progress-dash i{display:block;height:100%;width:0%;background:var(--flesh);transition:width .35s ease;}
.client-body{padding:22px 20px 0;}

/* ---------- cards / surfaces ---------- */
.card{
  background:var(--paper-raised);border:1px solid var(--line-soft);
  border-radius:var(--radius);padding:22px 22px 24px;box-shadow:var(--shadow);
}
.card + .card{margin-top:16px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field .hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:560px){.grid-2{grid-template-columns:1fr;}}

input[type=text],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;color:var(--ink);font-family:var(--font-body);font-size:14.5px;
}
input:focus,select:focus,textarea:focus{border-color:var(--stencil);}
textarea{resize:vertical;min-height:70px;}

.check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.check-row:last-child{border-bottom:none;}
.check-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--stencil);flex:none;}
.check-row .ct{font-size:14px;}
.check-row .ct small{display:block;color:var(--ink-faint);font-size:12px;margin-top:1px;}

.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;}
.chip{
  border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;
  font-size:13px;cursor:pointer;background:#fff;text-align:center;user-select:none;
}
.chip.on{background:var(--stencil);border-color:var(--stencil);color:#fff;}

.callout{border-radius:var(--radius);padding:14px 16px;font-size:13.5px;line-height:1.6;}
.callout.warn{background:var(--warn-tint);border:1px solid #DEBBAF;color:#6B2113;}
.callout.info{background:var(--stencil-tint);border:1px solid #CBB9CF;color:var(--stencil-deep);}
.callout.ok{background:var(--ok-tint);border:1px solid #B9CDBD;color:#274935;}

/* ---------- buttons ---------- */
.btn{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 20px;border-radius:var(--radius);font-size:13.5px;font-weight:600;
  letter-spacing:.01em;
}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{background:#000;}
.btn-accent{background:var(--stencil);color:#fff;}
.btn-accent:hover{background:var(--stencil-deep);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;margin-top:22px;}

/* ---------- stamp (signature design element) ---------- */
.stamp{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:2px;border:1.5px solid currentColor;
  transform:rotate(-2deg);position:relative;
}
.stamp::after{
  content:"";position:absolute;inset:0;border-radius:2px;
  background:repeating-linear-gradient(115deg,currentColor 0 1px,transparent 1px 3px);
  opacity:.12;pointer-events:none;
}
.stamp-bozza{color:var(--ink-faint);}
.stamp-attesa{color:var(--flesh);}
.stamp-firmato{color:var(--ok);}
.stamp-archiviato{color:var(--stencil);}

/* ---------- archive table ---------- */
.arch-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line-soft);
  border-radius:var(--radius);background:var(--paper-raised);cursor:pointer;
}
.arch-row + .arch-row{margin-top:8px;}
.arch-row:hover{border-color:var(--stencil);}
.arch-idx{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);width:64px;flex:none;}
.arch-name{flex:1;min-width:0;}
.arch-name b{font-size:14.5px;}
.arch-name span{display:block;font-size:12px;color:var(--ink-faint);}
.arch-empty{padding:48px 20px;text-align:center;color:var(--ink-faint);}
.arch-empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:17px;margin-bottom:6px;}

/* ---------- signature pad ---------- */
.sigpad-wrap{border:1.5px dashed var(--line);border-radius:var(--radius);background:#fff;position:relative;}
.sigpad-wrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair;}
.sigpad-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:13px;pointer-events:none;}

/* ---------- stepper ---------- */
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.step-pill{
  font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:20px;
  border:1px solid var(--line);color:var(--ink-faint);
}
.step-pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.step-pill.done{border-color:var(--ok);color:var(--ok);}

/* ---------- misc ---------- */
.section-title{font-size:17px;margin:0 0 4px;}
.section-desc{color:var(--ink-soft);font-size:13.5px;margin:0 0 18px;}
.subhead{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--stencil-deep);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line-soft);}
.subhead:first-of-type{border-top:none;padding-top:0;margin-top:6px;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv b{font-weight:600;}
.qr-box{background:#fff;padding:14px;border-radius:var(--radius);display:inline-block;border:1px solid var(--line-soft);}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:11.5px;background:var(--stencil-tint);color:var(--stencil-deep);padding:3px 9px;border-radius:20px;font-weight:600;}

/* ---------- body diagram (richiesta preventivo) ---------- */
.body-pair{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
.body-frame{position:relative;background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);width:150px;overflow:hidden;touch-action:none;}
.body-frame img.body-bg{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none;}
.body-frame canvas.body-draw{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;}
.body-frame.mode-pin{cursor:crosshair;}
.body-label{text-align:center;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);padding:5px 0;border-top:1px solid var(--line-soft);text-transform:uppercase;letter-spacing:.04em;}
.body-pin{
  position:absolute;width:20px;height:20px;margin:-20px 0 0 -10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--stencil);color:#fff;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);font-family:var(--font-mono);font-size:9px;font-weight:700;
  box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer;
}
.body-pin span{transform:rotate(45deg);}
.gender-toggle{display:flex;gap:8px;margin-bottom:6px;}

/* ---------- richieste (lead) list ---------- */
.nav-badge{
  background:var(--flesh);color:#fff;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
  border-radius:20px;padding:1px 7px;margin-left:auto;
}
.lead-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line-soft);border-radius:var(--radius);background:var(--paper-raised);cursor:pointer;}
.lead-row + .lead-row{margin-top:8px;}
.lead-row:hover{border-color:var(--stencil);}
.lead-main{flex:1;min-width:0;}
.lead-main b{font-size:14.5px;}
.lead-main span{display:block;font-size:12px;color:var(--ink-faint);}
.wa-btn{
  all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  background:#25D366;color:#fff;padding:8px 12px;border-radius:var(--radius);font-size:12.5px;font-weight:600;
}
.wa-btn:hover{background:#1fb958;}
.lead-status{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:20px;border:1px solid currentColor;}
.lead-status.nuova{color:var(--flesh);}
.lead-status.contattato{color:var(--stencil);}
.lead-status.fissato{color:var(--ok);}
.lead-status.chiusa{color:var(--ink-faint);}

/* ---------- registro ---------- */
.reg-table{width:100%;border-collapse:collapse;font-size:13px;}
.reg-table th{text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:8px 10px;border-bottom:2px solid var(--line);}
.reg-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
.reg-table tr:last-child td{border-bottom:none;}
.reg-minor{font-family:var(--font-mono);font-size:9.5px;background:var(--flesh);color:#fff;padding:1px 5px;border-radius:10px;vertical-align:middle;}
.reg-note{margin-top:16px;font-size:12px;color:var(--ink-faint);line-height:1.5;}
.registro-head{margin-bottom:16px;font-size:13px;line-height:1.5;}

/* ---------- magazzino ---------- */
.inv-form{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;margin:14px 0;}
.inv-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.inv-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--radius);background:#fff;}
.inv-main{font-size:14px;}
.inv-sub{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:3px;}
.inv-actions{display:flex;gap:6px;flex:none;}
.inv-select-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:var(--radius);margin-bottom:6px;}
.inv-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;background:var(--stencil);color:#fff;font-size:12px;margin:3px 4px 0 0;}
.inv-chip button{all:unset;cursor:pointer;font-weight:700;opacity:.8;}

/* ---------- dispensa forniture ---------- */
.mag-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.mag-tab{all:unset;cursor:pointer;padding:9px 16px;border-radius:20px;font-size:13.5px;font-weight:500;background:var(--paper-raised);color:var(--ink-soft);border:1px solid var(--line-soft);}
.mag-tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.disp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.disp-stat{background:var(--ink);color:var(--paper);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:2px;}
.disp-stat span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#B9AFA4;font-family:var(--font-mono);}
.disp-stat b{font-size:26px;font-family:var(--font-display);line-height:1.1;}
.disp-stat small{font-size:10.5px;color:#8A8178;font-family:var(--font-mono);}
.disp-stat .warn-num{color:var(--flesh);}
.trend{font-size:14px;}
.trend-up{color:#E0725E;} .trend-down{color:#7FB77E;} .trend-flat{color:#B9AFA4;}
.disp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.disp-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;}
.disp-card-top{display:flex;gap:12px;align-items:center;}
.disp-thumb{width:56px;height:56px;border-radius:12px;background:var(--paper);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.disp-thumb.sm{width:44px;height:44px;}
.disp-thumb img{width:100%;height:100%;object-fit:contain;}
.disp-info{flex:1;min-width:0;}
.disp-name{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.2;}
.disp-cat{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);margin:1px 0 7px;}
.disp-qty-row{display:flex;align-items:center;gap:10px;}
.disp-qty{font-size:22px;font-family:var(--font-display);font-weight:700;color:var(--ink);min-width:24px;}
.disp-bar{flex:1;height:8px;border-radius:6px;background:var(--line);overflow:hidden;}
.disp-bar i{display:block;height:100%;border-radius:6px;transition:width .3s;}
.disp-bar .stk-top{background:#6FA96C;} .disp-bar .stk-ok{background:#8FBF6E;}
.disp-bar .stk-low{background:#E0A34E;} .disp-bar .stk-out{background:#D9574B;}
.disp-card-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.disp-mov{display:flex;gap:5px;align-items:center;}
.disp-step{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--paper);text-align:center;font-size:18px;line-height:30px;font-weight:600;}
.disp-step:active{opacity:.7;}
.disp-icon-btn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;background:var(--paper);color:var(--ink-soft);text-align:center;font-size:13px;line-height:30px;border:1px solid var(--line-soft);}
.disp-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:5px 10px;border-radius:20px;color:#fff;flex:none;}
.disp-badge.stk-top{background:#6FA96C;} .disp-badge.stk-ok{background:#8FBF6E;}
.disp-badge.stk-low{background:#E0A34E;} .disp-badge.stk-out{background:#D9574B;}
@media (max-width:600px){ .disp-summary{grid-template-columns:1fr;} }

/* ---------- premium gate ---------- */
.premium-card{max-width:560px;margin:20px auto;background:var(--ink);color:var(--paper);border-radius:calc(var(--radius) * 1.5);padding:36px 30px;text-align:center;position:relative;overflow:hidden;}
.premium-badge{position:absolute;top:18px;right:-34px;background:var(--flesh);color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;padding:5px 40px;transform:rotate(45deg);}
.premium-lock{font-size:44px;margin-bottom:12px;}
.premium-title{color:var(--paper);font-size:22px;margin:0 0 12px;}
.premium-desc{color:#C4BBB0;font-size:14px;line-height:1.6;margin:0 auto 22px;max-width:440px;}
.premium-features{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 auto 24px;max-width:440px;text-align:left;}
.pf{background:rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:8px;}
.pf span{font-size:18px;}
.premium-cta{background:rgba(201,143,108,.15);border:1px solid var(--flesh);border-radius:12px;padding:16px;margin-bottom:20px;}
.premium-cta p{margin:0;font-size:14px;line-height:1.5;}
.premium-unlock{border-top:1px solid rgba(255,255,255,.1);padding-top:18px;}
@media (max-width:600px){ .premium-features{grid-template-columns:1fr;} }
.only-print{display:none;}
@media print{
  .rail, .mobile-topbar, .no-print, .topbar button{display:none !important;}
  .main{padding:0 !important;}
  .card{border:none !important;box-shadow:none !important;padding:0 !important;}
  .only-print{display:block;}
  body{background:#fff !important;}
  .reg-table th{color:#000;}
}

/* ---------- lock screen ---------- */
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px;}
.lock-card{width:100%;max-width:320px;text-align:center;color:var(--paper);}
.lock-logo{width:96px;height:96px;margin:0 auto 20px;border-radius:22px;overflow:hidden;background:var(--paper-raised);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:logoIn .6s ease, breathe 3.5s ease-in-out infinite 0.6s;}

/* ---------- storage (localStorage, offline-first) ---------- */
const STORE_KEY = "inkconsent_sessions_v1";
function loadSessions(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function saveSessions(list){
  const clean = list.map(s => { const c = {...s}; delete c._diagImgs; return c; });
  localStorage.setItem(STORE_KEY, JSON.stringify(clean));
}
function upsertSession(session){
  const list = loadSessions();
  const i = list.findIndex(s => s.id === session.id);
  session.updatedAt = new Date().toISOString();
  if (i >= 0) list[i] = session; else list.unshift(session);
  saveSessions(list);
  maybeSyncToSupabase(session);
  return session;
}
function deleteSession(id){
  saveSessions(loadSessions().filter(s => s.id !== id));
}
function getSession(id){
  return loadSessions().find(s => s.id === id) || null;
}

/* Numero progressivo del registro, formato AAAA-NNNN, per anno solare.
   Assegnato UNA volta all'archiviazione e mai più cambiato. */
function assignProgressivo(session){
  if (session.progressivo) return session.progressivo; // già assegnato
  const year = new Date().getFullYear();
  const list = loadSessions();
  let max = 0;
  list.forEach(s => {
    if (s.progressivo && s.progressivo.startsWith(year + "-")){
      const n = parseInt(s.progressivo.split("-")[1], 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  session.progressivo = `${year}-${String(max + 1).padStart(4, "0")}`;
  return session.progressivo;
}

/* ---------- Supabase bridge (no-op until configured) ----------
   Pattern coerente con il data-sync-bridge già usato su
   InkAnimus_OS. Finché SUPABASE_CONFIG.url è vuoto, queste
   funzioni non fanno nulla: l'app resta 100% locale.
   Schema tabella suggerito in README.md.                      */
async function maybeSyncToSupabase(session){
  if (!SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return;
  try{
    await fetch(`${SUPABASE_CONFIG.url}/rest/v1/consents`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_CONFIG.anonKey,
        "Authorization": `Bearer ${SUPABASE_CONFIG.anonKey}`,
        "Prefer": "resolution=merge-duplicates",
      },
      body: JSON.stringify({ id: session.id, tenant_id: SUPABASE_CONFIG.tenantId, payload: session, status: session.status, updated_at: session.updatedAt }),
    });
  } catch(e){ console.warn("Sync Supabase fallita, resto locale:", e); }
}
async function fetchRemoteSession(sessionId){
  if (!SUPABASE_CONFIG.url || !SUPABASE_CONFIG.anonKey) return null;
  try{
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/consents?id=eq.${sessionId}&tenant_id=eq.${SUPABASE_CONFIG.tenantId}&select=payload`, {
      headers: { "apikey": SUPABASE_CONFIG.anonKey, "Authorization": `Bearer ${SUPABASE_CONFIG.anonKey}` },
    });
    const rows = await res.json();
    return rows && rows[0] ? rows[0].payload : null;
  } catch(e){ console.warn("Fetch remoto fallito:", e); return null; }
}

/* ============================================================
   AUTH — blocco accesso con codice, per proteggere i dati se il
   dispositivo viene perso. Il codice è salvato come hash SHA-256
   (non in chiaro). Questo blocca l'accesso all'interfaccia; per
   rendere i DATI illeggibili serve il backup cifrato (sotto).
   ============================================================ */
const AUTH_KEY = "inkconsent_auth_v1"; // { studioId, salt, hash }
async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function randomSalt(){
  return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2,"0")).join("");
}
function loadAuth(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e){ return null; } }
/* Genera un codice di recupero leggibile tipo INK-7K2P-9QX4-M3F8 */
function generateRecoveryCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // niente 0/O/1/I ambigui
  const grp = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
  return `INK-${grp()}-${grp()}-${grp()}`;
}
/* setAuth: se recoveryCode è fornito, ne salva l'hash accanto alle credenziali.
   Se non fornito (cambio password da impostazioni), mantiene quello esistente. */
async function setAuth(studioId, password, recoveryCode){
  const salt = randomSalt();
  const hash = await sha256(salt + ":" + password);
  const existing = loadAuth() || {};
  let recoveryHash = existing.recoveryHash || null;
  let recoverySalt = existing.recoverySalt || null;
  if (recoveryCode){
    recoverySalt = randomSalt();
    recoveryHash = await sha256(recoverySalt + ":" + recoveryCode.trim().toUpperCase());
  }
  localStorage.setItem(AUTH_KEY, JSON.stringify({ studioId, salt, hash, recoverySalt, recoveryHash }));
}
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
function authIsSet(){ const a = loadAuth(); return !!(a && a.hash); }
async function checkCredentials(studioId, password){
  const a = loadAuth();
  if (!a || !a.hash) return true;               // nessun blocco impostato
  const hash = await sha256((a.salt||"") + ":" + password);
  // ID case-insensitive, password esatta
  return hash === a.hash && (studioId||"").trim().toLowerCase() === (a.studioId||"").trim().toLowerCase();
}
/* Verifica il codice di recupero (per rientrare dopo password dimenticata) */
async function checkRecoveryCode(code){
  const a = loadAuth();
  if (!a || !a.recoveryHash || !a.recoverySalt) return false;
  const hash = await sha256(a.recoverySalt + ":" + (code||"").trim().toUpperCase());
  return hash === a.recoveryHash;
}
/* Reimposta solo la password mantenendo ID e codice di recupero */
async function resetPasswordKeepingRecovery(newPassword){
  const a = loadAuth(); if (!a) return;
  const salt = randomSalt();
  const hash = await sha256(salt + ":" + newPassword);
  localStorage.setItem(AUTH_KEY, JSON.stringify({ ...a, salt, hash }));
}
// compat: vecchi backup senza salt
async function checkPassword(password){
  const a = loadAuth();
  if (!a || !a.hash) return true;
  if (a.salt) return await sha256(a.salt + ":" + password) === a.hash;
  return await sha256(password) === a.hash; // hash legacy senza salt
}

/* ============================================================
   BACKUP / RIPRISTINO — esporta impostazioni + consensi + richieste
   in un unico file .json. Cifratura opzionale (AES-GCM, chiave da
   PBKDF2). Cifrato = illeggibile senza password anche se il file
   finisce in mani altrui, ma password persa = dati irrecuperabili.
   ============================================================ */
function collectBackup(){
  return {
    _app: "InkConsent",
    _version: 1,
    _exportedAt: new Date().toISOString(),
    studio: loadStudioOverrides(),
    auth: loadAuth(),
    sessions: loadSessions(),
    richieste: loadRichieste(),
    inks: loadInks(),
    needles: loadNeedles(),
    forniture: loadForniture(),
  };
}
async function deriveKey(password, salt){
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt","decrypt"]
  );
}
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

async function exportBackup(password){
  const payload = JSON.stringify(collectBackup());
  let out;
  if (password){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, new TextEncoder().encode(payload));
    out = JSON.stringify({ _app:"InkConsent", _encrypted:true, salt:b64(salt), iv:b64(iv), data:b64(ct) }, null, 2);
  } else {
    out = payload;
  }
  const blob = new Blob([out], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `inkconsent-backup-${stamp}${password ? "-cifrato" : ""}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importBackup(fileText, password){
  let obj = JSON.parse(fileText);
  if (obj._encrypted){
    if (!password) throw new Error("PASSWORD_REQUIRED");
    const key = await deriveKey(password, unb64(obj.salt));
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv: unb64(obj.iv) }, key, unb64(obj.data));
    } catch(e){ throw new Error("WRONG_PASSWORD"); }
    obj = JSON.parse(new TextDecoder().decode(plain));
  }
  if (obj._app !== "InkConsent") throw new Error("NOT_A_BACKUP");
  // ripristina tutto
  if (obj.studio) saveStudioOverrides(obj.studio);
  if (obj.auth) localStorage.setItem(AUTH_KEY, JSON.stringify(obj.auth));
  if (obj.sessions) saveSessions(obj.sessions);
  if (obj.richieste) saveRichieste(obj.richieste);
  if (obj.inks) saveInks(obj.inks);
  if (obj.needles) saveNeedles(obj.needles);
  if (obj.forniture) saveForniture(obj.forniture);
  return {
    sessions: (obj.sessions||[]).length,
    richieste: (obj.richieste||[]).length,
  };
}

function validateStep(step){
  const errs = [];
  if (step === 1){
    if (!draft.anagrafica.nome.trim()) errs.push("Inserisci il nome.");
    if (!draft.anagrafica.cognome.trim()) errs.push("Inserisci il cognome.");
    if (!draft.anagrafica.nascita) errs.push("Inserisci la data di nascita.");
    if (draft.minorenne){
      if (!draft.tutore1.nome.trim()) errs.push("Inserisci i dati di almeno un genitore/tutore.");
      if (!draft.documento.numero.trim()) errs.push("Inserisci gli estremi del documento del genitore/tutore firmatario.");
    }
  }
  if (step === 2){
    const unanswered = HEALTH_QUESTIONS.filter(q => !draft.sanitario[q.id]);
    if (unanswered.length) errs.push("Rispondi a tutte le domande del questionario sanitario.");
  }
  if (step === 3){
    if (draft.zonaMode === "sagoma"){
      if (!draft.markers.length && !(draft.strokes||[]).length) errs.push("Segna la zona sulla sagoma (con un punto o disegnando).");
    } else {
      if (!draft.zone.length && !draft.zonaLibera.trim()) errs.push("Indica la zona del corpo (seleziona o scrivi la zona).");
    }
    if (!draft.zoneNei) errs.push("Indica se l'area presenta nei.");
  }
  if (step === 4){
    if (!draft.informativaLetta) errs.push("Conferma di aver letto e compreso il modulo di consenso informato.");
  }
  if (step === 5){
    if (!draft.privacyConsenso) errs.push("Conferma il consenso al trattamento dei dati personali.");
    if (!draft.disegnoConfermato) errs.push("Conferma di aver visionato e approvato il disegno.");
  }
  if (step === 6){
    if (!draft.firmaClienteData) errs.push("È necessaria la firma del cliente per procedere.");
  }
  if (step === 7){
    if (!draft.seduta.dataApplicazione) errs.push("Inserisci la data effettiva dell'applicazione.");
  }
  if (step === 8){
    if (!draft.controfirmaData) errs.push("È necessaria la controfirma del tatuatore.");
  }
  return errs;
}

/* Disegno libero sulla sagoma: salva tracce come percentuali (indipendenti
   dalla dimensione del canvas) così si ridisegnano identiche a qualsiasi scala. */
function initBodyDrawing(cv){
  const ctx = cv.dataset.drawCtx;              // 'lead' | 'consenso'
  const view = cv.dataset.drawView;            // 'fronte' | 'retro'
  const obj = ctx === "lead" ? leadDraft : draft;
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = rect.width * dpr; cv.height = rect.height * dpr;
  const g = cv.getContext("2d");
  g.scale(dpr, dpr);
  g.lineWidth = 3; g.lineCap = "round"; g.lineJoin = "round";
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim() || "#5B3B63";
  g.strokeStyle = accent;

  function redraw(){
    g.clearRect(0,0,rect.width,rect.height);
    (obj.strokes||[]).filter(s => s.view === view).forEach(s => {
      g.beginPath();
      s.points.forEach((p,i) => {
        const x = p.xPct/100*rect.width, y = p.yPct/100*rect.height;
        if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
      });
      g.stroke();
    });
  }
  redraw();

  let drawing = false, cur = null;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { xPct: ((t.clientX-r.left)/r.width)*100, yPct: ((t.clientY-r.top)/r.height)*100 };
  };
  const start = (e) => { e.preventDefault(); drawing = true; cur = { view, points:[pos(e)] }; };
  const move = (e) => { if(!drawing) return; e.preventDefault(); cur.points.push(pos(e));
    const r = cv.getBoundingClientRect();
    g.beginPath();
    cur.points.forEach((p,i)=>{ const x=p.xPct/100*rect.width, y=p.yPct/100*rect.height; if(i===0)g.moveTo(x,y);else g.lineTo(x,y);});
    g.stroke();
  };
  const end = () => { if(!drawing) return; drawing=false; if(cur && cur.points.length>1){ obj.strokes = obj.strokes||[]; obj.strokes.push(cur);
    if (ctx === "consenso") upsertSession(draft); } cur=null; };
  cv.addEventListener("mousedown", start); cv.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
  cv.addEventListener("touchstart", start, {passive:false}); cv.addEventListener("touchmove", move, {passive:false}); cv.addEventListener("touchend", end);
}

/* ============================================================
   SIGNATURE PAD — canvas a mano libera, salvata come dataURL
   ============================================================ */
function initSignaturePad(canvas, targetField){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#1B1A19";

  const existing = draft[targetField];
  if (existing){
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = existing;
  }

  let drawing = false, lastX = 0, lastY = 0;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const start = (e) => { e.preventDefault(); drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; };
  const move = (e) => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  };
  const end = () => {
    if (!drawing) return;
    drawing = false;
    draft[targetField] = canvas.toDataURL("image/png");
    if (targetField === "firmaClienteData") draft.firmaClienteAt = new Date().toISOString();
    if (targetField === "firmaTutore2Data") draft.firmaTutore2At = new Date().toISOString();
    if (targetField === "controfirmaData") draft.controfirmaAt = new Date().toISOString();
    upsertSession(draft);
  };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

/* ============================================================
   PDF EXPORT — jsPDF, client-side, nessun backend richiesto
   ============================================================ */
/* Compone la sagoma (immagine) con pin e disegni in un'unica PNG dataURL,
   per includerla nel PDF. Async perché deve caricare l'immagine di sfondo. */
function renderDiagramToImage(sess, view){
  return new Promise((resolve) => {
    const hasMarks = (sess.markers||[]).some(m=>m.view===view);
    const hasDraw = (sess.strokes||[]).some(st=>st.view===view);
    if (!hasMarks && !hasDraw){ resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      const W = 300, H = 500;
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const g = cv.getContext("2d");
      g.fillStyle = "#ffffff"; g.fillRect(0,0,W,H);
      // fit image preserving aspect
      const ar = img.width/img.height, cvar = W/H;
      let dw=W, dh=H, dx=0, dy=0;
      if (ar > cvar){ dh = W/ar; dy = (H-dh)/2; } else { dw = H*ar; dx = (W-dw)/2; }
      g.drawImage(img, dx, dy, dw, dh);
      // strokes
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim() || "#5B3B63";
      g.strokeStyle = accent; g.lineWidth = 3; g.lineCap="round"; g.lineJoin="round";
      (sess.strokes||[]).filter(st=>st.view===view).forEach(st => {
        g.beginPath(); st.points.forEach((p,i)=>{ const x=p.xPct/100*W, y=p.yPct/100*H; if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}); g.stroke();
      });
      // pins
      (sess.markers||[]).filter(m=>m.view===view).forEach((m,i) => {
        const x=m.xPct/100*W, y=m.yPct/100*H;
        g.fillStyle = accent; g.beginPath(); g.arc(x,y,10,0,Math.PI*2); g.fill();
        g.fillStyle="#fff"; g.font="bold 12px sans-serif"; g.textAlign="center"; g.textBaseline="middle";
        g.fillText(String(i+1), x, y);
      });
      try { resolve(cv.toDataURL("image/png")); }
      catch(e){ console.warn("Diagramma non esportabile (canvas tainted):", e); resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.crossOrigin = "anonymous";
    img.src = bodyImg(sess.genere, view);
  });
}
async function attachDiagrams(sess){
  if (sess.zonaMode !== "sagoma") return;
  const [fronte, retro] = await Promise.all([
    renderDiagramToImage(sess, "fronte"),
    renderDiagramToImage(sess, "retro"),
  ]);
  sess._diagImgs = {};
  if (fronte) sess._diagImgs.fronte = fronte;
  if (retro) sess._diagImgs.retro = retro;
}

function buildPdf(s){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const PW = 595.28;                    // larghezza A4 in pt
  const M = 50;                          // margine
  const CW = PW - M*2;                   // larghezza contenuto
  const TOP = 54, BOTTOM = 760;
  let y = TOP;
  let pageNum = 1;

  // palette (dai colori studio, con fallback)
  const INK = "#1B1A19", SOFT = "#57514B", FAINT = "#8B837A";
  const cssAccent = getComputedStyle(document.documentElement).getPropertyValue("--stencil").trim();
  const ACCENT = /^#?[0-9a-fA-F]{6}$/.test(cssAccent.replace("#","")) ? (cssAccent.startsWith("#")?cssAccent:"#"+cssAccent) : "#5B3B63";
  const hexToRgb = (h) => { const n = parseInt(h.replace("#",""),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  const setFill = (h) => { const [r,g,b]=hexToRgb(h); doc.setFillColor(r,g,b); };
  const setText = (h) => { const [r,g,b]=hexToRgb(h); doc.setTextColor(r,g,b); };
  const setDraw = (h) => { const [r,g,b]=hexToRgb(h); doc.setDrawColor(r,g,b); };

  const footer = () => {
    setDraw("#DED7CC"); doc.setLineWidth(0.5); doc.line(M, BOTTOM+18, PW-M, BOTTOM+18);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); setText(FAINT);
    doc.text(`${STUDIO_CONFIG.studioName} · Documento generato con InkConsent · da conservare almeno ${STUDIO_CONFIG.retentionYears} anni`, M, BOTTOM+32);
    doc.text(`Pag. ${pageNum}`, PW-M, BOTTOM+32, { align: "right" });
  };
  const newPage = () => { footer(); doc.addPage(); pageNum++; y = TOP; };
  const ensure = (needed) => { if (y + needed > BOTTOM) newPage(); };

  // ---- intestazione con logo + riquadro registro ----
  const headerH = 66;
  // logo (se presente come dataURL)
  let tx = M;
  if (STUDIO_CONFIG.logoDataUrl){
    try { doc.addImage(STUDIO_CONFIG.logoDataUrl, "PNG", M, y, 46, 46); tx = M + 58; } catch(e){}
  }
  doc.setFont("helvetica","bold"); doc.setFontSize(16); setText(INK);
  doc.text(STUDIO_CONFIG.studioName, tx, y+18);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); setText(SOFT);
  doc.text(STUDIO_CONFIG.studioCity, tx, y+33);
  doc.setFontSize(10.5); setText(ACCENT); doc.setFont("helvetica","bold");
  doc.text(`Consenso informato · ${s.tipoApplicazione === "piercing" ? "Piercing" : "Tatuaggio"}`, tx, y+49);
  // riquadro numero registro a destra
  if (s.progressivo){
    const bw = 130, bh = 44, bx = PW - M - bw;
    setFill("#F5F1EB"); setDraw("#DED7CC"); doc.setLineWidth(0.8);
    doc.roundedRect(bx, y, bw, bh, 5, 5, "FD");
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); setText(FAINT);
    doc.text("N. REGISTRO", bx+12, y+16);
    doc.setFont("helvetica","bold"); doc.setFontSize(15); setText(INK);
    doc.text(s.progressivo, bx+12, y+34);
  }
  y += headerH;
  setDraw(ACCENT); doc.setLineWidth(1.6); doc.line(M, y, PW-M, y); y += 22;

  // ---- helpers di sezione ----
  const section = (txt) => {
    ensure(40);
    setFill("#F5F1EB"); doc.rect(M, y-2, CW, 22, "F");
    setFill(ACCENT); doc.rect(M, y-2, 4, 22, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); setText(INK);
    doc.text(txt.toUpperCase(), M+14, y+13);
    y += 32;
  };
  // riga etichetta/valore in due colonne
  const kv = (label, value, opts={}) => {
    const val = (value==null||value==="") ? "—" : String(value);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); setText(FAINT);
    const labelW = 150;
    const split = doc.splitTextToSize(val, CW - labelW - 6);
    const h = Math.max(13, split.length*12);
    ensure(h);
    doc.text(label, M, y+9);
    doc.setFontSize(10); setText(opts.color || INK);
    if (opts.bold) doc.setFont("helvetica","bold");
    doc.text(split, M+labelW, y+9);
    doc.setFont("helvetica","normal");
    y += h;
  };
  // paragrafo lungo
  const para = (txt, size=9.5, color=SOFT) => {
    doc.setFont("helvetica","normal"); doc.setFontSize(size); setText(color);
    const split = doc.splitTextToSize(txt, CW);
    ensure(split.length*13);
    doc.text(split, M, y+9); y += split.length*13 + 4;
  };

  // ---- DATI CLIENTE ----
  section("Dati del cliente");
  kv("Nome e cognome", `${s.anagrafica.cognome} ${s.anagrafica.nome}`, {bold:true});
  kv("Data di nascita", fmtDate(s.anagrafica.nascita));
  kv("Residenza", `${s.anagrafica.comuneResidenza || "—"} (${s.anagrafica.provinciaResidenza || "—"})`);
  kv("Codice fiscale", s.anagrafica.cf);
  kv("Telefono", s.anagrafica.telefono);
  kv("Email", s.anagrafica.email);
  y += 8;

  if (s.minorenne){
    section("Autorizzazione per il minore");
    kv("Genitore/tutore 1", s.tutore1.nome, {bold:true});
    kv("Nato/a il", `${fmtDate(s.tutore1.dataNascita)} a ${s.tutore1.luogoNascita || "—"} (${s.tutore1.provNascita || "—"})`);
    kv("Residente in", `${s.tutore1.comuneResidenza || "—"} (${s.tutore1.provResidenza || "—"}), ${s.tutore1.via || "—"} n. ${s.tutore1.numeroCivico || "—"}`);
    if (s.tutore2.nome){
      kv("Genitore/tutore 2", s.tutore2.nome, {bold:true});
      kv("Nato/a il", `${fmtDate(s.tutore2.dataNascita)} a ${s.tutore2.luogoNascita || "—"} (${s.tutore2.provNascita || "—"})`);
      kv("Residente in", `${s.tutore2.comuneResidenza || "—"} (${s.tutore2.provResidenza || "—"}), ${s.tutore2.via || "—"} n. ${s.tutore2.numeroCivico || "—"}`);
    }
    kv(`Documento (${s.documento.intestatario})`, `${s.documento.tipo || "—"} n. ${s.documento.numero || "—"}, ril. da ${s.documento.autorita || "—"} il ${fmtDate(s.documento.dataRilascio)}, scad. ${fmtDate(s.documento.dataScadenza)}`);
    y += 8;
  }

  // ---- QUESTIONARIO SANITARIO (due colonne) ----
  section("Questionario sanitario");
  doc.setFontSize(9);
  const colW = CW/2;
  let qi = 0;
  const startY = y;
  const half = Math.ceil(HEALTH_QUESTIONS.length/2);
  HEALTH_QUESTIONS.forEach((q, i) => {
    const col = i < half ? 0 : 1;
    const row = i < half ? i : i - half;
    if (col === 0 && i === half) {} // no-op
    const cx = M + col*colW;
    const cy = startY + row*15;
    if (cy + 15 > BOTTOM){ /* raro: lascia scorrere sotto */ }
    const ans = (s.sanitario[q.id]||"—").toUpperCase();
    setText(FAINT); doc.setFont("helvetica","normal");
    const qlabel = doc.splitTextToSize(q.label, colW - 44)[0];
    doc.text(qlabel, cx, cy+9);
    setText(ans==="SÌ"||ans==="SI" ? ACCENT : SOFT); doc.setFont("helvetica","bold");
    doc.text(ans, cx + colW - 40, cy+9);
    doc.setFont("helvetica","normal");
  });
  y = startY + half*15 + 6;
  if (s.sanitarioNote){ setText(SOFT); doc.setFont("helvetica","italic"); doc.setFontSize(9); para(`Note: ${s.sanitarioNote}`); doc.setFont("helvetica","normal"); }
  y += 8;

  // ---- ZONA E DISEGNO ----
  section("Zona e disegno");
  if (s.zonaMode === "sagoma"){
    kv("Modalità", `Sagoma anatomica (${s.genere})`);
    kv("Segni", `${(s.markers||[]).length} punto/i · ${(s.strokes||[]).length} disegno/i${s.zonaLibera ? " — " + s.zonaLibera : ""}`);
    if (s._diagImgs && (s._diagImgs.fronte || s._diagImgs.retro)){
      ensure(210);
      const imgW = 116, imgH = 194; let ix = M;
      setDraw("#DED7CC"); doc.setLineWidth(0.6);
      ["fronte","retro"].forEach(v => {
        if (s._diagImgs[v]){
          try {
            doc.roundedRect(ix-4, y-4, imgW+8, imgH+8, 4, 4, "S");
            doc.addImage(s._diagImgs[v], "PNG", ix, y, imgW, imgH);
            setText(FAINT); doc.setFontSize(8);
            doc.text(v === "fronte" ? "Fronte" : "Retro", ix, y+imgH+14);
          } catch(e){}
          ix += imgW + 24;
        }
      });
      y += imgH + 24;
    }
  } else {
    kv("Zona/e", `${s.zone.join(", ") || "—"}${s.zonaLibera ? " — " + s.zonaLibera : ""}`);
  }
  kv("Grandezza indicativa", s.grandezza);
  kv("Nei nell'area", s.zoneNei === "si" ? "Sì — " + (s.zoneNeiNote || "nessuna nota") : "No");
  y += 8;

  // ---- CONSENSO ----
  section(`Consenso informato · ${s.informativaVersion || ""}`);
  para("Il cliente dichiara di aver letto e compreso il Modulo di Consenso Informato, di aver fornito dichiarazioni veritiere, di impegnarsi a seguire le istruzioni di cura ed esonera l'esecutore e lo studio da responsabilità per i rischi illustrati.");
  kv("Trattamento dati (D.Lgs 196/2003)", s.privacyConsenso ? "Consenso prestato" : "Non prestato", {bold:true, color: s.privacyConsenso?ACCENT:INK});
  kv("Disegno visionato e approvato", s.disegnoConfermato ? "Sì" : "No", {bold:true});
  y += 8;

  // ---- DATI SEDUTA ----
  const sd = s.seduta || {};
  section("Dati della seduta (compilati in studio)");
  kv("Data applicazione", sd.dataApplicazione ? fmtDate(sd.dataApplicazione) : "—");
  kv("Zona trattata", sd.sedeEffettiva);
  if ((sd.inchiostri||[]).length){
    kv("Inchiostri usati", sd.inchiostri.map(it => `${it.nome||"—"}${it.colore?" ("+it.colore+")":""} · lotto ${it.lotto||"—"}${it.scadenza?" · scad. "+fmtDate(it.scadenza):""}`).join("\n"));
  } else kv("Inchiostri usati", "—");
  if ((sd.aghi||[]).length){
    kv("Aghi usati", sd.aghi.map(it => `${it.tipo||"—"}${it.marca?" ("+it.marca+")":""} · lotto ${it.lotto||"—"}${it.scadenza?" · scad. "+fmtDate(it.scadenza):""}`).join("\n"));
  } else kv("Aghi usati", "—");
  if (sd.materiali) kv("Note materiali", sd.materiali);
  kv("Scheda tecnica allegata", sd.schedaTecnicaAllegata ? "Sì" : "No");
  if (sd.reazioniAvverse) kv("Reazioni avverse", sd.reazioniAvverse);
  y += 10;

  // ---- FIRME (box incorniciati) ----
  const sigBox = (x, w, label, imgData, caption) => {
    const bh = 96;
    setDraw("#DED7CC"); doc.setLineWidth(0.8);
    doc.roundedRect(x, y, w, bh, 4, 4, "S");
    setText(FAINT); doc.setFont("helvetica","bold"); doc.setFontSize(7.5);
    doc.text(label.toUpperCase(), x+10, y+15);
    if (imgData){ try { doc.addImage(imgData, "PNG", x+10, y+20, w-20, 50); } catch(e){} }
    setDraw("#EAE4DA"); doc.setLineWidth(0.5); doc.line(x+10, y+76, x+w-10, y+76);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); setText(SOFT);
    doc.text(caption, x+10, y+88);
  };
  const twoSig = s.minorenne && s.firmaTutore2Data;
  ensure(twoSig ? 210 : 110);
  section("Firme");
  const halfW = (CW - 20) / 2;
  sigBox(M, halfW, s.minorenne ? "Genitore / tutore" : "Cliente", s.firmaClienteData, `Firmato il ${fmtDateTime(s.firmaClienteAt)}`);
  sigBox(M + halfW + 20, halfW, `Tatuatore · ${s.artista||""}`, s.controfirmaData, `Controfirmato il ${fmtDateTime(s.controfirmaAt)}`);
  y += 96 + 14;
  if (twoSig){
    sigBox(M, halfW, "Secondo genitore / tutore", s.firmaTutore2Data, `Firmato il ${fmtDateTime(s.firmaTutore2At)}`);
    y += 96 + 14;
  }

  footer();
  doc.save(`consenso-${s.anagrafica.cognome || "cliente"}-${s.progressivo || s.id.slice(-6)}.pdf`);
  delete s._diagImgs; // transiente: non salvare le immagini pesanti in localStorage
}

function validateLeadStep(step){
  const errs = [];
  if (step === 1){
    if (!leadDraft.cliente.nome.trim()) errs.push("Inserisci il nome.");
    if (!leadDraft.cliente.cognome.trim()) errs.push("Inserisci il cognome.");
    if (!leadDraft.cliente.telefono.trim()) errs.push("Inserisci un numero di telefono: è come ti contattiamo su WhatsApp.");
  }
  if (step === 2){
    if (!leadDraft.stile.length && !leadDraft.stileAltro.trim()) errs.push("Scegli almeno uno stile (o descrivilo in \"Altro\").");
    if (!leadDraft.descrizione.trim()) errs.push("Racconta in poche righe cosa hai in mente.");
  }
  if (step === 3){
    if (!leadDraft.markers.length && !(leadDraft.strokes||[]).length) errs.push("Segna la zona sulla sagoma (con un punto o disegnando).");
  }
  return errs;
}

   ============================================================ */
function resumeStep(s){
  if (!s.anagrafica.nome.trim()) return 1;
  if (Object.keys(s.sanitario).length < HEALTH_QUESTIONS.length) return 2;
  const zonaOk = s.zonaMode === "sagoma" ? s.markers.length : (s.zone.length || s.zonaLibera.trim());
  if (!zonaOk || !s.zoneNei) return 3;
  if (!s.informativaLetta) return 4;
  if (!s.privacyConsenso || !s.disegnoConfermato) return 5;
  if (!s.firmaClienteData) return 6;
  if (!s.seduta.dataApplicazione) return 7;
  return 8;
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  // --- tour di benvenuto ---
  if (action === "tour-next"){ state.tourStep = Math.min(TOUR_SLIDES.length-1, state.tourStep+1); render(); return; }
  else if (action === "tour-prev"){ state.tourStep = Math.max(0, state.tourStep-1); render(); return; }
  else if (action === "tour-toggle-dont"){ state.tourDontShow = !state.tourDontShow; return; }
  else if (action === "tour-skip" || action === "tour-finish"){
    if (state.tourDontShow) localStorage.setItem(TOUR_KEY, JSON.stringify({ dontShow: true }));
    state.showTour = false; state.tourStep = 0;
    // dopo il tour: se non c'è accesso, vai al setup; altrimenti blocca/entra
    if (!authIsSet()) state.needsSetup = true;
    else state.locked = true;
    render(); return;
  }

  // --- primo avvio: crea accesso ---
  if (action === "setup-create"){
    const b = state.setupBuffer || {};
    const id = (b.studioId||"").trim(), pw = b.pw||"", pw2 = b.pw2||"";
    if (id.length < 3){ state.loginError = "L'ID studio deve avere almeno 3 caratteri."; render(); return; }
    if (pw.length < 4){ state.loginError = "La password deve avere almeno 4 caratteri."; render(); return; }
    if (pw !== pw2){ state.loginError = "Le due password non coincidono."; render(); return; }
    // genera il codice di recupero e passa alla fase 2
    state.recoveryCode = generateRecoveryCode();
    setAuth(id, pw, state.recoveryCode).then(() => {
      state.setupPhase = "recovery"; state.recoverySaved = false; state.loginError = null;
      render();
    });
    return;
  }
  if (action === "copy-recovery"){
    if (navigator.clipboard) navigator.clipboard.writeText(state.recoveryCode||"").catch(()=>{});
    return;
  }
  if (action === "toggle-recovery-saved"){ state.recoverySaved = !state.recoverySaved; renderLockOnly(); return; }
  if (action === "setup-finish"){
    if (!state.recoverySaved){ state.loginError = "Conferma di aver annotato il codice prima di procedere."; render(); return; }
    state.needsSetup = false; state.setupPhase = null; state.locked = false;
    state.loginError = null; state.setupBuffer = {}; state.recoveryCode = null;
    render();
    return;
  }

  // --- login ID + password ---
  if (action === "login-submit"){
    checkCredentials(state.loginId, state.loginPw).then(ok => {
      if (ok){ state.locked = false; state.loginId = ""; state.loginPw = ""; state.loginError = null; render(); }
      else { state.loginError = "ID o password errati."; state.loginPw = ""; render(); }
    });
    return;
  }
  // --- recupero: mostra la schermata per inserire il codice ---
  if (action === "show-recovery"){ state.recoveryMode = true; state.loginError = null; state.recoveryInput = ""; render(); return; }
  if (action === "cancel-recovery"){ state.recoveryMode = false; state.recoveryReset = false; state.loginError = null; render(); return; }
  if (action === "recovery-submit"){
    checkRecoveryCode(state.recoveryInput).then(ok => {
      if (ok){ state.recoveryReset = true; state.loginError = null; render(); }
      else { state.loginError = "Codice di recupero non valido."; render(); }
    });
    return;
  }
  if (action === "recovery-reset-pw"){
    const pw = state.recoveryNewPw||"", pw2 = state.recoveryNewPw2||"";
    if (pw.length < 4){ state.loginError = "La password deve avere almeno 4 caratteri."; render(); return; }
    if (pw !== pw2){ state.loginError = "Le due password non coincidono."; render(); return; }
    resetPasswordKeepingRecovery(pw).then(() => {
      state.recoveryMode = false; state.recoveryReset = false; state.locked = false;
      state.loginError = null; state.recoveryInput = ""; state.recoveryNewPw = ""; state.recoveryNewPw2 = "";
      render();
    });
    return;
  }
  // --- ripristino da backup dalla schermata di login ---
  if (action === "login-restore-pick"){ const inp = qs("#login-restore-file"); if (inp) inp.click(); return; }

  if (action === "nav"){ state.view = btn.dataset.view; state.step = 1; state.showErrors = null; state.railOpen = false; state.studioSaved = false; state.authSaved = false; state.authError = null; state.backupMsg = null; render(); }
  else if (action === "new-session"){ draft = blankSession(); state.view = "form"; state.step = 1; state.showErrors = null; state.pdfWarning = false; state.railOpen = false; render(); }
  else if (action === "open-session"){ draft = getSession(btn.dataset.id); state.view = "form"; state.step = resumeStep(draft); state.showErrors = null; state.pdfWarning = false; state.railOpen = false; render(); }
  else if (action === "toggle-rail"){ state.railOpen = !state.railOpen; render(); }
  else if (action === "goto-step"){ upsertSession(draft); state.step = Number(btn.dataset.step); state.showErrors = null; render(); }
  else if (action === "next-step"){
    const errs = validateStep(state.step);
    if (errs.length){ state.showErrors = state.step; renderStepOnly(); return; }
    upsertSession(draft); state.step += 1; state.showErrors = null; render();
  }
  else if (action === "prev-step"){ state.step -= 1; state.showErrors = null; render(); }
  else if (action === "toggle-minorenne"){ draft.minorenne = !draft.minorenne; renderStepOnly(); }
  else if (action === "set-tipo"){ draft.tipoApplicazione = btn.dataset.v; renderStepOnly(); }
  else if (action === "toggle-informativa"){ draft.informativaLetta = !draft.informativaLetta; renderStepOnly(); }
  else if (action === "toggle-privacy"){ draft.privacyConsenso = !draft.privacyConsenso; renderStepOnly(); }
  else if (action === "toggle-disegno"){ draft.disegnoConfermato = !draft.disegnoConfermato; renderStepOnly(); }
  else if (action === "toggle-schedatecnica"){ draft.seduta.schedaTecnicaAllegata = !draft.seduta.schedaTecnicaAllegata; renderStepOnly(); }
  else if (action === "set-sanitario"){ draft.sanitario[btn.dataset.q] = btn.dataset.v; renderStepOnly(); }
  else if (action === "set-zonamode"){ draft.zonaMode = btn.dataset.v; renderStepOnly(); }
  else if (action === "set-genere-consenso"){ draft.genere = btn.dataset.g; draft.markers = []; draft.strokes = []; renderStepOnly(); }
  else if (action === "set-segnamode-consenso"){ draft.zonaSegnaMode = btn.dataset.m; renderStepOnly(); }
  else if (action === "clear-sagoma-consenso"){ draft.markers = []; draft.strokes = []; renderStepOnly(); }
  else if (action === "set-grandezza-consenso"){ draft.grandezza = btn.dataset.d; renderStepOnly(); }
  else if (action === "mark-body-consenso"){
    const rect = btn.getBoundingClientRect();
    const xPct = Math.max(2, Math.min(98, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(2, Math.min(98, ((e.clientY - rect.top) / rect.height) * 100));
    draft.markers.push({ view: btn.dataset.view, xPct, yPct });
    renderStepOnly();
  }
  else if (action === "remove-pin-consenso"){ draft.markers.splice(Number(btn.dataset.i), 1); renderStepOnly(); }
  else if (action === "toggle-zone"){
    const z = btn.dataset.z;

  else if (action === "submit-client"){

    if (!studioId || studioId.length < 3){ state.authError = "L'ID studio deve avere almeno 3 caratteri."; state.authSaved = false; render(); return; }
    if (!loadAuth() && !pw){ state.authError = "Inserisci una password per attivare il blocco."; state.authSaved = false; render(); return; }
    if (pw && pw.length < 4){ state.authError = "La password deve avere almeno 4 caratteri."; state.authSaved = false; render(); return; }
    const finalize = () => { state.authBuffer = null; state.authError = null; state.authSaved = true; render(); };
    if (pw){ setAuth(studioId, pw).then(finalize); }
    else { // solo cambio ID, password invariata
      const a = loadAuth(); a.studioId = studioId; localStorage.setItem(AUTH_KEY, JSON.stringify(a)); finalize();
    }
  }
  else if (action === "disable-auth"){

    if (state.cifraBackup && !pw){ state.backupMsg = "Inserisci una password per il backup cifrato."; state.backupMsgType = "warn"; render(); return; }
    const msg = state.cifraBackup
      ? "BACKUP CIFRATO\n\nIl file sarà illeggibile senza la password che hai scelto. Custodiscila: se la perdi, questo backup NON è recuperabile in alcun modo. Procedere?"
      : "BACKUP IN CHIARO\n\nIl file conterrà i dati dei clienti leggibili da chiunque lo apra. Conservalo in un luogo sicuro (non su servizi condivisi). Procedere?";
    if (!confirm(msg)) return;
    exportBackup(pw).then(() => {
      state.backupMsg = state.cifraBackup ? "Backup cifrato esportato." : "Backup esportato (non cifrato).";
      state.backupMsgType = "ok"; state.backupBuffer = null; render();
    }).catch(err => { state.backupMsg = "Errore durante l'export: " + err.message; state.backupMsgType = "warn"; render(); });
  }
  else if (action === "do-import-pick"){
    const inp = qs("#import-file");
    if (inp) inp.click();
  }
  else if (action === "reset-studio"){
    localStorage.removeItem(STUDIO_STORE_KEY);
    applyStudioConfig();
    state.studioBuffer = null; state.studioSaved = false;
    render();
  }
  else if (action === "open-lead"){ leadDraft = getRichiesta(btn.dataset.id); state.view = "lead-detail"; state.railOpen = false; render(); }
  else if (action === "set-lead-status"){ leadDraft.status = btn.dataset.v; upsertRichiesta(leadDraft); render(); }
  else if (action === "save-lead"){ upsertRichiesta(leadDraft); render(); }
  else if (action === "lead-to-consenso"){
    const s = blankSession();
    s.anagrafica.nome = leadDraft.cliente.nome;
    s.anagrafica.cognome = leadDraft.cliente.cognome;
    s.anagrafica.nascita = leadDraft.cliente.nascita;
    s.anagrafica.telefono = leadDraft.cliente.telefono;
    s.anagrafica.email = leadDraft.cliente.email;
    // porta con sé la zona segnata sul preventivo: usa direttamente la sagoma
    if ((leadDraft.markers && leadDraft.markers.length) || (leadDraft.strokes && leadDraft.strokes.length)){
      s.zonaMode = "sagoma";
      s.genere = leadDraft.genere;
      s.zonaSegnaMode = leadDraft.zonaSegnaMode || "pin";
      s.markers = (leadDraft.markers||[]).map(m => ({...m}));
      s.strokes = (leadDraft.strokes||[]).map(st => ({ view: st.view, points: st.points.map(p=>({...p})) }));
    }
    if (leadDraft.dimensione) s.grandezza = leadDraft.dimensione;
    upsertSession(s);
    leadDraft.status = "chiusa"; upsertRichiesta(leadDraft);
    draft = s; state.view = "form"; state.step = 1; state.showErrors = null;
    render();
  }
  // --- richiesta preventivo (client-facing lead intake) ---
  else if (action === "toggle-stile"){
    const st = btn.dataset.s;
    leadDraft.stile = leadDraft.stile.includes(st) ? leadDraft.stile.filter(x => x !== st) : [...leadDraft.stile, st];
    renderLeadStepOnly();
  }
  else if (action === "set-dimensione"){ leadDraft.dimensione = btn.dataset.d; renderLeadStepOnly(); }
  else if (action === "set-genere"){ leadDraft.genere = btn.dataset.g; leadDraft.markers = []; leadDraft.strokes = []; renderLeadStepOnly(); }
  else if (action === "set-segnamode"){ leadDraft.zonaSegnaMode = btn.dataset.m; renderLeadStepOnly(); }
  else if (action === "clear-sagoma"){ leadDraft.markers = []; leadDraft.strokes = []; renderLeadStepOnly(); }
  else if (action === "mark-body"){
    const rect = btn.getBoundingClientRect();
    const xPct = Math.max(2, Math.min(98, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(2, Math.min(98, ((e.clientY - rect.top) / rect.height) * 100));
    leadDraft.markers.push({ view: btn.dataset.view, xPct, yPct });
    renderLeadStepOnly();
  }
  else if (action === "remove-pin"){ leadDraft.markers.splice(Number(btn.dataset.i), 1); renderLeadStepOnly(); }
  else if (action === "lead-next"){
    const errs = validateLeadStep(state.leadStep);
    if (errs.length){ state.leadShowErrors = state.leadStep; renderLeadStepOnly(); return; }
    state.leadStep += 1; state.leadShowErrors = null; render();
  }
  else if (action === "lead-prev"){ state.leadStep -= 1; state.leadShowErrors = null; render(); }
  else if (action === "lead-submit"){
    const errs = validateLeadStep(3);
    if (errs.length){ state.leadStep = 3; state.leadShowErrors = 3; render(); return; }
    upsertRichiesta(leadDraft);
    notifyNewRichiesta(leadDraft);
    state.leadDone = true; render();
  }
});

document.addEventListener("change", (e) => {
  const field = e.target.dataset.field;
  if (field && draft) setField(field, e.target.value);
  const leadField = e.target.dataset.fieldLead;
  if (leadField && leadDraft) setLeadField(leadField, e.target.value);
  const studioField = e.target.dataset.fieldStudio;
  if (studioField){ state.studioBuffer = { ...(state.studioBuffer||{}), [studioField]: e.target.value }; }
  const authField = e.target.dataset.fieldAuth;
  if (authField){ state.authBuffer = { ...(state.authBuffer||{}), [authField]: e.target.value }; }
  const backupField = e.target.dataset.fieldBackup;
  if (backupField){ state.backupBuffer = { ...(state.backupBuffer||{}), [backupField]: e.target.value }; }
  const invField = e.target.dataset.invField;
  if (invField){ state.editBuffer = { ...(state.editBuffer||{}), [invField]: e.target.value }; }

  // selezione inchiostro/ago dall'archivio nello step seduta
  const selAction = e.target.dataset.action;
  if (selAction === "seduta-add-ink" && e.target.value && draft){
    const ink = loadInks().find(x => x.id === e.target.value);
    if (ink){ draft.seduta.inchiostri = [ ...(draft.seduta.inchiostri||[]), { id: ink.id, nome: ink.nome, colore: ink.colore, lotto: ink.lotto, scadenza: ink.scadenza } ]; upsertSession(draft); renderStepOnly(); }
    return;
  }
  if (selAction === "seduta-add-needle" && e.target.value && draft){
    const nd = loadNeedles().find(x => x.id === e.target.value);
    if (nd){ draft.seduta.aghi = [ ...(draft.seduta.aghi||[]), { id: nd.id, marca: nd.marca, tipo: nd.tipo, lotto: nd.lotto, scadenza: nd.scadenza } ]; upsertSession(draft); renderStepOnly(); }
    return;
  }
  if (e.target.id === "forn-photo" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; } else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        state.editBuffer = { ...(state.editBuffer||{}), foto: cv.toDataURL("image/jpeg", 0.82) };
        render();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  if (e.target.id === "logo-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // riduci a max 256px lato lungo per non appesantire localStorage
        const max = 256;
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; }
        else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL("image/png");
        state.studioBuffer = { ...(state.studioBuffer||{}), logoDataUrl: dataUrl };
        render();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  if (e.target.id === "login-restore-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      const doRestore = async (pw) => {
        const res = await importBackup(reader.result, pw);
        applyStudioConfig();
        state.locked = false; state.needsSetup = false; state.recoveryMode = false;
        state.loginError = null;
        state.backupMsg = `Ripristino riuscito: ${res.sessions} consensi. Ora sei dentro.`;
        render();
      };
      try { await doRestore(""); }
      catch(err){
        if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
          const pw = prompt("Questo backup è cifrato. Inserisci la password del backup:");
          if (pw == null) return;
          try { await doRestore(pw); }
          catch(e2){ state.loginError = e2.message === "WRONG_PASSWORD" ? "Password del backup errata." : "File non valido."; render(); }
        } else {
          state.loginError = err.message === "NOT_A_BACKUP" ? "Questo file non è un backup InkConsent." : "File non valido."; render();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
    return;
  }
  if (e.target.id === "import-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      let pw = "";
      // primo tentativo: se cifrato chiederà la password
      try {
        const res = await importBackup(reader.result, "");
        state.backupMsg = `Ripristinati ${res.sessions} consensi e ${res.richieste} richieste.`;
        state.backupMsgType = "ok";
        applyStudioConfig();
        if (loadAuth()) state.locked = false; // già dentro, non ri-bloccare ora
        render();
      } catch(err){
        if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
          pw = prompt("Questo backup è cifrato. Inserisci la password:");
          if (pw == null) return;
          try {
            const res = await importBackup(reader.result, pw);
            state.backupMsg = `Ripristinati ${res.sessions} consensi e ${res.richieste} richieste.`;
            state.backupMsgType = "ok";
            applyStudioConfig();
            render();
          } catch(err2){
            state.backupMsg = err2.message === "WRONG_PASSWORD" ? "Password errata: ripristino annullato." : "File non valido.";
            state.backupMsgType = "warn"; render();
          }
        } else {
          state.backupMsg = err.message === "NOT_A_BACKUP" ? "Questo file non è un backup InkConsent." : "File non valido.";
          state.backupMsgType = "warn"; render();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
});

async function initClientMode(){
  const sid = params.get("session");
  let s = sid ? getSession(sid) : null;
  if (!s && sid && SUPABASE_CONFIG.url){
    s = await fetchRemoteSession(sid);
  }
  draft = s || blankSession();
  state.step = 1;
  render();
}
function initRichiestaMode(){
  leadDraft = blankRichiesta();
  state.leadStep = 1;
  render();
}

applyStudioConfig();
if (state.mode === "studio"){
  const hasAuth = authIsSet();
  if (hasAuth){
    // sicurezza prima di tutto: se c'è un accesso, l'app parte bloccata.
    state.locked = true;
  } else if (!tourDismissed()){
    // primo utilizzo: tour, poi creazione accesso
    state.showTour = true;
  } else {
    state.needsSetup = true;
  }
}
if (state.mode === "client") initClientMode();
else if (state.mode === "richiesta") initRichiestaMode();
else render();

  window.addEventListener("load", () => {

/* ============================================================
   MULTI-STEP FORM — due fasi:
   • FASE CLIENTE (step 1-6): anagrafica → firma. Compilabile
     anche da remoto dal cliente.
   • FASE STUDIO (step 7-8): dati seduta + controfirma, compilati
     in studio il giorno dell'appuntamento davanti al cliente.
   ============================================================ */
const STEP_LABELS = ["Anagrafica","Sanitario","Zona","Rischi e consenso","Privacy e disegno","Firma cliente","Dati seduta","Controfirma"];

function renderStudioForm(){
  return `
  <div class="topbar">
    <div>
      <h1>${draft.anagrafica.nome || draft.anagrafica.cognome ? `${esc(draft.anagrafica.cognome)} ${esc(draft.anagrafica.nome)}` : "Nuovo consenso"}</h1>
      <p class="mono">#${draft.id.slice(-6)} · ${STATUS[draft.status].label}${draft.filledByClientRemotely ? " · compilato dal cliente" : ""}</p>
    </div>
    <button class="btn btn-ghost btn-sm" data-action="nav" data-view="archive">← Archivio</button>
  </div>
  <div class="main-inner">
    <div class="steps">
      ${STEP_LABELS.map((label,i) => {
        const n = i+1;
        const cls = n === state.step ? "on" : (n < state.step ? "done" : "");
        const phaseTick = n === CLIENT_LAST_STEP + 1 ? ' style="margin-left:10px;"' : "";
        return `<button class="step-pill ${cls}"${phaseTick} data-action="goto-step" data-step="${n}">${n}. ${label}${n === CLIENT_LAST_STEP+1 ? " 🖊" : ""}</button>`;
      }).join("")}
    </div>
    <p class="field hint" style="margin:-8px 0 16px;">Passi 1-6: parte del cliente (anche da remoto). Passi 7-8 🖊: da compilare in studio il giorno dell'appuntamento.</p>
    <div class="card" id="step-content">${renderStepBody(state.step, "studio")}</div>
  </div>`;
}

function renderClientShell(){
  if (!draft) draft = getSession(params.get("session")) || blankSession();
  const total = CLIENT_LAST_STEP; // il cliente compila fino alla propria firma
  if (draft.status === "attesa" || draft.status === "firmato" || draft.status === "archiviato"){
    return renderClientDone();
  }
  return `
  <div class="client-shell">
    <div class="client-head">
      <div class="rail-brand">
        <div class="rail-mark">${markHtml()}</div>
        <div>
          <div class="rail-brand-name" style="color:var(--paper);">${esc(STUDIO_CONFIG.studioName)}</div>
          <div class="rail-brand-sub">Consenso informato · passo ${state.step} di ${total}</div>
        </div>
      </div>
      <div class="progress-track">
        ${Array.from({length: total}).map((_,i) => `<div class="progress-dash"><i style="width:${i < state.step ? 100 : (i === state.step-1 ? 100 : 0)}%"></i></div>`).join("")}
      </div>
    </div>
    <div class="client-body">
      <div class="card" id="step-content">${renderStepBody(state.step, "client")}</div>
    </div>
  </div>`;
}
function renderClientDone(){
  return `
  <div class="client-shell">
    <div class="client-body" style="padding-top:60px;text-align:center;">
      <div class="rail-mark" style="width:56px;height:56px;font-size:22px;margin:0 auto 18px;">${markHtml()}</div>
      <h2>Fatto — grazie${draft.anagrafica.nome ? ", " + esc(draft.anagrafica.nome) : ""}</h2>
      <p class="section-desc">Il modulo è arrivato allo studio. Il tatuatore lo controfirmerà con te al momento dell'appuntamento — non devi fare altro.</p>
      <span class="stamp ${STATUS[draft.status].cls}">${STATUS[draft.status].label}</span>
    </div>
  </div>`;
}

function renderStepBody(step, ctx){
  if (step === 1) return renderStepAnagrafica(ctx);
  if (step === 2) return renderStepSanitario(ctx);
  if (step === 3) return renderStepZona(ctx);
  if (step === 4) return renderStepInformativa(ctx);
  if (step === 5) return renderStepPrivacyDisegno(ctx);
  if (step === 6) return renderStepFirma(ctx);
  if (step === 7) return renderStepSeduta(ctx);
  if (step === 8) return renderStepControfirma(ctx);
  return "";
}

function renderErrors(step){
  const errs = state.showErrors === step ? validateStep(step) : [];
  if (!errs.length) return "";
  return `<div class="callout warn" style="margin-bottom:18px;">${errs.map(esc).join("<br>")}</div>`;
}

function renderStepSanitario(ctx){
  const siCount = HEALTH_QUESTIONS.filter(q => draft.sanitario[q.id] === 'si').length;
  return `
  ${renderErrors(2)}
  <h3 class="section-title">Questionario sanitario</h3>
  <p class="section-desc">Nelle condizioni sotto riportate non è possibile eseguire alcun tatuaggio. Rispondi con sincerità.</p>
  ${HEALTH_QUESTIONS.map(q => {
    const val = draft.sanitario[q.id];
    return `<div class="check-row" style="align-items:center;">
      <div class="ct" style="flex:1;">${esc(q.label)}</div>
      <div style="display:flex;gap:6px;">
        <button class="chip ${val==='si'?'on':''}" data-action="set-sanitario" data-q="${q.id}" data-v="si" style="min-width:52px;">Sì</button>
        <button class="chip ${val==='no'?'on':''}" data-action="set-sanitario" data-q="${q.id}" data-v="no" style="min-width:52px;">No</button>
      </div>
    </div>`;
  }).join("")}
  ${siCount > 0 ? `<div class="callout warn" style="margin-top:16px;">${siCount} risposta/e affermativa/e: secondo il modulo dello studio, in queste condizioni non è possibile eseguire il tatuaggio. Valutare con il cliente prima di proseguire.</div>` : ""}
  <div class="field" style="margin-top:16px;">
    <label>Note aggiuntive (facoltativo)</label>
    <textarea data-field="sanitarioNote" placeholder="Dettagli su eventuali risposte affermative…">${esc(draft.sanitarioNote)}</textarea>
  </div>
  ${renderFormNav(2, ctx)}`;
}
