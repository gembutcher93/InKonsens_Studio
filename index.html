function resumeStep(s){
  if (!s.anagrafica.nome.trim()) return 1;
  if (Object.keys(s.sanitario).length < HEALTH_QUESTIONS.length) return 2;
  const zonaOk = s.zonaMode === "sagoma" ? s.markers.length : (s.zone.length || s.zonaLibera.trim());
  if (!zonaOk || !s.zoneNei) return 3;
  if (!s.informativaLetta) return 4;
  if (!s.privacyConsenso || !s.disegnoConfermato) return 5;
  if (!s.firmaClienteData) return 6;
  if (!s.seduta.dataApplicazione) return 7;
  return 8;
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;

  // --- tour di benvenuto ---
  if (action === "tour-next"){ state.tourStep = Math.min(TOUR_SLIDES.length-1, state.tourStep+1); render(); return; }
  else if (action === "tour-prev"){ state.tourStep = Math.max(0, state.tourStep-1); render(); return; }
  else if (action === "tour-toggle-dont"){ state.tourDontShow = !state.tourDontShow; return; }
  else if (action === "tour-skip" || action === "tour-finish"){
    if (state.tourDontShow) localStorage.setItem(TOUR_KEY, JSON.stringify({ dontShow: true }));
    state.showTour = false; state.tourStep = 0;
    // dopo il tour: condizioni, poi accesso
    if (!termsAccepted()) state.needsTerms = true;
    else if (!authIsSet()) state.needsSetup = true;
    else state.locked = true;
    render(); return;
  }
  else if (action === "terms-check"){
    const k = btn.dataset.k || (e.target && e.target.dataset.k);
    if (k){ state.termsChecks = { ...(state.termsChecks||{}), [k]: !(state.termsChecks||{})[k] }; state.loginError = null; render(); }
    return;
  }
  else if (action === "terms-accept"){
    const c = state.termsChecks || {};
    if (!(c.uso && c.dati && c.assistenza)){
      state.loginError = "Servono tutte e tre le spunte per continuare.";
      render(); return;
    }
    saveTermsAccepted();
    state.needsTerms = false; state.loginError = null;
    if (!authIsSet()) state.needsSetup = true; else state.locked = true;
    render(); return;
  }

  // --- primo avvio: crea accesso ---
  if (action === "setup-create"){
    const b = state.setupBuffer || {};
    const id = (b.studioId||"").trim(), pw = b.pw||"", pw2 = b.pw2||"";
    if (id.length < 3){ state.loginError = "L'ID studio deve avere almeno 3 caratteri."; render(); return; }
    if (pw.length < 4){ state.loginError = "La password deve avere almeno 4 caratteri."; render(); return; }
    if (pw !== pw2){ state.loginError = "Le due password non coincidono."; render(); return; }
    // crea la cassaforte e passa alla fase 2: le 12 parole
    state.loginError = null;
    (async () => {
      try {
        await setAuth(id, pw, null);
        state.recoveryPhrase = await creaCassaforteEMigra(pw);
        chiediPersistenza();
        state.setupPhase = "recovery"; state.recoverySaved = false;
      } catch(e){
        console.error(e);
        state.loginError = "Non sono riuscito a creare la cassaforte su questo browser.";
      }
      render();
    })();
    return;
  }
  if (action === "copy-recovery"){
    if (navigator.clipboard) navigator.clipboard.writeText(state.recoveryPhrase||"").catch(()=>{});
    return;
  }
  if (action === "toggle-recovery-saved"){ state.recoverySaved = !state.recoverySaved; renderLockOnly(); return; }
  if (action === "setup-finish"){
    if (!state.recoverySaved){ state.loginError = "Conferma di aver trascritto le 12 parole prima di procedere."; render(); return; }
    state.needsSetup = false; state.setupPhase = null; state.locked = false;
    state.loginError = null; state.setupBuffer = {}; state.recoveryPhrase = null;
    render();
    return;
  }

  // --- login ID + password ---
  if (action === "login-submit"){
    const pw = state.loginPw;
    (async () => {
      const a = loadAuth() || {};
      const idOk = !a.studioId || (state.loginId||"").trim().toLowerCase() === (a.studioId||"").trim().toLowerCase();
      if (!idOk){ state.loginError = "ID o password errati."; state.loginPw = ""; render(); return; }
      try {
        if (vaultEsiste()){
          /* La verita' e' una sola: la password buona e' quella che apre la
             cassaforte. L'hash salvato non decide piu' niente, altrimenti dopo
             uno sblocco dell'assistenza le due cose si contraddicono e non
             entri piu' con nessuna delle due password. */
          const vault = loadVault();
          let dek;
          try { dek = await apriConPassword(vault, pw); }
          catch(e){ state.loginError = "ID o password errati."; state.loginPw = ""; render(); return; }
          await apriArchivio(dek);
          await setAuth(a.studioId || state.loginId || "studio", pw, null);  // riallinea l'hash
          if (vault.daRinnovare){                          // rientro con password provvisoria
            state.recoveryMode = true; state.recoveryReset = true;
            state.loginId = ""; state.loginPw = ""; state.loginError = null;
            render(); return;
          }
        } else {
          const ok = await checkCredentials(state.loginId, pw);
          if (!ok){ state.loginError = "ID o password errati."; state.loginPw = ""; render(); return; }
          // installazione precedente: creo ora la cassaforte e ricifro
          state.recoveryPhrase = await creaCassaforteEMigra(pw);
          state.setupPhase = "recovery"; state.recoverySaved = false; state.needsSetup = true;
          state.loginId = ""; state.loginPw = ""; state.loginError = null;
          render(); return;
        }
      } catch(e){
        console.error(e);
        state.loginError = "Password corretta ma l'archivio non si apre. Usa le 12 parole.";
        state.loginPw = ""; render(); return;
      }
      state.locked = false; state.loginId = ""; state.loginPw = ""; state.loginError = null;
      render();
    })();
    return;
  }
  // --- recupero: mostra la schermata per inserire il codice ---
  if (action === "show-recovery"){ state.recoveryMode = true; state.loginError = null; state.recoveryOk = null; state.recoveryInput = ""; render(); return; }
  if (action === "cancel-recovery"){ state.recoveryMode = false; state.recoveryReset = false; state.loginError = null; state.recoveryOk = null; render(); return; }

  if (action === "recovery-submit"){
    (async () => {
      const vault = loadVault();
      if (!vault){ state.loginError = "Su questo dispositivo non c'è nessuna cassaforte."; render(); return; }
      const frase = state.recoveryInput || "";
      if (!(await fraseValida(frase))){
        state.loginError = "Le parole non tornano: controlla l'ordine e che siano esattamente 12.";
        render(); return;
      }
      try {
        const dek = await apriConFrase(vault, frase);
        await apriArchivio(dek);
        state.recoveryReset = true; state.loginError = null; state.recoveryInput = "";
      } catch(e){
        state.loginError = "La frase è scritta bene ma non apre questo archivio.";
      }
      render();
    })();
    return;
  }

  if (action === "recovery-reset-pw"){
    const pw = state.recoveryNewPw||"", pw2 = state.recoveryNewPw2||"";
    if (pw.length < 4){ state.loginError = "La password deve avere almeno 4 caratteri."; render(); return; }
    if (pw !== pw2){ state.loginError = "Le due password non coincidono."; render(); return; }
    if (!DEK){ state.loginError = "Chiave non disponibile: rifai il recupero."; render(); return; }
    (async () => {
      const a = loadAuth() || {};
      const vault = loadVault();
      await rifaiBustaPassword(vault, DEK, pw);   // cambia la serratura, non ricifra l'archivio
      delete vault.daRinnovare;
      saveVault(vault);
      await setAuth(a.studioId || "studio", pw, null);
      state.recoveryMode = false; state.recoveryReset = false; state.locked = false;
      state.loginError = null; state.recoveryNewPw = ""; state.recoveryNewPw2 = "";
      render();
    })();
    return;
  }

  /* ---- scambio file con l'assistenza ---- */
  if (action === "ickey-export"){
    const vault = loadVault();
    if (!vault){ state.loginError = "Non c'è nessuna cassaforte da recuperare."; render(); return; }
    const a = loadAuth() || {};
    if (!confirm("Sto per creare il file di sblocco.\n\nContiene SOLO le serrature dell'archivio: nessun dato dei tuoi clienti.\nMandami solo questo file, nient'altro. Verrà cancellato entro 24 ore.\n\nProcedo?")) return;
    scaricaFile("recupero-" + (a.studioId || "studio") + ".ickey", JSON.stringify(vault, null, 2));
    state.recoveryOk = "File scaricato. Mandami solo questo: non serve altro, e altro non devi mandarmelo.";
    state.loginError = null; render(); return;
  }
  if (action === "ickey-import-pick"){ const i = qs("#ickey-file"); if (i) i.click(); return; }
  // --- ripristino da backup dalla schermata di login ---
  if (action === "login-restore-pick"){ const inp = qs("#login-restore-file"); if (inp) inp.click(); return; }

  if (action === "nav"){ state.view = btn.dataset.view; state.step = 1; state.showErrors = null; state.railOpen = false; state.studioSaved = false; state.authSaved = false; state.authError = null; state.backupMsg = null; render(); }
  else if (action === "new-session"){ draft = blankSession(); state.view = "form"; state.step = 1; state.showErrors = null; state.pdfWarning = false; state.railOpen = false; render(); }
  else if (action === "open-session"){ draft = getSession(btn.dataset.id); state.view = "form"; state.step = resumeStep(draft); state.showErrors = null; state.pdfWarning = false; state.railOpen = false; render(); }
  else if (action === "toggle-rail"){ state.railOpen = !state.railOpen; render(); }
  else if (action === "goto-step"){ upsertSession(draft); state.step = Number(btn.dataset.step); state.showErrors = null; render(); }
  else if (action === "next-step"){
    const errs = validateStep(state.step);
    if (errs.length){ state.showErrors = state.step; renderStepOnly(); return; }
    upsertSession(draft); state.step += 1; state.showErrors = null; render();
  }
  else if (action === "prev-step"){ state.step -= 1; state.showErrors = null; render(); }
  else if (action === "toggle-minorenne"){ draft.minorenne = !draft.minorenne; renderStepOnly(); }
  else if (action === "set-tipo"){ draft.tipoApplicazione = btn.dataset.v; renderStepOnly(); }
  else if (action === "toggle-informativa"){ draft.informativaLetta = !draft.informativaLetta; renderStepOnly(); }
  else if (action === "toggle-privacy"){ draft.privacyConsenso = !draft.privacyConsenso; renderStepOnly(); }
  else if (action === "toggle-disegno"){ draft.disegnoConfermato = !draft.disegnoConfermato; renderStepOnly(); }
  else if (action === "toggle-schedatecnica"){ draft.seduta.schedaTecnicaAllegata = !draft.seduta.schedaTecnicaAllegata; renderStepOnly(); }
  else if (action === "set-sanitario"){ draft.sanitario[btn.dataset.q] = btn.dataset.v; renderStepOnly(); }
  else if (action === "set-zonamode"){ draft.zonaMode = btn.dataset.v; renderStepOnly(); }
  else if (action === "set-genere-consenso"){ draft.genere = btn.dataset.g; draft.markers = []; draft.strokes = []; renderStepOnly(); }
  else if (action === "set-segnamode-consenso"){ draft.zonaSegnaMode = btn.dataset.m; renderStepOnly(); }
  else if (action === "clear-sagoma-consenso"){ draft.markers = []; draft.strokes = []; renderStepOnly(); }
  else if (action === "set-grandezza-consenso"){ draft.grandezza = btn.dataset.d; renderStepOnly(); }
  else if (action === "mark-body-consenso"){
    const rect = btn.getBoundingClientRect();
    const xPct = Math.max(2, Math.min(98, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.max(2, Math.min(98, ((e.clientY - rect.top) / rect.height) * 100));
    draft.markers.push({ view: btn.dataset.view, xPct, yPct });
    renderStepOnly();
  }
  else if (action === "remove-pin-consenso"){ draft.markers.splice(Number(btn.dataset.i), 1); renderStepOnly(); }
  else if (action === "toggle-zone"){
    const z = btn.dataset.z;
    draft.zone = draft.zone.includes(z) ? draft.zone.filter(x => x !== z) : [...draft.zone, z];
    renderStepOnly();
  }
  else if (action === "set-zonenei"){ draft.zoneNei = btn.dataset.v; renderStepOnly(); }
  else if (action === "clear-sig"){
    const t = btn.dataset.target; draft[t] = null;
    if (t === "firmaClienteData") draft.firmaClienteAt = null;
    else if (t === "firmaTutore2Data") draft.firmaTutore2At = null;
    else draft.controfirmaAt = null;
    renderStepOnly();
  }

    if (!confirm(msg)) return;
    exportBackup(pw).then(() => {
      state.backupMsg = state.cifraBackup ? "Backup cifrato esportato." : "Backup esportato (non cifrato).";
      state.backupMsgType = "ok"; state.backupBuffer = null; render();
    }).catch(err => { state.backupMsg = "Errore durante l'export: " + err.message; state.backupMsgType = "warn"; render(); });

  else if (action === "lead-to-consenso"){

    s.anagrafica.nascita = leadDraft.cliente.nascita;
    s.anagrafica.telefono = leadDraft.cliente.telefono;
    s.anagrafica.email = leadDraft.cliente.email;

    if ((leadDraft.markers && leadDraft.markers.length) || (leadDraft.strokes && leadDraft.strokes.length)){
      s.zonaMode = "sagoma";
      s.genere = leadDraft.genere;

      s.markers = (leadDraft.markers||[]).map(m => ({...m}));
      s.strokes = (leadDraft.strokes||[]).map(st => ({ view: st.view, points: st.points.map(p=>({...p})) }));

  else if (action === "set-segnamode"){ leadDraft.zonaSegnaMode = btn.dataset.m; renderLeadStepOnly(); }

  else if (action === "lead-submit"){
    const errs = validateLeadStep(3);
    if (errs.length){ state.leadStep = 3; state.leadShowErrors = 3; render(); return; }
    upsertRichiesta(leadDraft);

    state.leadDone = true; render();
  }

document.addEventListener("change", (e) => {
  const field = e.target.dataset.field;
  if (field && draft) setField(field, e.target.value);
  const leadField = e.target.dataset.fieldLead;
  if (leadField && leadDraft) setLeadField(leadField, e.target.value);
  const studioField = e.target.dataset.fieldStudio;
  if (studioField){
    state.studioBuffer = { ...(state.studioBuffer||{}), [studioField]: e.target.value };
    if (studioField === "regione"){ applyStudioConfig(); state.studioSaved = false; render(); return; }
  }
  const authField = e.target.dataset.fieldAuth;
  if (authField){ state.authBuffer = { ...(state.authBuffer||{}), [authField]: e.target.value }; }
  const backupField = e.target.dataset.fieldBackup;
  if (backupField){ state.backupBuffer = { ...(state.backupBuffer||{}), [backupField]: e.target.value }; }
  const invField = e.target.dataset.invField;
  if (invField){ state.editBuffer = { ...(state.editBuffer||{}), [invField]: e.target.value }; }

  // selezione inchiostro/ago dall'archivio nello step seduta
  const selAction = e.target.dataset.action;
  if (selAction === "seduta-add-ink" && e.target.value && draft){
    const ink = loadInks().find(x => x.id === e.target.value);
    if (ink){ draft.seduta.inchiostri = [ ...(draft.seduta.inchiostri||[]), { id: ink.id, nome: ink.nome, colore: ink.colore, lotto: ink.lotto, scadenza: ink.scadenza } ]; upsertSession(draft); renderStepOnly(); }
    return;
  }
  if (selAction === "seduta-add-needle" && e.target.value && draft){
    const nd = loadNeedles().find(x => x.id === e.target.value);
    if (nd){ draft.seduta.aghi = [ ...(draft.seduta.aghi||[]), { id: nd.id, marca: nd.marca, tipo: nd.tipo, lotto: nd.lotto, scadenza: nd.scadenza } ]; upsertSession(draft); renderStepOnly(); }
    return;
  }
  if (e.target.id === "forn-photo" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; } else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        state.editBuffer = { ...(state.editBuffer||{}), foto: cv.toDataURL("image/jpeg", 0.82) };
        render();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  if (e.target.id === "logo-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // riduci a max 256px lato lungo per non appesantire localStorage
        const max = 256;
        let w = img.width, h = img.height;
        if (w > h && w > max){ h = h*max/w; w = max; }
        else if (h >= w && h > max){ w = w*max/h; h = max; }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL("image/png");
        state.studioBuffer = { ...(state.studioBuffer||{}), logoDataUrl: dataUrl };
        render();
      };
      img.onerror = () => alert("Immagine non valida.");
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    return;
  }
  /* risposta dell'assistenza: sostituisce solo la busta della password.
     Le altre due (frase e assistenza) restano quelle di prima. */
  if (e.target.id === "ickey-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    (async () => {
      try {
        const blocco = JSON.parse(await leggiFileTesto(file));
        if (!blocco.bustaPw || !blocco.saltPw) throw new Error("formato");
        const vault = loadVault() || {};
        saveVault({ ...vault, saltPw: blocco.saltPw, bustaPw: blocco.bustaPw, daRinnovare: true });
        state.recoveryMode = false; state.recoveryReset = false;
        state.loginError = null;
        state.backupMsg = "Sbloccato. Entra con l'ID studio e la password provvisoria che ti ho dato.";
      } catch(err){
        state.loginError = "Questo non è il file che ti ho rimandato io. Controlla di aver scelto quello giusto.";
      }
      e.target.value = "";
      render();
    })();
    return;
  }
  if (e.target.id === "login-restore-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      const doRestore = async (pw, frase) => {
        const res = await importBackup(reader.result, pw, frase);
        applyStudioConfig();
        state.locked = false; state.needsSetup = false; state.recoveryMode = false;
        state.loginError = null;
        state.backupMsg = `Ripristino riuscito: ${res.sessions} consensi. Ora sei dentro.`;
        render();
      };
      try { await doRestore(""); }
      catch(err){
        if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
          const pw = prompt("Questo backup è cifrato. Inserisci la password del backup.\n\nSe non la ricordi lascia vuoto e premi OK: ti chiedo le 12 parole.");
          if (pw == null) return;
          if (pw.trim()){
            try { await doRestore(pw); return; }
            catch(e2){
              if (e2.message !== "WRONG_PASSWORD"){ state.loginError = "File non valido."; render(); return; }
            }
          }
          const frase = prompt("Scrivi le 12 parole di recupero, separate da uno spazio:");
          if (frase == null) return;
          try { await doRestore("", frase); }
          catch(e3){
            state.loginError = (e3.message === "WRONG_PHRASE" || e3.message === "PASSWORD_REQUIRED")
              ? "Né la password né le 12 parole aprono questo backup."
              : "File non valido.";
            render();
          }
        } else {
          state.loginError = err.message === "NOT_A_BACKUP" ? "Questo file non è un backup InkConsent." : "File non valido."; render();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
    return;
  }
  if (e.target.id === "import-file" && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      let pw = "";
      // primo tentativo: se cifrato chiederà la password
      try {
        const res = await importBackup(reader.result, "");
        state.backupMsg = `Ripristinati ${res.sessions} consensi e ${res.richieste} richieste.`;
        state.backupMsgType = "ok";
        applyStudioConfig();
        if (loadAuth()) state.locked = false; // già dentro, non ri-bloccare ora
        render();
      } catch(err){
        if (err.message === "PASSWORD_REQUIRED" || err.message === "WRONG_PASSWORD"){
          pw = prompt("Questo backup è cifrato. Inserisci la password:");
          if (pw == null) return;
          try {
            const res = await importBackup(reader.result, pw);
            state.backupMsg = `Ripristinati ${res.sessions} consensi e ${res.richieste} richieste.`;
            state.backupMsgType = "ok";
            applyStudioConfig();
            render();
          } catch(err2){
            state.backupMsg = err2.message === "WRONG_PASSWORD" ? "Password errata: ripristino annullato." : "File non valido.";
            state.backupMsgType = "warn"; render();
          }
        } else {
          state.backupMsg = err.message === "NOT_A_BACKUP" ? "Questo file non è un backup InkConsent." : "File non valido.";
          state.backupMsgType = "warn"; render();
        }
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }
});

/* ============================================================
   BOOTSTRAP
   ============================================================ */
async function initClientMode(){
  const sid = params.get("session");
  let s = sid ? getSession(sid) : null;
  if (!s && sid && SUPABASE_CONFIG.url){
    s = await fetchRemoteSession(sid);
  }
  draft = s || blankSession();
  state.step = 1;
  render();
}
function initRichiestaMode(){
  leadDraft = blankRichiesta();
  state.leadStep = 1;
  render();
}

/* Il boot ora aspetta l'idratazione da IndexedDB: senza, il primo
   render leggerebbe un archivio vuoto e sembrerebbe che i consensi
   siano spariti.                                                   */
(async function boot(){
  applyStudioConfig();
  await caricaModuliEsterni();   // testi aggiornabili senza ripubblicare l'app
  if (state.mode === "studio"){
    if (authIsSet()){
      // sicurezza prima di tutto: se c'è un accesso, l'app parte bloccata.
      state.locked = true;
    } else if (!tourDismissed()){
      // primo utilizzo: tour, poi creazione accesso
      state.showTour = true;
    } else {
      state.needsSetup = true;
    }
    /* Condizioni: se non sono ancora accettate (primo avvio o versione nuova)
       si chiedono prima di tutto. Il tour, quando parte, le presenta lui alla
       fine; il blocco resta attivo perché il render le mostra comunque prima
       della schermata di accesso. */
    if (!termsAccepted() && !state.showTour) state.needsTerms = true;
  }
  // con il blocco attivo l'archivio si carica solo dopo l'accesso:
  // prima di allora la chiave non c'e' e i dati restano cifrati
  if (!state.locked){
    try { await hydrateStores(); }
    catch(e){ console.warn("Idratazione archivio fallita:", e); }
  }

  if (state.mode === "client") await initClientMode();
  else if (state.mode === "richiesta") initRichiestaMode();
  else render();
})();

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {/* ok offline, non blocca l'app */});
  });
}

/* ============================================================
   MULTI-STEP FORM — due fasi:
   • FASE CLIENTE (step 1-6): anagrafica → firma. Compilabile
     anche da remoto dal cliente.
   • FASE STUDIO (step 7-8): dati seduta + controfirma, compilati
     in studio il giorno dell'appuntamento davanti al cliente.
   ============================================================ */
const STEP_LABELS = ["Anagrafica","Sanitario","Zona","Rischi e consenso","Privacy e disegno","Firma cliente","Dati seduta","Controfirma"];

function renderStudioForm(){
  return `
  <div class="topbar">

  </div>
  <div class="main-inner">
    <div class="step-progress">
      <span class="lbl">Passo ${state.step} di ${STEP_LABELS.length}</span>
      <span class="track"><i style="width:${Math.round(state.step / STEP_LABELS.length * 100)}%"></i></span>
    </div>
    <div class="steps">

}

function renderStepBody(step, ctx){
  if (step === 1) return renderStepAnagrafica(ctx);
  if (step === 2) return renderStepSanitario(ctx);
  if (step === 3) return renderStepZona(ctx);
  if (step === 4) return renderStepInformativa(ctx);
  if (step === 5) return renderStepPrivacyDisegno(ctx);
  if (step === 6) return renderStepFirma(ctx);
  if (step === 7) return renderStepSeduta(ctx);
  if (step === 8) return renderStepControfirma(ctx);
  return "";
}

function renderErrors(step){
  const errs = state.showErrors === step ? validateStep(step) : [];
  if (!errs.length) return "";
  return `<div class="callout warn" style="margin-bottom:18px;">${errs.map(esc).join("<br>")}</div>`;
}

  ${needles.length ? `
    <div class="field" style="margin-top:8px;">
      <select data-action="seduta-add-needle">
        <option value="">+ Aggiungi ago dall'archivio…</option>
        ${needles.filter(it => !selNeedle.has(it.id)).map(it => `<option value="${it.id}">${esc(it.tipo)}${it.marca?` · ${esc(it.marca)}`:""} · lotto ${esc(it.lotto||"—")}${it.scadenza?` · scad. ${fmtDate(it.scadenza)}`:""}</option>`).join("")}
      </select>
    </div>` : `<p class="section-desc">Nessun ago in archivio. <a href="#" data-action="nav" data-view="magazzino">Aggiungine nel Magazzino</a> per selezionarli qui.</p>`}

  <div class="field" style="margin-top:14px;"><label>Note aggiuntive sui materiali (facoltativo)</label><input type="text" data-field="seduta.materiali" value="${esc(s.materiali)}" placeholder="Es. cartuccia sterile monouso, altro…"></div>
  <div class="check-row">
    <input type="checkbox" id="schedatecnica" data-action="toggle-schedatecnica" ${s.schedaTecnicaAllegata?"checked":""}>
    <label for="schedatecnica" class="ct">Scheda tecnica delle sostanze usate allegata al fascicolo cliente</label>
  </div>
  <div class="field"><label>Eventuali reazioni avverse riscontrate</label><textarea data-field="seduta.reazioniAvverse" placeholder="Da compilare anche a un controllo successivo…">${esc(s.reazioniAvverse)}</textarea></div>
  ${renderFormNav(7, ctx)}`;
}

function renderStepControfirma(ctx){
  const zonaSummary = draft.zonaMode === "sagoma"
    ? `${draft.markers.length} punto/i sulla sagoma${draft.zonaLibera ? " — " + esc(draft.zonaLibera) : ""}`
    : `${draft.zone.map(esc).join(", ") || "—"}${draft.zonaLibera ? " (" + esc(draft.zonaLibera) + ")" : ""}`;
  return `
  ${renderErrors(8)}
  <h3 class="section-title">Controfirma del tatuatore</h3>
  <p class="section-desc">Rivedi il riepilogo, poi firma per archiviare il documento.</p>
  <div class="card" style="background:var(--paper);margin-bottom:16px;">
    <div class="kv"><span>Cliente</span><b>${esc(draft.anagrafica.cognome)} ${esc(draft.anagrafica.nome)}</b></div>
    <div class="kv"><span>Nato/a il</span><b>${fmtDate(draft.anagrafica.nascita)}</b></div>
    <div class="kv"><span>Tipo</span><b>${draft.tipoApplicazione === 'piercing' ? 'Piercing' : 'Tatuaggio'}</b></div>
    <div class="kv"><span>Data seduta</span><b>${draft.seduta.dataApplicazione ? fmtDate(draft.seduta.dataApplicazione) : "— (da compilare)"}</b></div>
    <div class="kv"><span>Zona</span><b>${zonaSummary}</b></div>
    <div class="kv"><span>Grandezza</span><b>${esc(draft.grandezza || "—")}</b></div>
    <div class="kv"><span>Nei nell'area</span><b>${draft.zoneNei === 'si' ? "Sì — vedi nota" : "No"}</b></div>
    <div class="kv"><span>Inchiostri / Aghi</span><b>${(draft.seduta.inchiostri||[]).length} inchiostro/i · ${(draft.seduta.aghi||[]).length} ago/aghi</b></div>
    <div class="kv"><span>Consenso e privacy</span><b>${draft.informativaLetta && draft.privacyConsenso && draft.disegnoConfermato ? "Confermati" : "Incompleti"}</b></div>
    <div class="kv"><span>Firma cliente</span><b>${draft.firmaClienteAt ? fmtDateTime(draft.firmaClienteAt) : "Mancante"}</b></div>
  </div>
  <div class="field">
    <label>Artista</label>
    <select data-field="artista">
      ${STUDIO_CONFIG.artists.map(a => `<option value="${esc(a)}" ${draft.artista===a?"selected":""}>${esc(a)}</option>`).join("")}
    </select>
  </div>
  <div class="field"><label>Note tecniche (facoltativo)</label><textarea data-field="noteStudio" placeholder="Note interne…">${esc(draft.noteStudio)}</textarea></div>
  <div class="sigpad-wrap">
    ${!draft.controfirmaData ? '<div class="sigpad-placeholder">Controfirma qui</div>' : ""}
    <canvas id="sig-canvas"></canvas>
  </div>
  <div class="btn-row" style="margin-top:10px;">
    <button class="btn btn-ghost btn-sm" data-action="clear-sig" data-target="controfirmaData">Cancella firma</button>
    ${draft.status === "archiviato" ? `<button class="btn btn-ghost btn-sm" data-action="save-draft">Salva modifiche</button>` : ""}
    ${draft.status === "archiviato" && draft.anagrafica.telefono ? `<a class="btn btn-accent btn-sm" href="${waLink(draft.anagrafica.telefono, aftercareMessage(draft))}" target="_blank" rel="noopener">${icon("chat",15)} Invia aftercare</a>` : ""}
  </div>
  ${renderFormNav(8, ctx)}`;
}

function renderFormNav(step, ctx){
  const isClient = ctx === "client";
  const lastClientStep = CLIENT_LAST_STEP; // 6
  const lastStudioStep = 8;
  const isLast = isClient ? step === lastClientStep : step === lastStudioStep;
  let nextLabel = 'Avanti ' + icon("arrowRight",15);
  let nextAction = "next-step";
  if (isLast && isClient) { nextLabel = "Invia allo studio"; nextAction = "submit-client"; }
  if (isLast && !isClient) {
    if (draft.status === "archiviato") { nextLabel = icon("download",15) + ' Scarica di nuovo il PDF'; nextAction = "download-pdf"; }
    else { nextLabel = "Archivia consenso"; nextAction = "finalize-studio"; }
  }
  return `
  <div class="btn-row">
    ${step > 1 ? `<button class="btn btn-ghost" data-action="prev-step">${icon("arrowLeft",15)} Indietro</button>` : ""}
    <button class="btn ${isLast ? "btn-accent" : "btn-primary"}" data-action="${nextAction}">${nextLabel}</button>
  </div>`;
}
</script>
</body>
</html>
